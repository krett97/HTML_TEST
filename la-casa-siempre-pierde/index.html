<title>La Casa Siempre Pierde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* Layout: one narrow casino cabinet — the boss on top, the machine in the middle, the back room (Taller, Retos, Duelo, Pagos) below. Single night-casino look by choice. */
:root{
  --velvet:#1f0d19; --velvet-2:#2e1426; --velvet-3:#45203a; --cabinet:#140710;
  --brass:#e3b45c; --brass-dim:#8f6d36;
  --cream:#f7ecd6; --cream-dim:#cdb99d;
  --ink:#2a1220;
  --led:#ff4b5c; --led-dim:#4a1822; --led-deep:#d42638; --led-hi:#ff9a9a; --led-shadow:#6e0e1c;
  --mint:#7fdcc4; --mint-deep:#2f8c76;
  --reel-bg:#fbf4e6; --own-bg:#e8f7f1;
  --line:rgba(227,180,92,.24);
  --glow:rgba(227,180,92,.13); --carpet:rgba(227,180,92,.035);
  --reel-shade:rgba(42,18,32,.38); --reel-veil:rgba(251,244,230,.42);
  --win-tint:rgba(227,180,92,.20); --scrim:rgba(10,3,8,.76); --lens-dim:rgba(10,3,8,.5);
  --font-display:'Bungee','Arial Black',Impact,sans-serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-led:'Silkscreen',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--velvet)}
body{
  margin:0;
  background-color:var(--velvet);
  background-image:
    radial-gradient(ellipse at 50% -10%, var(--glow) 0, transparent 55%),
    repeating-linear-gradient(45deg, var(--carpet) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(-45deg, var(--carpet) 0 2px, transparent 2px 22px);
  color:var(--cream);
  font:15px/1.45 var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 40px;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--velvet)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.cab{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--velvet);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.marquee{font-family:var(--font-display);font-size:15px;line-height:1.1;color:var(--brass);letter-spacing:.02em}
.room{font-size:12px;color:var(--cream-dim)}
.wallet{display:flex;gap:6px;flex-shrink:0}
.chip{display:flex;flex-direction:column;align-items:flex-end;padding:4px 9px;border-radius:9px;background:var(--velvet-2);border:1px solid var(--line);min-width:70px}
.chip .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--cream-dim)}
.chip .num{font-family:var(--font-led);font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip.coins .num{color:var(--brass)}
.chip.rencor .num{color:var(--led)}
.chip.bump{animation:bump .4s ease-out}
@keyframes bump{30%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Boss */
.boss{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:16px;background:var(--velvet-2);border:1px solid var(--line)}
.head{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 7px;border-radius:14px 14px 8px 8px;background:var(--cabinet);border:2px solid var(--brass-dim)}
#face{width:96px;height:48px;display:block}
.nameplate{font-family:var(--font-led);font-size:9px;letter-spacing:.06em;color:var(--brass);white-space:nowrap}
.speech{position:relative;min-width:0;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:68px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.speech::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--cream)}
.speech p{margin:0;font-size:14px;line-height:1.35}
.bonus{font-size:12px;font-weight:700;color:var(--led-deep)}

/* Machine */
.machine{position:relative;padding:12px;border-radius:20px;background:linear-gradient(var(--velvet-3),var(--velvet-2));border:2px solid var(--brass-dim);box-shadow:inset 0 0 0 4px var(--velvet)}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;margin-bottom:10px;padding:8px 10px;border-radius:10px;background:var(--velvet);border:1px dashed var(--brass-dim);font-size:13px}
.hud b{font-family:var(--font-display);font-weight:400;color:var(--brass);font-size:13px}
.hud .goal{flex-basis:100%;color:var(--cream-dim);font-size:12px}
.hud .quit{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--cream-dim);font-size:12px}
.her-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 10px;border-radius:10px;background:var(--cabinet);border:1px solid var(--led-dim)}
.her-row .who{font-family:var(--font-led);font-size:10px;color:var(--led);width:58px;line-height:1.2}
.minis{display:flex;gap:5px}
.mini{--cell:40px;width:40px;height:40px;border-radius:7px;background:var(--reel-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.her-row .what{font-size:12px;color:var(--cream);min-width:0}
.reels{--cell:62px;position:relative;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.reels[data-n="4"]{--cell:54px}
.reel{position:relative;height:calc(var(--cell) * 3);overflow:hidden;border-radius:10px;background:var(--reel-bg);box-shadow:inset 0 12px 14px -8px var(--reel-shade),inset 0 -12px 14px -8px var(--reel-shade)}
.reel.own{background:var(--own-bg);box-shadow:inset 0 0 0 2px var(--mint),inset 0 12px 14px -8px var(--reel-shade),inset 0 -12px 14px -8px var(--reel-shade)}
.reel.held{box-shadow:inset 0 0 0 3px var(--mint-deep),inset 0 12px 14px -8px var(--reel-shade)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:var(--cell);background:var(--reel-veil);z-index:1;pointer-events:none}
.reel::before{top:0}.reel::after{bottom:0}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:var(--cell);display:flex;align-items:center;justify-content:center}
.payline{position:absolute;left:-6px;right:-6px;top:var(--cell);height:var(--cell);border-block:2px solid var(--brass);border-radius:4px;pointer-events:none;z-index:2;transition:box-shadow .2s,background .2s}
.payline.win{background:var(--win-tint);box-shadow:0 0 20px var(--brass)}
.sym{font-size:calc(var(--cell) * .54);line-height:1}
.sym-S{font-family:var(--font-display);font-size:calc(var(--cell) * .66);color:var(--led-deep);-webkit-text-stroke:1px var(--ink)}
.sym-R{font-family:var(--font-display);font-size:calc(var(--cell) * .25);background:var(--ink);color:var(--cream);padding:.28em .4em;border-radius:4px;letter-spacing:.04em}
.nz{position:absolute;left:3px;right:3px;height:calc(var(--cell) - 6px);z-index:3;border:0;border-radius:8px;background:transparent;display:none;color:var(--mint-deep);font:700 12px var(--font-body)}
.nz.up{top:3px}.nz.down{bottom:3px}
.can-nudge .nz{display:block;outline:2px dashed var(--mint-deep);outline-offset:-2px}
.nz span{position:absolute;right:4px;font-size:11px;background:var(--mint);color:var(--ink);border-radius:999px;padding:0 6px}
.nz.up span{top:3px}.nz.down span{bottom:3px}
.holds{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;margin-top:8px}
.hold{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--velvet);color:var(--cream-dim);font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase}
.hold[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.hold:disabled{opacity:.4}
.result{margin-top:10px;text-align:center;font-family:var(--font-display);font-size:16px;line-height:1.25;min-height:40px;text-wrap:balance}
.result .sub{display:block;margin-top:2px;font-family:var(--font-body);font-size:12px;color:var(--cream-dim)}
.result .good{color:var(--brass)}
.machine.replay-on .reels{filter:sepia(.7) contrast(1.05)}
.replay-tag{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;font:11px var(--font-led);color:var(--cream);background:var(--led-deep);padding:3px 8px;border-radius:4px;white-space:nowrap;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.lens{position:absolute;z-index:5;border:3px solid var(--mint);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px var(--lens-dim)}
.lens span{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;font:600 13px var(--font-body);color:var(--ink);background:var(--mint);padding:2px 8px;border-radius:6px}
.stamp{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none;font:52px var(--font-display);color:var(--brass);text-shadow:0 4px 0 var(--ink),0 0 26px var(--brass);transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.clank{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%) rotate(6deg);font:22px var(--font-display);color:var(--mint);text-shadow:0 2px 0 var(--ink);pointer-events:none;animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}

/* Controls */
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"bets spin" "charges spin";gap:8px 14px;align-items:center}
.bets{grid-area:bets;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bets .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);width:100%}
.bet{min-width:46px;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--velvet-2);color:var(--cream);font:14px var(--font-led)}
.bet[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.bet:disabled{opacity:.35}
.side{grid-area:spin;display:flex;flex-direction:column;align-items:center;gap:8px}
.spin{width:100px;height:100px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--led-hi),var(--led) 42%,var(--led-deep));color:var(--cream);font:21px var(--font-display);line-height:1;box-shadow:0 6px 0 var(--led-shadow),0 0 0 4px var(--brass-dim);transition:transform .08s,box-shadow .08s}
.spin small{display:block;margin-top:4px;font:600 11px var(--font-body);letter-spacing:.02em}
.spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--led-shadow),0 0 0 4px var(--brass-dim)}
.spin:disabled{filter:grayscale(.75) brightness(.7);cursor:default}
.spin.floor{background:radial-gradient(circle at 35% 30%,var(--cream),var(--brass) 55%,var(--brass-dim));color:var(--ink);font-size:13px}
.stand{padding:9px 14px;border-radius:12px;border:1px solid var(--brass);background:var(--brass);color:var(--ink);font:15px var(--font-display)}
.own-toggle{padding:7px 10px;border-radius:10px;border:1px solid var(--mint);background:transparent;color:var(--mint);font:600 12px var(--font-body)}
.own-toggle[aria-pressed="true"]{background:var(--mint);color:var(--ink)}
.charges{grid-area:charges;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--velvet-2);border:1px solid var(--line);color:var(--cream-dim);white-space:nowrap}
.pill b{color:var(--mint);font-weight:700}
.pill.red b{color:var(--led)}
.flaco{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--cream-dim);padding:8px 12px;border-radius:10px;background:var(--velvet-2);border:1px solid var(--line)}
.flaco b{color:var(--cream);font-weight:600}
.flaco .fl-line{display:flex;gap:4px;align-items:center;--cell:26px}
.flaco .sym-R{font-size:8px}

/* Tabs + panels */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--velvet-2);border:1px solid var(--line)}
.tab{position:relative;padding:10px 4px;border:0;border-radius:9px;background:transparent;color:var(--cream-dim);font:600 13px var(--font-body)}
.tab[aria-selected="true"]{background:var(--velvet-3);color:var(--cream)}
.tab.ping::after{content:"";position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led)}
.panel{display:flex;flex-direction:column;gap:8px}
.note{margin:0;font-size:13px;color:var(--cream-dim)}
.note b{color:var(--cream)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--velvet-2);border:1px solid var(--line)}
.item h3{margin:0;grid-column:1;font:600 15px var(--font-body);color:var(--cream)}
.item p{margin:0;grid-column:1;font-size:13px;color:var(--cream-dim)}
.item .tag{grid-column:1;font:10px var(--font-led);color:var(--mint);letter-spacing:.04em}
.item .act{grid-column:2;grid-row:1 / span 3}
.item.locked{border-style:dashed;opacity:.62}
.item.hot{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.item.won{opacity:.7}
.buy{padding:9px 12px;border-radius:10px;border:1px solid var(--brass);background:transparent;color:var(--brass);font:600 13px var(--font-body);white-space:nowrap}
.buy.r{border-color:var(--led);color:var(--led)}
.buy.go{background:var(--brass);color:var(--ink)}
.buy:disabled{opacity:.4;cursor:default}
.paytable{width:100%;border-collapse:collapse;font-size:14px}
.paytable th{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.paytable th:first-child,.paytable td:first-child{text-align:left}
.paytable td{padding:6px 8px;text-align:right;font-family:var(--font-led);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);--cell:30px}
.paytable td:first-child{font-family:var(--font-body)}
.paytable .sym-R{font-size:9px}
.edge{padding:12px;border-radius:12px;background:var(--cabinet);border:1px solid var(--line)}
.edge .big{font:22px var(--font-display);color:var(--brass)}
.edge .big.lose{color:var(--mint)}
.meter{height:10px;border-radius:999px;background:var(--velvet-3);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--led)}
.meter i.lose{background:var(--mint)}
.dev{display:flex;flex-wrap:wrap;gap:6px}
.dev button{padding:7px 10px;border-radius:9px;border:1px dashed var(--line);background:transparent;color:var(--cream-dim);font-size:12px}
.knows{margin:0;padding-left:18px;font-size:13px;color:var(--cream-dim)}
.knows li+li{margin-top:3px}
.knows .new{color:var(--cream)}

/* Modal + toast */
.modal-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-height:620px){.modal-wrap{align-items:center}}
.modal{width:100%;max-width:440px;max-height:86vh;overflow:auto;background:var(--velvet-2);border:2px solid var(--brass-dim);border-radius:18px;padding:18px}
.modal h2{margin:0 0 10px;font:20px/1.15 var(--font-display);color:var(--brass);text-wrap:balance}
.modal p{margin:0 0 10px;font-size:14px}
.modal .gain{color:var(--led);font-weight:700}
.modal .muted{color:var(--cream-dim);font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--velvet-3);color:var(--cream);font:600 14px var(--font-body)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.ed-reel{margin-top:12px}
.ed-head{font-size:12px;color:var(--cream-dim);margin-bottom:6px}
.ed-syms{display:flex;flex-wrap:wrap;gap:5px;--cell:40px}
.ed-sym{width:42px;height:42px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--reel-bg);display:flex;align-items:center;justify-content:center}
.ed-sym:disabled{opacity:.35;cursor:default}
.ed-sym .sym-R{font-size:9px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(420px,calc(100% - 32px));padding:10px 14px;border-radius:12px;background:var(--cream);color:var(--ink);font-size:14px;font-weight:500;box-shadow:0 8px 24px var(--scrim);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:370px){.boss{grid-template-columns:96px minmax(0,1fr)}.spin{width:86px;height:86px;font-size:18px}.marquee{font-size:13px}}
</style>

<div class="cab">
  <header class="bar">
    <div class="brand">
      <span class="marquee">La Casa Siempre Pierde</span>
      <span class="room">Sala 1 · Doña Tragona</span>
    </div>
    <div class="wallet">
      <div class="chip coins" id="chipCoins"><span class="lbl">Monedas</span><span class="num" id="coins">20</span></div>
      <div class="chip rencor" id="chipRencor"><span class="lbl">Rencor</span><span class="num" id="rencor">0</span></div>
    </div>
  </header>

  <section class="boss" aria-label="Doña Tragona">
    <div class="head">
      <canvas id="face" width="96" height="48" aria-hidden="true"></canvas>
      <div class="nameplate">DOÑA TRAGONA</div>
    </div>
    <div class="speech" aria-live="polite">
      <p id="speechText">Bienvenido a mi casino. Tu dinero ya es mío; solo falta que lo metas.</p>
      <span class="bonus" id="speechBonus" hidden></span>
    </div>
  </section>

  <section class="machine" id="machine" aria-label="Tragamonedas">
    <div class="hud" id="hud" hidden></div>
    <div class="her-row" id="herRow" hidden>
      <span class="who">MÁQUINA DE TRAGONA</span>
      <div class="minis" id="minis"></div>
      <span class="what" id="herWhat"></span>
    </div>
    <div class="reels" id="reels"></div>
    <div class="holds" id="holds"></div>
    <div class="result" id="result" aria-live="polite">Toca TIRAR.<span class="sub">Tres 7 en la línea del centro pagan ×100.</span></div>
    <div class="replay-tag" id="replayTag" hidden>REPETICIÓN · CÁMARA LENTA</div>
  </section>

  <section class="controls" aria-label="Controles">
    <div class="bets" id="bets" role="group" aria-label="Apuesta"></div>
    <div class="side">
      <button class="spin" id="spin" type="button">TIRAR</button>
      <button class="stand" id="stand" type="button" hidden>PLANTARSE</button>
      <button class="own-toggle" id="ownToggle" type="button" aria-pressed="false" hidden>Usar tu rodillo</button>
    </div>
    <div class="charges" id="charges"></div>
  </section>

  <div class="flaco" id="flaco" hidden></div>

  <nav class="tabs" role="tablist" aria-label="Trastienda">
    <button class="tab" role="tab" id="tab-taller" data-tab="taller" type="button">Taller</button>
    <button class="tab" role="tab" id="tab-retos" data-tab="retos" type="button">Retos</button>
    <button class="tab" role="tab" id="tab-duelo" data-tab="duelo" type="button">Duelo</button>
    <button class="tab" role="tab" id="tab-pagos" data-tab="pagos" type="button">Pagos</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="acts" id="modalActs"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
'use strict';

// ===== ENGINE START =====
// Pure rules of the machine. Shared by the game and by the balance simulation.
var SYM = {

    if (st === 'won') return item({ cls: 'won', tag: 'SUPERADO', name: R.name, desc: R.goal + ' Premio: ' + R.reward + '.' });
    if (st === 'locked') return item({ cls: 'locked', name: R.name, desc: 'Se abre al superar el reto anterior. Premio: ' + R.reward + '.' });
    return item({ cls: 'hot', tag: 'ENTRADA ' + R.entry + ' MONEDAS', name: R.name, desc: R.goal + ' ' + R.detail + ' <b>Premio: ' + R.reward + '.</b>',
      btn: mode === 'free' ? btn('reto', id, 'Jugar', 'coins', R.entry, 'go') : '' });
  }).join('');
}
function renderDuelo() {
  var h = [];
  if (state.duelWon) {
    h.push(item({ cls: 'won', tag: 'VENCIDA', name: 'Doña Tragona', desc: 'Le ganaste el duelo y le robaste el Resbalón. La Sala 2 llegará en otra versión del prototipo.' }));
  }
  h.push('<div class="item' + (state.coins >= DUEL.entry && !state.duelWon ? ' hot' : '') + '"><span class="tag">ENTRADA ' + fmt(DUEL.entry) + ' MONEDAS</span><h3>Duelo contra Tragona</h3>' +
    '<p>Al mejor de 3 rondas. Ella tira primero (dos veces, se queda con la mejor) y tú tienes que superar su jugada. Puedes retener y volver a tirar una vez por ronda, empujar, y plantarte.</p>' +
    (mode === 'free' ? btn('duel', 'duel', state.duelWon ? 'Revancha' : 'Retar', 'coins', DUEL.entry, 'go') : '') + '</div>');
  h.push('<div class="item"><h3>Lo que sabes de Tragona</h3><ul class="knows">' +
    '<li>Tira primero, dos veces, y se queda con la mejor.</li><li>Los empates son de la casa.</li>' +
    '<li>Gana quien tenga más símbolos iguales; si empatan, el más alto: 7 › BAR › campana › cereza › limón. Cuatro limones le ganan a un 7-7-7.</li>' +
    (state.knows.r2 ? '<li class="new">En la ronda 2 esconde un 7 de cada uno de tus rodillos.</li>' : '<li>Ronda 2: ???</li>') +
    (state.knows.r3 ? '<li class="new">En la ronda 3 siempre saca 7-7-7.</li>' : '<li>Ronda 3: ???</li>') + '</ul></div>');
  return h.join('');
}
function renderPagos() {
  var e = edgeInfo(), lose = e.back > 100;
  var rows = ['S', 'R', 'B', 'C', 'L'].map(function (s) {
    return '<tr><td>' + symHTML(s) + ' ' + SYM[s].name + '</td><td>×' + PAY.tri[s] + '</td><td>' + (PAY.pair[s] ? '×' + PAY.pair[s] : '—') + '</td><td>×' + PAY.tri[s] * PAY.quad + '</td></tr>';
  }).join('');
  return '<div class="edge"><span class="tag" style="font:10px var(--font-led);color:var(--cream-dim)">VENTAJA DE LA CASA</span>' +
    '<div class="big' + (lose ? ' lose' : '') + '">' + (lose ? 'La casa pierde ' + (e.back - 100) + '%' : 'La casa gana ' + (100 - e.back) + '%') + '</div>' +
    '<div class="meter"><i class="' + (lose ? 'lose' : '') + '" style="width:' + Math.min(100, e.back / 1.5) + '%"></i></div>' +
    '<p class="note">Con tus rodillos de ahora recuperas <b>' + e.back + '</b> de cada 100 monedas que apuestas, en promedio, sin contar Retener ni Empujón. Pierdes en ' + Math.round(e.ploss * 100) + '% de las tiradas.</p></div>' +
    '<div class="item" style="display:block"><h3>Tabla de pagos</h3><p style="margin-bottom:6px">Paga la línea del centro. Se cuenta cuántos símbolos iguales hay, estén donde estén.</p>' +
    '<div style="overflow-x:auto"><table class="paytable"><thead><tr><th>Símbolo</th><th>Trío</th><th>Par</th><th>Cuatro</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p style="margin-top:6px">Un par de cerezas o campanas te devuelve la apuesta. Cuatro iguales solo con tu rodillo.</p></div>' +
    '<div class="item" style="display:block"><h3>Herramientas del prototipo</h3><p style="margin-bottom:8px">Para probar partes del juego sin jugar todo.</p><div class="dev">' +
    '<button type="button" data-act="dev" data-id="coins">+500 monedas</button><button type="button" data-act="dev" data-id="rencor">+100 Rencor</button>' +
    '<button type="button" data-act="dev" data-id="skip">Saltar al descubrimiento</button><button type="button" data-act="dev" data-id="sound">Sonido: ' + (state.sound ? 'sí' : 'no') + '</button>' +
    '<button type="button" data-act="dev" data-id="reset" id="resetBtn">Reiniciar partida</button></div></div>';
}
function renderPanel() {
  var p = $('#panel');
  p.innerHTML = tab === 'taller' ? renderTaller() : tab === 'retos' ? renderRetos() : tab === 'duelo' ? renderDuelo() : renderPagos();
  refreshAfford();
}
function refreshAfford() {
  document.querySelectorAll('#panel [data-cur]').forEach(function (b) {
    var cur = b.dataset.cur, cost = +b.dataset.cost;
    var blockedByMode = mode !== 'free' && ['flaco', 'flacoSpeed', 'flacoBet'].indexOf(b.dataset.id) < 0;
    b.disabled = busy || blockedByMode || state[cur] < cost;
  });
}
function ui() { updateWallet(); updateControls(); updateHolds(); updateHud(); renderPanel(); updateTabs(); }

var resetArm = 0;
function dev(id) {
  if (busy) return;
  if (id === 'coins') { state.coins += 500; bump('coins'); }
  if (id === 'rencor') { state.rencor += 100; bump('rencor'); }
  if (id === 'skip' && !state.revealed) { state.revealed = true; state.nearMisses = NEAR_AT.length; state.spins = Math.max(state.spins, 12); state.rencor += 30; toast('Saltaste al descubrimiento del resbalón.'); }
  if (id === 'sound') { state.sound = !state.sound; }
  if (id === 'reset') {
    if (Date.now() - resetArm > 3000) { resetArm = Date.now(); ui(); var rb = $('#resetBtn'); if (rb) rb.textContent = '¿Seguro? Toca otra vez'; return; }
    if (mode !== 'free') { toast('Termina el reto o el duelo primero.'); return; }
    state = freshState(); M.sig = ''; M.stops = []; setMachine(freeStrips()); last = { pay: 0, bet: 1 };
    say('welcome', 'smug'); setResult('Toca TIRAR.', 'Tres 7 en la línea del centro pagan ×100.');
    $('#flaco').hidden = true; resetArm = 0;
  }
  ui(); save();
}

// ---------- Wiring ----------
$('#spin').addEventListener('click', function () {
  audio();
  if (busy) return;
  if (mode === 'free') freeSpin(); else if (mode === 'reto') retoSpin(); else if (mode === 'duel') duelPrimary();
});
$('#stand').addEventListener('click', stand);
$('#ownToggle').addEventListener('click', toggleOwn);
$('#panel').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  audio();
  var act = b.dataset.act, id = b.dataset.id;
  if (act === 'buy') buy(id); else if (act === 'reto') startReto(id); else if (act === 'duel') startDuel(); else if (act === 'dev') dev(id);
});
document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
document.querySelector('.tabs').addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var order = ['taller', 'retos', 'duelo', 'pagos'], i = order.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1);
  setTab(order[(i + order.length) % order.length]); $('#tab-' + tab).focus();
});
window.addEventListener('resize', function () { M.strips.forEach(function (_, k) { placeReel(k, M.stops[k]); }); });
document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);

function boot() {
  load();
  buildBets();
  setMachine(freeStrips());
  drawFace(restMood(), 0);
  if (state.spins === 0) say('welcome', 'smug');
  else if (state.duelWon) say('defeated', 'sulky');
  else say('back', 'smug');
  if (state.has.flaco) { $('#flaco').hidden = false; $('#flaco').innerHTML = '<span><b>El Flaco</b> juega por ti</span><span>esperando…</span>'; }
  ui();
  offline().then(function () { ui(); save(); });
  window.__lcsp = { get state() { return state; }, set state(s) { state = s; }, M: M, ui: ui, get mode() { return mode; }, get ctx() { return ctx; }, get busy() { return busy; } };
}
boot();
})();
</script>
