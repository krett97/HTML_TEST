<script>
  /* Tema temprano (evita parpadeo). Acceso a localStorage protegido: el iframe de GAS puede bloquearlo. */
  (function () {
    var t = null;
    try { t = window.localStorage.getItem('space10.tema'); } catch (e) { t = null; }
    if (t !== 'light' && t !== 'dark') {
      try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; }
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.card {
  position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--border);

[data-theme="dark"] .badge-nuevo { color: var(--aqua); }
.badge-vivo { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--ok-bg); color: var(--ok-text); }
.card-title { font-size: 15.5px; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; overflow-wrap: anywhere; }
.card-title button { text-align: left; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-radius: 4px; overflow-wrap: anywhere; }
.card-title button:hover { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.card-desc { font-size: 13px; line-height: 1.55; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(1.55em * 3); overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; color: var(--text-3); }
.card-meta .m { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.card-meta .m .i { font-size: 13px; }
.tecs { display: flex; flex-wrap: wrap; gap: 5px; }
.chip-tec { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border-2); font-size: 11.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--tag-bg); color: var(--tag-text); white-space: nowrap; transition: filter .15s, box-shadow .15s; }
.tag:hover { box-shadow: inset 0 0 0 1px currentColor; }
.tag.mas { background: var(--surface-3); color: var(--text-3); }
.card-foot { display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); min-width: 0; }
.card-foot .autor { min-width: 0; flex: 1; line-height: 1.4; overflow-wrap: anywhere; }
.card-foot .autor time { white-space: nowrap; }
.card-foot .autor strong { color: var(--text-2); font-weight: 600; }
.visitas { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.visitas .i { font-size: 14px; }
.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; background: var(--av, #004481); flex: none; letter-spacing: .02em; }
.card-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-top: 1px solid var(--border); }
.card-actions .der { margin-left: auto; display: flex; align-items: center; gap: 3px; border-radius: 10px; }
.card-actions .der.como-admin { padding: 2px 2px 2px 7px; background: var(--warn-bg); }
.adm-tag { position: relative; display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--warn-text); padding-right: 3px; }
.adm-tag .i { font-size: 13px; }
.card-actions .btn-open, .card-actions .btn-ghost { height: 30px; }
.card-actions .btn-ghost.solo-ico { width: 30px; }
.btn-open {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: var(--primary-bg); color: var(--primary-text); white-space: nowrap; transition: background-color .15s, transform .15s;
}
.btn-open:hover { background: var(--primary-bg-hover); text-decoration: none; }
.btn-open .i { font-size: 14px; }
.btn-open.pendiente { background: transparent; color: var(--text-3); border: 1px dashed var(--border-2); }
.btn-open.pendiente.editable { color: var(--warn-text); border-color: rgba(217, 119, 6, .45); }
.btn-open.pendiente.editable:hover { background: var(--warn-bg); border-style: solid; }
.btn-open.pendiente.editable .i-ed { opacity: .75; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s;
}
.btn-ghost:hover:not(:disabled) { border-color: var(--border-2); color: var(--text); background: var(--surface-3); text-decoration: none; }
.btn-ghost:disabled { opacity: .5; }
.btn-ghost .i { font-size: 14px; }
.btn-ghost.peligro:hover:not(:disabled) { color: var(--danger-text); border-color: rgba(220, 38, 38, .4); background: var(--danger-bg); }
.btn-ghost.solo-ico { width: 32px; padding: 0; justify-content: center; }
.admin-hint { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--warn-text); background: var(--warn-bg); }
.admin-hint .i { font-size: 11px; }
.link-mini { font-size: 12px; font-weight: 600; color: var(--link); padding: 0 4px; }
.link-mini:hover { text-decoration: underline; }
/* Etiquetas de acciones por niveles: siempre caben en una sola fila */
@container (max-width: 700px) {
  .card .lbl-opt { display: none; }
  .card .btn-ghost.con-opt:not(.con-ed) { width: 30px; padding: 0; justify-content: center; }
  .card .adm-tag { padding-right: 1px; }
  .card .adm-tag .lbl-adm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
}
@container (max-width: 470px) {
  .card .lbl-ed { display: none; }
  .card .btn-ghost.con-ed { width: 30px; padding: 0; justify-content: center; }
}
@container (max-width: 420px) {
  .card .autor .sep { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  .card .autor time { display: block; }
}

/* Vacíos, error y esqueletos */
.vacio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 44px 24px; border: 1px dashed var(--border-2); border-radius: 14px; background: var(--surface); margin-top: 16px; }
.vacio .vac-ico { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--c-soft, var(--surface-3)); color: var(--c-fg, var(--c, var(--text-3))); margin-bottom: 4px; }
.vacio .vac-ico .i { font-size: 26px; }
.vacio h3 { font-size: 16.5px; font-weight: 700; overflow-wrap: anywhere; max-width: 100%; }
.vacio p { color: var(--text-2); max-width: 520px; font-size: 13.5px; }
.vacio .acc { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.vacio-mini { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px dashed var(--border-2); border-radius: 12px; background: var(--surface); color: var(--text-2); font-size: 13px; flex-wrap: wrap; }
.vacio-mini .txt { flex: 1 1 220px; }
.sk { background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%); background-size: 400% 100%; animation: brillo 1.4s ease infinite; border-radius: 6px; }
.sk-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 250px; }
.sk-row { display: flex; gap: 12px; align-items: center; }

/* =====================================================================
   9. RESULTADOS: TABLA
   ===================================================================== */
.tabla-wrap { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: auto; max-height: min(74vh, 900px); scrollbar-width: thin; }
.tabla { width: 100%; min-width: 1210px; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tabla th {
  position: sticky; top: 0; z-index: 3; background: var(--surface-2); text-align: left; padding: 0 8px; height: 42px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border);
}
.tabla th .th-btn { display: inline-flex; align-items: center; gap: 5px; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; height: 28px; padding: 0 4px; margin: 0 -4px; border-radius: 6px; }
.tabla th .th-btn:hover { color: var(--text); background: var(--surface-3); }
.tabla th .th-btn .i { font-size: 13px; opacity: .45; }
.tabla th[aria-sort="ascending"] .th-btn, .tabla th[aria-sort="descending"] .th-btn { color: var(--text); }
.tabla th[aria-sort="ascending"] .th-btn .i, .tabla th[aria-sort="descending"] .th-btn .i { opacity: 1; color: var(--sky); }
.tabla td { padding: 11px 8px; border-bottom: 1px solid var(--border); vertical-align: top; background: var(--surface); overflow-wrap: anywhere; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tbody tr:hover td { background: var(--surface-2); }
.tabla .c-fav { padding-left: 8px; padding-right: 0; position: sticky; left: 0; z-index: 1; }
.tabla th.c-fav { z-index: 4; }
.tabla .c-nombre { position: sticky; left: 44px; z-index: 1; box-shadow: 1px 0 0 var(--border); }
.tabla th.c-nombre { z-index: 4; }
.tabla .c-acc { position: sticky; right: 0; z-index: 1; padding-left: 6px; padding-right: 8px; box-shadow: -1px 0 0 var(--border); }
.tabla th.c-acc { z-index: 4; }
.t-nombre { display: flex; gap: 10px; align-items: flex-start; }
.t-nombre .cat-ico { width: 30px; height: 30px; border-radius: 8px; }
.t-nombre .cat-ico .i { font-size: 15px; }
.t-nombre .tn { min-width: 0; }
.t-nombre button.nm { display: inline; text-align: left; font-weight: 650; font-size: 13.5px; color: var(--text); line-height: 1.4; }
.t-nombre button.nm:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.t-nombre .ds { font-size: 12px; color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
.t-nombre .bdg { display: inline-flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-left: 6px; vertical-align: 1px; }
.tabla .badge-nuevo, .tabla .badge-vivo { white-space: nowrap; overflow-wrap: normal; }
.t-nombre .bdg .pin-ind { width: auto; height: auto; }
.t-cat { display: flex; align-items: flex-start; gap: 7px; font-weight: 500; color: var(--text-2); line-height: 1.4; }
.t-cat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; margin-top: 6px; }
.t-cat-sec { font-size: 11.5px; color: var(--text-3); margin-top: 2px; padding-left: 15px; }
.t-autor { display: flex; align-items: flex-start; gap: 8px; line-height: 1.35; }
.t-autor > span:last-child { min-width: 0; padding-top: 2px; }
.t-autor .avatar { width: 22px; height: 22px; font-size: 9px; }
.t-num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla th.t-num { text-align: right; }
.t-acc { display: flex; flex-wrap: wrap; gap: 1px; justify-content: flex-end; }
.t-acc .icon-btn.pendiente-ed { color: var(--warn-text); }
.tabla .chip-tec, .tabla .tag { height: 20px; font-size: 11px; }
.tabla .estado { white-space: normal; height: auto; min-height: 21px; border-radius: 8px; padding-top: 2px; padding-bottom: 2px; line-height: 1.3; align-items: flex-start; }
.tabla .estado .estado-dot { margin-top: 4px; }
.t-fecha { white-space: nowrap; color: var(--text-2); }
.t-fecha .rel { display: block; font-size: 11.5px; color: var(--text-3); }

/* =====================================================================
   10. MODALES
   ===================================================================== */
.modal-capa {
  position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 24px; background: var(--scrim);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fundido .18s ease;
}
.modal-capa.saliendo { animation: fundido .14s ease reverse forwards; }
@keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
@keyframes emerger { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.modal {
  position: relative; display: flex; flex-direction: column; width: min(100%, var(--w, 640px)); min-width: 0; max-height: calc(100vh - 48px);
  background: var(--surface); color: var(--text); border-radius: 16px; box-shadow: var(--shadow-xl); border: 1px solid var(--border); overflow: hidden; overflow: clip;
  animation: emerger .22s cubic-bezier(.2, .8, .2, 1);
}
.modal.sm { --w: 460px; } .modal.md { --w: 660px; } .modal.lg { --w: 860px; } .modal.xl { --w: 1120px; } .modal.ficha { --w: 900px; }
.modal.admin { height: min(88vh, 860px); }
.modal-cab { display: flex; align-items: flex-start; gap: 14px; padding: 18px 18px 16px 22px; border-bottom: 1px solid var(--border); }
.modal-cab .m-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--c-soft, var(--info-bg)); color: var(--c-fg, var(--c, var(--info-text))); flex: none; }
.modal-cab .m-ico .i { font-size: 20px; }
.modal-cab .m-tit { min-width: 0; flex: 1; padding-top: 1px; }
.modal-cab h2 { font-size: 17.5px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
.modal-cab .m-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.modal-cuerpo { padding: 20px 22px; overflow: auto; flex: 1; overscroll-behavior: contain; }
.modal-pie { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
.modal-pie .nota { margin-right: auto; font-size: 12px; color: var(--text-3); min-width: 0; flex: 1 1 260px; }
.modal-pie .nota strong { color: var(--text-2); }
.alerta { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
.alerta .i { font-size: 16px; margin-top: 1px; }
.alerta-info { background: var(--info-bg); color: var(--info-text); }
.alerta-warn { background: var(--warn-bg); color: var(--warn-text); }
.alerta-error { background: var(--danger-bg); color: var(--danger-text); }
.alerta-ok { background: var(--ok-bg); color: var(--ok-text); }
.alerta button.link-mini { color: inherit; text-decoration: underline; padding: 0; }
.confirm-txt { font-size: 14px; color: var(--text-2); line-height: 1.6; }
.confirm-txt strong { color: var(--text); }

/* Ficha */
.modal.ficha::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); z-index: 2; }
.modal.ficha .modal-cab { background: linear-gradient(135deg, var(--c-soft), transparent 72%); padding-top: 20px; }
.m-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 5px; }
.m-crumb .i { font-size: 13px; }
.m-crumb .sepc { opacity: .7; }
.m-crumb .cat { color: var(--c-txt, var(--text-2)); display: inline-flex; align-items: center; gap: 5px; }
.ficha-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ficha-urls { display: grid; gap: 8px; margin-bottom: 18px; }
.url-fila { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); min-width: 0; flex-wrap: wrap; }
.url-fila .u-lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); width: 150px; flex: none; }
.url-fila .u-val { flex: 1 1 200px; min-width: 0; font-family: var(--mono); font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.url-fila .u-acc { display: flex; gap: 6px; }
.ficha-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; }
.ficha-sec h3 { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.ficha-sec + .ficha-sec { margin-top: 18px; }
.ficha-desc { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.dl { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.dl > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.dl > div:last-child { border-bottom: 0; }
.dl dt { color: var(--text-3); font-size: 12px; font-weight: 600; }
.dl dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.dl dd .sub { display: block; font-size: 12px; color: var(--text-3); }

/* Formulario */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo.span-2 { grid-column: 1 / -1; }
.campo > label, .campo .lbl { font-size: 12.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
.campo .req { color: var(--danger); }
.campo .ayuda { font-size: 12px; color: var(--text-3); }
.campo .err { font-size: 12px; color: var(--danger-text); display: flex; gap: 5px; align-items: center; }
.campo .err:empty { display: none; }
.campo .err .i { font-size: 13px; }
.campo .fila-ayuda { display: flex; justify-content: space-between; gap: 10px; }
.contador { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.contador.mal { color: var(--danger-text); font-weight: 600; }
.radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.radio-card { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--border-2); border-radius: 10px; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s; background: var(--surface); }
.radio-card input { position: absolute; opacity: 0; pointer-events: none; }
.radio-card .rc-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-2); flex: none; margin-top: 1px; display: grid; place-items: center; transition: border-color .15s; }
.radio-card .rc-dot::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--rc); transform: scale(0); transition: transform .15s; }
.radio-card .rc-t { font-size: 13px; font-weight: 600; color: var(--text); display: block; line-height: 1.3; }
.radio-card .rc-d { font-size: 11.5px; color: var(--text-3); display: block; margin-top: 2px; line-height: 1.35; }
.radio-card:hover { border-color: var(--text-3); }
.radio-card:has(input:checked) { border-color: var(--rc); background: var(--rc-bg); box-shadow: inset 0 0 0 1px var(--rc); }
.radio-card:has(input:checked) .rc-dot { border-color: var(--rc); }
.radio-card:has(input:checked) .rc-dot::after { transform: scale(1); }
.radio-card:has(input:focus-visible) { box-shadow: var(--ring); }
.check-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-card { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border-2); border-radius: 10px; cursor: pointer; background: var(--surface); transition: border-color .15s, background-color .15s; }
.check-card:hover { border-color: var(--text-3); }
.check-card input { position: absolute; opacity: 0; pointer-events: none; }
.check-card .switch-v { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--border-2); flex: none; transition: background-color .18s; margin-top: 1px; }
.check-card .switch-v::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .18s; }
.check-card:has(input:checked) { border-color: var(--primary-bg); background: var(--info-bg); }
.check-card:has(input:checked) .switch-v { background: var(--primary-bg); }
.check-card:has(input:checked) .switch-v::after { transform: translateX(14px); }
.check-card:has(input:focus-visible) { box-shadow: var(--ring); }
.check-card .ck-t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.check-card .ck-t .i { font-size: 14px; color: var(--text-3); }
.check-card .ck-d { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-sel { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--text-2); transition: background-color .15s, color .15s, border-color .15s; }
.chip-sel:hover { border-color: var(--text-3); color: var(--text); }
.chip-sel[aria-pressed="true"] { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-text); }
.chip-sel .i { font-size: 13px; }
.chip-sel.libre { padding-right: 6px; }
.tec-libre { display: flex; gap: 8px; margin-top: 8px; }
.tec-libre input { flex: 1; }
.tags-prev { display: flex; flex-wrap: wrap; gap: 5px; min-height: 22px; }
.tags-prev .vacio-txt { font-size: 12px; color: var(--text-3); }

/* Panel de administración */
.adm-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -20px -22px 18px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; background: var(--surface-2); }
.adm-tabs::-webkit-scrollbar { display: none; }
.adm-tab { display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.adm-tab .i { font-size: 15px; }
.adm-tab:hover { color: var(--text); }
.adm-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--navy-700); }
[data-theme="dark"] .adm-tab[aria-selected="true"] { border-bottom-color: var(--aqua); }
.adm-tab .cnt { font-size: 11px; padding: 0 6px; height: 18px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-3); color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.stat .s-l { font-size: 12px; color: var(--text-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .s-l .i { font-size: 14px; }
.stat .s-v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.adm-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 16px; }
.panel { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--surface); min-width: 0; }
.panel h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.panel h3 .i { font-size: 16px; color: var(--text-3); }
.barras { display: grid; gap: 9px; }
.barra { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 12.5px; }
.barra .b-l { display: flex; align-items: center; gap: 7px; color: var(--text-2); min-width: 0; }
.barra .b-l .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.barra .b-l .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.barra .b-t { height: 8px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.barra .b-t > span { display: block; height: 100%; border-radius: inherit; background: var(--c); }
.barra .b-v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.top-lista { display: grid; gap: 10px; }
.top-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.top-item .avatar { width: 30px; height: 30px; font-size: 11px; }
.top-item .ti { min-width: 0; flex: 1; }
.top-item .ti .e { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-item .tv { font-weight: 700; font-variant-numeric: tabular-nums; }
.adm-barra { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.adm-barra .campo { flex: 1 1 240px; }
.adm-barra .derecha { margin-left: auto; }
.t-simple { width: 100%; border-collapse: collapse; font-size: 13px; }
.t-simple th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); position: sticky; top: -20px; z-index: 1; }
.t-simple td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.t-simple tr:hover td { background: var(--surface-2); }
.t-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
.accion-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.ab-CREAR { background: var(--ok-bg); color: var(--ok-text); }
.ab-EDITAR, .ab-PERFIL { background: var(--info-bg); color: var(--info-text); }

.ab-ROL, .ab-FIJAR, .ab-CATEGORIA { background: var(--warn-bg); color: var(--warn-text); }
.cat-fila-ico { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--c-soft); color: var(--c-fg, var(--c)); flex: none; }
.cat-fila-ico .i { font-size: 15px; }
.icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.icon-picker button { display: grid; place-items: center; height: 40px; border-radius: 9px; border: 1px solid var(--border); color: var(--text-2); background: var(--surface); }
.icon-picker button .i { font-size: 18px; }
.icon-picker button:hover { border-color: var(--text-3); color: var(--text); }
.icon-picker button[aria-pressed="true"] { border-color: var(--c, var(--primary-bg)); background: var(--c-soft, var(--info-bg)); color: var(--c-fg, var(--c, var(--text))); box-shadow: inset 0 0 0 1px var(--c, var(--primary-bg)); }
.color-fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-2); }
.datos-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }

.res-import { margin-top: 12px; }

.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.dropzone { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1.5px dashed var(--border-2); border-radius: 12px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background-color .15s; }
.dropzone:hover { border-color: var(--text-3); }
.dropzone:focus-within { border-color: var(--focus); box-shadow: var(--ring); }
.dropzone.is-over { border-color: var(--sky); border-style: solid; background: var(--info-bg); }
.dropzone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.dropzone .dz-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--info-bg); color: var(--info-text); flex: none; }
.dropzone .dz-ico .i { font-size: 19px; }
.dropzone .dz-t { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
.dropzone .dz-d { font-size: 12px; color: var(--text-3); display: block; overflow-wrap: anywhere; }
.cargando-bloque { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px; color: var(--text-3); }

/* Exportación */
.exp-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.alcance { display: flex; gap: 8px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
.alcance legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.alcance label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--border-2); border-radius: 9px; font-size: 13px; cursor: pointer; }
.alcance label:has(input:checked) { border-color: var(--primary-bg); background: var(--info-bg); color: var(--info-text); font-weight: 600; }
.alcance input { accent-color: var(--primary-bg); }
.preview { width: 100%; height: 340px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.5; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); white-space: pre; }
.exp-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* Atajos, identidad, contribuidores */
.atajos { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.atajo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.atajo:last-child { border-bottom: 0; }
.atajo .ks { display: inline-flex; gap: 4px; align-items: center; color: var(--text-3); font-size: 12px; }
.ident-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ident { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--border-2); border-radius: 12px; text-align: left; transition: border-color .15s, background-color .15s; background: var(--surface); }
.ident:hover { border-color: var(--text-3); }
.ident[aria-pressed="true"] { border-color: var(--primary-bg); background: var(--info-bg); box-shadow: inset 0 0 0 1px var(--primary-bg); }
.ident .avatar { width: 36px; height: 36px; font-size: 13px; }
.ident .it { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ident .ie { font-size: 12px; color: var(--text-3); }
.ident .id { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.contrib { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; text-align: left; }
.contrib:hover { background: var(--surface-3); }
.contrib .avatar { width: 34px; height: 34px; font-size: 12px; }
.contrib .ci { flex: 1; min-width: 0; }
.contrib .ci .e { font-size: 12px; color: var(--text-3); }
.contrib .cv { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.perfil-cab { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: linear-gradient(135deg, var(--navy-900), var(--navy-700)); color: #fff; margin-bottom: 18px; }
.perfil-cab .avatar { width: 56px; height: 56px; font-size: 19px; background: var(--aqua); color: var(--navy-900); }
.perfil-cab .pn { font-size: 18px; font-weight: 700; }
.perfil-cab .pe { font-size: 13px; color: rgba(255, 255, 255, .75); }
.perfil-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }

/* =====================================================================
   11. TOASTS Y PIE
   ===================================================================== */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; min-width: 280px; max-width: min(420px, calc(100vw - 32px)); padding: 12px 10px 12px 14px;
  border-radius: 11px; background: #0B1A30; color: #fff; box-shadow: var(--shadow-xl); font-size: 13.5px; line-height: 1.45; border-left: 3px solid var(--aqua);
  animation: entrarToast .25s cubic-bezier(.2, .8, .2, 1);
}
[data-theme="dark"] .toast { background: #1A2A44; }
.toast .i { font-size: 17px; margin-top: 1px; }
.toast-success { border-left-color: #4ADE80; } .toast-success > .i { color: #4ADE80; }
.toast-error { border-left-color: #F87171; } .toast-error > .i { color: #F87171; }
.toast-info { border-left-color: var(--aqua); } .toast-info > .i { color: var(--aqua); }
.toast { position: relative; overflow: hidden; }
.toast .t-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--aqua); opacity: .8; transform-origin: left; animation: barraToast linear forwards; }
.toast-success .t-bar { background: #4ADE80; } .toast-error .t-bar { background: #F87171; }
@keyframes barraToast { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.toast .t-msg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .t-x { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: rgba(255, 255, 255, .6); }
.toast .t-x:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.toast .t-x .i { font-size: 14px; margin: 0; color: inherit; }
.toast.saliendo { animation: salirToast .2s ease forwards; }
@keyframes entrarToast { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes salirToast { to { opacity: 0; transform: translateX(24px); } }
.pie { padding-top: 22px; padding-bottom: 26px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
.pie .pie-l { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pie strong { color: var(--text-2); font-weight: 600; }
.pie button { color: var(--link); font-size: 12px; }
#printReport { display: none; }

/* =====================================================================
   12. RESPONSIVO
   ===================================================================== */
@media (max-width: 1180px) {

}

  .sec-banda .d { display: none; }

/* Movimiento reducido */

  .estado-dot.vivo::after { display: none; }
}

/* =====================================================================
   13. IMPRESIÓN / PDF
   ===================================================================== */
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  html, body { background: #fff !important; color: #000 !important; }
  body > *:not(#printReport) { display: none !important; }
  #printReport { display: block !important; font-family: var(--font); font-size: 9.5pt; color: #0F172A; }
  .pr-cab { border-bottom: 3px solid #072146; padding-bottom: 8pt; margin-bottom: 10pt; }
  .pr-cab h1 { font-size: 16pt; color: #072146; }
  .pr-cab .pr-sub { font-size: 10pt; color: #334155; margin-top: 2pt; }
  .pr-meta { display: flex; flex-wrap: wrap; gap: 4pt 18pt; margin-top: 6pt; font-size: 8.5pt; color: #475569; }
  .pr-resumen { display: flex; gap: 8pt; margin: 8pt 0 12pt; }
  .pr-resumen div { border: 1px solid #CBD5E1; border-radius: 6pt; padding: 5pt 9pt; font-size: 8.5pt; color: #475569; }
  .pr-resumen strong { display: block; font-size: 13pt; color: #072146; }
  .pr-seccion { font-size: 11pt; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #072146; margin: 14pt 0 4pt; border-bottom: 1px solid #072146; padding-bottom: 2pt; }
  .pr-cat { font-size: 10.5pt; font-weight: 700; margin: 10pt 0 4pt; display: flex; align-items: center; gap: 6pt; break-after: avoid; }

const MAPA_DESESCAPE = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&#96;': '`' };

/** Escapa cualquier valor antes de insertarlo en HTML (único punto de escape). */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"'`]/g, c => MAPA_ESCAPE[c]);
}

/** Misma regla que esUrlValida_ (Codigo.gs): solo http(s), host válido, sin espacios ni caracteres peligrosos. */
function esUrlValida(u) {
  const s = String(u == null ? '' : u);
  if (!/^https?:\/\//i.test(s)) return false;
  if (/[\s<>"`\\\u0000-\u001F\u007F]/.test(s)) return false;
  const autoridad = s.replace(/^https?:\/\//i, '').split(/[/?#]/)[0];
  const host = autoridad.replace(/^[^@]*@/, '').replace(/:\d{1,5}$/, '');
  if (!host) return false;
  if (/^\[[0-9a-f:.]+\]$/i.test(host)) return true;
  const et = '[a-z0-9\\u00a1-\\uffff](?:[a-z0-9\\u00a1-\\uffff_-]*[a-z0-9\\u00a1-\\uffff])?';
  return new RegExp('^' + et + '(?:\\.' + et + ')*\\.?$', 'i').test(host);
}
/** Devuelve la URL solo si es http(s) válida; en otro caso cadena vacía (nunca se usa otra cosa en un href). */
function urlSegura(u) {
  const s = String(u == null ? '' : u).trim();
  if (!esUrlValida(s)) return '';
  try {
    const x = new URL(s);
    return (x.protocol === 'http:' || x.protocol === 'https:') && x.hostname ? s : '';
  } catch (e) { return ''; }
}

const RE_DIACRITICOS = /[̀-ͯ]/g;
/** Normaliza para búsqueda: NFD + sin diacríticos + minúsculas. */
function normalizar(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(RE_DIACRITICOS, '').toLowerCase();
}

function hostDe(u) {
  try { return new URL(u).host.toLowerCase(); } catch (e) { return ''; }
}

function aBool(v) {
  if (v === true || v === 1) return true;
  const s = normalizar(String(v == null ? '' : v).trim());
  return s === 'true' || s === 'si' || s === '1' || s === 'verdadero' || s === 'x';
}

function clonar(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }

function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sin crypto */ }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function debounce(fn, ms) {
  let t = null;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* Correo válido; se aceptan además los dominios de la demo local (@demo, @local). */
function esEmail(s) { return /^[^\s@]+@([^\s@]+\.[^\s@]+|demo|local)$/.test(String(s || '').trim()); }

/** 'juan.perez_lopez@x.com' → 'Juan Perez Lopez' */
function nombreDesdeEmail(email) {
  const local = String(email || '').split('@')[0] || '';
  const partes = local.split(/[._\-+]+/).filter(Boolean);
  if (!partes.length) return 'Usuario';
  return partes.map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
}

function iniciales(nombre, email) {
  const base = String(nombre || '').trim() || nombreDesdeEmail(email);
  const p = base.split(/\s+/).filter(w => /[A-Za-zÀ-ÿ]/.test(w));
  if (!p.length) return '?';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : (p[0][1] || ''))).toUpperCase();
}

/* Paleta institucional para avatares (determinista por correo/nombre) */
const PALETA_AVATAR = ['#004481', '#0E7490', '#7C3AED', '#0F766E', '#B45309', '#BE185D', '#1D4ED8', '#475569', '#15803D', '#9333EA'];
function colorAvatar(semilla) {
  const s = String(semilla || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETA_AVATAR[h % PALETA_AVATAR.length];
}
function avatarHtml(nombre, email, clase = '') {
  return `<span class="avatar ${clase}" style="--av:${colorAvatar(email || nombre)}" aria-hidden="true">${esc(iniciales(nombre, email))}</span>`;
}

function hexValido(c) { return /^#[0-9a-f]{6}$/i.test(String(c || '')); }
function hexRgba(hex, a) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  return `rgba(${parseInt(h.slice(0, 2), 16)}, ${parseInt(h.slice(2, 4), 16)}, ${parseInt(h.slice(4, 6), 16)}, ${a})`;
}
/** Mezcla un color con blanco (t = 0..1) para mejorar el contraste en tema oscuro. */
function aclarar(hex, t) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  const canal = (i) => Math.round(parseInt(h.slice(i, i + 2), 16) + (255 - parseInt(h.slice(i, i + 2), 16)) * t).toString(16).padStart(2, '0');
  return '#' + canal(0) + canal(2) + canal(4);
}
/** Mezcla un color con negro (t = 0..1) para texto con contraste AA sobre fondos claros. */
function oscurecer(hex, t) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  const canal = (i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - t)).toString(16).padStart(2, '0');
  return '#' + canal(0) + canal(2) + canal(4);
}
/** Variables CSS de color de categoría (solo colores validados #RRGGBB). */
function varsColor(color) {
  const c = hexValido(color) ? color : '#64748B';
  const oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
  return `--c:${c};--c-soft:${hexRgba(c, oscuro ? 0.2 : 0.11)};--c-fg:${oscuro ? aclarar(c, 0.45) : c};--c-txt:${oscuro ? aclarar(c, 0.6) : oscurecer(c, 0.4)}`;
}

/* Fechas */
function aFecha(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
let FMT_LARGA, FMT_CORTA, FMT_HORA, FMT_DIA, RTF;
try {
  FMT_LARGA = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  FMT_CORTA = new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
  FMT_HORA = new Intl.DateTimeFormat('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
  FMT_DIA = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  RTF = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
} catch (e) { /* Intl limitado: se usan formatos de respaldo */ }
function fechaLarga(iso) { const d = aFecha(iso); if (!d) return '—'; return FMT_LARGA ? FMT_LARGA.format(d) : d.toLocaleString(); }
function fechaCorta(iso) { const d = aFecha(iso); if (!d) return '—'; return FMT_CORTA ? FMT_CORTA.format(d).replace(/\./g, '') : d.toLocaleDateString(); }
function horaCorta(d) { d = d instanceof Date ? d : aFecha(d); if (!d) return '—'; return FMT_HORA ? FMT_HORA.format(d) : d.toTimeString().slice(0, 5); }
function fechaRelativa(iso) {
  const d = aFecha(iso); if (!d) return '—';
  const seg = Math.round((d.getTime() - Date.now()) / 1000);
  const abs = Math.abs(seg);
  if (!RTF) return fechaCorta(iso);
  if (abs < 45) return 'hace un momento';
  if (abs < 3600) return RTF.format(Math.round(seg / 60), 'minute');
  if (abs < 86400) return RTF.format(Math.round(seg / 3600), 'hour');
  if (abs < 86400 * 7) return RTF.format(Math.round(seg / 86400), 'day');
  if (abs < 86400 * 30) return RTF.format(Math.round(seg / (86400 * 7)), 'week');
  if (abs < 86400 * 365) return RTF.format(Math.round(seg / (86400 * 30)), 'month');
  return RTF.format(Math.round(seg / (86400 * 365)), 'year');
}
function esReciente(iso, dias = 7) { const d = aFecha(iso); return !!d && (Date.now() - d.getTime()) < dias * 86400000 && d.getTime() <= Date.now() + 60000; }
function fmtNum(n) { try { return Number(n || 0).toLocaleString('es-MX'); } catch (e) { return String(n || 0); } }
function plural(n, uno, varios) { return `${fmtNum(n)} ${n === 1 ? uno : varios}`; }
function reducirMovimiento() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }

/** Copia al portapapeles con respaldo (el iframe de GAS puede bloquear la API asíncrona). */
function copiarTexto(texto) {
  const respaldo = () => new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('No se pudo copiar'));
  });
  try {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto).catch(respaldo);
    }
  } catch (e) { /* continúa con respaldo */ }
  return respaldo();
}

/** Descarga un archivo generado en el navegador (Blob + a[download]). */
function descargarArchivo(nombre, contenido, mime) {
  const blob = new Blob([contenido], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ============ 3. Almacenamiento seguro (localStorage con respaldo en memoria) ============ */
const Almacen = (() => {
  const memoria = Object.create(null);
  const soloMemoria = new Set();   // claves cuya última escritura no llegó a localStorage (p. ej. cuota llena)
  let disponible = false;
  let avisado = false;
  try {
    const k = '__space10_prueba__';
    window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k);
    disponible = true;
  } catch (e) { disponible = false; }
  /* Aviso único: la base local deja de persistir, pero nunca se borra lo ya guardado */
  function avisarCuota(k) {
    if (avisado || k !== CLAVES.DB) return;
    avisado = true;
    setTimeout(() => {
      try { toast('El almacenamiento de este navegador está lleno: los cambios se conservarán solo mientras esta pestaña siga abierta. Descarga un respaldo JSON desde el Panel de administración.', 'error'); } catch (e) { /* sin interfaz */ }
    }, 0);
  }
  return {
    disponible: () => disponible,
    get(k) {
      if (disponible && !soloMemoria.has(k)) {
        try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* bloqueado */ }
      }
      return k in memoria ? memoria[k] : null;
    },
    set(k, v) {
      memoria[k] = String(v);
      if (!disponible) return;
      try { window.localStorage.setItem(k, String(v)); soloMemoria.delete(k); }
      catch (e) { soloMemoria.add(k); avisarCuota(k); }   // se conserva el valor previo; la memoria es la fuente de verdad
    },
    remove(k) {
      delete memoria[k];
      soloMemoria.delete(k);
      if (!disponible) return;
      try { window.localStorage.removeItem(k); } catch (e) { /* sin acceso */ }
    },
    getJSON(k, def) {
      const v = this.get(k);
      if (v == null) return def;
      try { return JSON.parse(v); } catch (e) { return def; }
    },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); }
  };
})();

/* ============ 5. Reglas de validación compartidas (reflejan Codigo.gs) ============ */
const LIMITES = { TAGS_MAX: 12, TAG_LEN: 40, TEC_MAX: 8, TEC_LEN: 40 };
const Reglas = {
  /** Quita caracteres de control (como quitarControl_ del servidor). */
  quitarControl(s) { return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, ''); },
  /** Texto de una sola línea con espacios colapsados (textoLinea_). */
  linea(v) { return Reglas.quitarControl(String(v == null ? '' : v).replace(/[\r\n\t]+/g, ' ')).replace(/\s+/g, ' ').trim(); },
  /** Texto multilínea (textoLargo_). */
  largo(v) { return Reglas.quitarControl(String(v == null ? '' : v).replace(/\r\n?/g, '\n')).trim(); },
  /** Acepta arreglo o texto separado por comas / punto y coma / saltos de línea (partirLista_). */
  partirLista(v) {
    if (v === null || v === undefined || v === '') return [];
    const res = [];
    (Array.isArray(v) ? v : [v]).forEach(x => {
      if (x === null || x === undefined) return;
      String(x).split(/[,;\r\n]+/).forEach(p => { const t = p.trim(); if (t) res.push(t); });
    });
    return res;
  },
  /** Etiquetas: sin espacios internos, prefijo '#', sin duplicados; se RECORTAN a 12 × 40 como en el servidor. */
  normalizarTags(v) {
    const vistos = new Set();
    const out = [];
    for (const bruto of Reglas.partirLista(v)) {
      if (out.length >= LIMITES.TAGS_MAX) break;
      const base = Reglas.quitarControl(bruto).replace(/\s+/g, '').replace(/^#+/, '');
      if (!base) continue;
      const t = ('#' + base).slice(0, LIMITES.TAG_LEN);
      const k = t.toLowerCase();
      if (vistos.has(k)) continue;
      vistos.add(k); out.push(t);
    }
    return out;
  },
  /** Tecnologías: recortadas a 8 × 40, sin duplicados (normalizarTecnologias_). */
  normalizarLista(v) {
    const vistos = new Set();
    const out = [];
    for (const bruto of Reglas.partirLista(v)) {
      if (out.length >= LIMITES.TEC_MAX) break;
      const t = Reglas.linea(bruto).slice(0, LIMITES.TEC_LEN).trim();
      if (!t) continue;
      const k = t.toLowerCase();
      if (vistos.has(k)) continue;
      vistos.add(k); out.push(t);
    }
    return out;
  },
  /** Estado canónico o '' si no se reconoce (acepta etiquetas como "Producción (Activo)"). */
  normalizarEstado(v) {
    const s = normalizar(String(v == null ? '' : v).trim());
    if (!s) return '';
    if (ESTADO_MAP[s]) return s;
    if (s.startsWith('prod') || s.startsWith('activo')) return 'produccion';
    if (s.startsWith('desa') || s.startsWith('en desarrollo') || s === 'mvp') return 'desarrollo';
    if (s.startsWith('hist') || s.startsWith('consulta')) return 'historico';
    return '';
  },
  /** Clave para duplicados idéntica a normalizarUrl_: host en minúsculas, sin #hash ni '/' final. */
  urlComparable(u) {
    let s = String(u == null ? '' : u).trim();
    if (!s) return '';
    s = s.replace(/#.*$/, '');
    const m = s.match(/^([a-z][a-z0-9+.\-]*:\/\/)([^\/?#]*)(.*)$/i);
    if (m) s = m[1].toLowerCase() + m[2].toLowerCase() + m[3];
    return s.replace(/\/+$/, '');
  },
  buscarDuplicado(url, items, idExcluir) {
    const k = Reglas.urlComparable(url);
    if (!k) return null;
    return items.find(i => !i.eliminado && i.id !== idExcluir && i.url && Reglas.urlComparable(i.url) === k) || null;
  },
  /** Valida y limpia un enlace con las mismas reglas que validarItem_. Devuelve { item, errores, valido }. */
  validar(datos, { previo = null, categorias = [] } = {}) {
    const d = Object.assign({}, datos || {});
    /* En edición, los campos ausentes conservan su valor (igual que validarItem_) */
    if (previo) ['nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia']
      .forEach(k => { if (d[k] === undefined) d[k] = previo[k]; });
    const errores = {};
    const estadoBruto = Reglas.linea(d.estado);
    const item = {
      nombre: Reglas.linea(d.nombre),
      categoriaId: Reglas.linea(d.categoriaId),
      url: Reglas.linea(d.url),
      urlScript: Reglas.linea(d.urlScript),
      descripcion: Reglas.largo(d.descripcion),
      tags: Reglas.normalizarTags(d.tags),
      tecnologias: Reglas.normalizarLista(d.tecnologias),
      iniciativa: Reglas.linea(d.iniciativa),
      estado: estadoBruto ? Reglas.normalizarEstado(estadoBruto) : 'produccion',
      fijado: aBool(d.fijado),
      tiempoReal: aBool(d.tiempoReal),
      frecuencia: Reglas.linea(d.frecuencia)
    };
    if (item.nombre.length < 3 || item.nombre.length > 120) errores.nombre = 'El nombre debe tener entre 3 y 120 caracteres.';
    const cat = categorias.find(c => c.id === item.categoriaId);
    const conservaCategoria = !!previo && previo.categoriaId === item.categoriaId;   // una categoría desactivada se puede conservar al editar
    if (!item.categoriaId) errores.categoriaId = 'Selecciona una categoría.';
    else if (!cat || (!aBool(cat.activa) && !conservaCategoria)) errores.categoriaId = 'La categoría seleccionada no existe o está inactiva.';
    if (!item.url) {
      if (!previo) errores.url = 'La URL principal es obligatoria.';
      else if (previo.url) errores.url = 'La URL principal no puede quedar vacía.';
    } else if (item.url.length > 2000) errores.url = 'La URL es demasiado larga (máx. 2000 caracteres).';
    else if (!urlSegura(item.url)) errores.url = 'La URL debe iniciar con http:// o https://, tener un dominio válido y no contener espacios ni los caracteres < > " `.';
    if (item.urlScript && (item.urlScript.length > 2000 || !urlSegura(item.urlScript))) errores.urlScript = 'La URL del script debe iniciar con http:// o https://, tener un dominio válido y no contener espacios.';
    if (item.descripcion.length < 10 || item.descripcion.length > 1000) errores.descripcion = 'La descripción debe tener entre 10 y 1000 caracteres.';
    if (item.iniciativa.length > 80) errores.iniciativa = 'La iniciativa admite máximo 80 caracteres.';
    if (item.frecuencia.length > 60) errores.frecuencia = 'La frecuencia admite máximo 60 caracteres.';
    if (!item.estado || !ESTADO_MAP[item.estado]) errores.estado = 'Estado no válido. Usa: Producción (Activo), En Desarrollo (MVP) o Histórico / Consulta.';
    return { item, errores, valido: Object.keys(errores).length === 0 };
  },
  primerError(errores) { const k = Object.keys(errores || {}); return k.length ? errores[k[0]] : ''; }
};

/* ============ 6. Api: fábrica y adaptador GAS ============ */
const API_METODOS = ['obtenerCatalogoHerramientas', 'guardarHerramienta', 'eliminarHerramienta', 'fijarHerramienta', 'registrarVisita',
  'obtenerPanelAdmin', 'restaurarHerramienta', 'purgarHerramienta', 'guardarRolUsuario', 'guardarCategoria', 'eliminarCategoria',
  'actualizarMiPerfil', 'importarHerramientas', 'cargarSemillaFaltante'];

function createApi() { return ES_GAS ? crearApiGas() : crearApiLocal(); }

/** Adaptador GAS: cada método devuelve una promesa sobre google.script.run. */
function crearApiGas() {
  const api = { modo: 'gas' };
  API_METODOS.forEach(fn => {
    api[fn] = (...args) => new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => (r && r.ok ? resolve(r) : reject(r || { error: 'Respuesta vacía del servidor' })))
        .withFailureHandler(e => reject({ error: (e && e.message) || String(e) }))[fn](...args);
    });
  });
  return api;
}

/* ============ 7. Api: adaptador local (misma semántica que Codigo.gs sobre localStorage) ============ */
function crearApiLocal() {
  const PROPIETARIO = 'admin.local@demo';
  const LATENCIA = 120;
  const AUTOR_SEMILLA = { email: 'equipo.space10@local', nombre: 'Equipo Space 1.0' };
  /* Antigüedad (días) de cada semilla para que la demo luzca realista ("Nuevo" < 7 días). */
  const ANTIGUEDAD = { 'seed-001': 2, 'seed-002': 18, 'seed-003': 26, 'seed-004': 33, 'seed-005': 41, 'seed-006': 5, 'seed-007': 12,
    'seed-101': 9, 'seed-102': 9, 'seed-103': 15, 'seed-104': 15, 'seed-105': 20, 'seed-106': 24, 'seed-107': 28, 'seed-108': 6 };
  const MAX_BITACORA = 5000;

  class ErrorApi extends Error { constructor(msg, extra) { super(msg); this.extra = extra || null; } }
  const ahoraISO = () => new Date().toISOString();

  function itemSemilla(s) {
    const dias = ANTIGUEDAD[s.id] || 30;
    return Object.assign(clonar(s), {
      urlScript: '', estado: 'produccion',
      creadoPor: AUTOR_SEMILLA.email, creadoPorNombre: AUTOR_SEMILLA.nombre,
      fechaCreacion: new Date(Date.now() - dias * 86400000 - 3600000 * 3).toISOString(),
      modificadoPor: '', modificadoPorNombre: '', fechaModificacion: '',
      visitas: 0, eliminado: false, eliminadoPor: '', fechaEliminacion: ''
    });
  }
  function crearDB() {
    const f = ahoraISO();
    return {
      items: SEMILLA_ITEMS.map(itemSemilla),
      categorias: clonar(CATEGORIAS_SEMILLA),
      usuarios: [{ email: PROPIETARIO, nombre: 'Admin Local', rol: 'ADMIN', fechaAlta: f, ultimoAcceso: f, accesos: 1 }],
      bitacora: [{ fecha: f, usuario: 'sistema', accion: 'SEMILLA', itemId: '', itemNombre: '', detalle: 'Base local inicializada con 15 enlaces semilla y 14 categorías.' }]
    };
  }
  function leer() {
    let d = Almacen.getJSON(CLAVES.DB, null);
    if (!d || typeof d !== 'object' || !Array.isArray(d.items)) { d = crearDB(); escribir(d); }
    if (!Array.isArray(d.categorias)) d.categorias = clonar(CATEGORIAS_SEMILLA);
    if (!Array.isArray(d.usuarios)) d.usuarios = [];
    if (!Array.isArray(d.bitacora)) d.bitacora = [];
    return d;
  }
  function escribir(d) { Almacen.setJSON(CLAVES.DB, d); }

  function perfilActual() {
    const id = Almacen.get(CLAVES.PERFIL) || 'admin';
    return PERFILES_DEMO.find(p => p.id === id) || PERFILES_DEMO[0];
  }
  /** Resuelve identidad y rol como el servidor (§4). */
  function sesion(d) {
    const email = perfilActual().email;
    if (!email) return { email: '', nombre: 'Invitado', rol: 'invitado', esPropietario: false, puedeEscribir: false };
    const fila = d.usuarios.find(u => u.email === email);
    const esProp = email === PROPIETARIO;
    const rol = esProp || (fila && String(fila.rol).toUpperCase() === 'ADMIN') ? 'admin' : 'usuario';
    return { email, nombre: (fila && fila.nombre) || nombreDesdeEmail(email), rol, esPropietario: esProp, puedeEscribir: true };
  }
  const esAdminFila = (u) => u.email === PROPIETARIO || String(u.rol).toUpperCase() === 'ADMIN';
  function exigirEscritura(u) { if (!u.puedeEscribir) throw new ErrorApi('Modo consulta: identifícate con tu cuenta corporativa para realizar cambios.'); }
  function exigirAdmin(u) { if (u.rol !== 'admin') throw new ErrorApi('Acción reservada para administradores.'); }
  function puedeEditarItem(it, u) { return !!u.email && (u.rol === 'admin' || it.creadoPor === u.email); }
  function conPermiso(it, u) { const c = clonar(it); c.puedeEditar = puedeEditarItem(it, u); return c; }
  function buscarItem(d, id) { const it = d.items.find(i => i.id === String(id || '')); if (!it) throw new ErrorApi('No se encontró el enlace solicitado.'); return it; }
  function registrar(d, u, accion, item, detalle) {
    d.bitacora.unshift({
      fecha: ahoraISO(), usuario: u.email || 'invitado', accion,
      itemId: item ? item.id : '', itemNombre: item ? (item.nombre || '') : '',
      detalle: String(detalle || '').slice(0, 500)
    });
    if (d.bitacora.length > MAX_BITACORA) d.bitacora.length = MAX_BITACORA;
  }
  function ordenarCats(cats) { return clonar(cats).sort((a, b) => (Number(a.orden) || 0) - (Number(b.orden) || 0) || String(a.nombre).localeCompare(String(b.nombre), 'es')); }
  function camposCambiados(antes, despues) {
    const campos = ['nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia'];
    return campos.filter(k => JSON.stringify(antes[k]) !== JSON.stringify(despues[k]));
  }
  function filaUsuario(d, email, crear) {
    let f = d.usuarios.find(u => u.email === email);
    if (!f && crear) {
      const ahora = ahoraISO();
      f = { email, nombre: nombreDesdeEmail(email), rol: 'USUARIO', fechaAlta: ahora, ultimoAcceso: '', accesos: 0 };
      d.usuarios.push(f);
    }
    return f;
  }
  function slugUnico(base, cats, idActual) {
    let s = normalizar(base).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'categoria';
    let cand = s, n = 2;
    while (cats.some(c => c.id === cand && c.id !== idActual)) cand = `${s}-${n++}`;
    return cand;
  }

  const metodos = {
    obtenerCatalogoHerramientas() {
      const d = leer();
      const u = sesion(d);
      if (u.email) {
        const f = filaUsuario(d, u.email, true);
        const ult = aFecha(f.ultimoAcceso);
        if (!ult || Date.now() - ult.getTime() > 30 * 60000) {
          f.ultimoAcceso = ahoraISO(); f.accesos = (Number(f.accesos) || 0) + 1;
        }
        escribir(d);
      }
      return {
        usuario: u,
        items: d.items.filter(i => !i.eliminado).map(i => conPermiso(i, u)),
        categorias: ordenarCats(d.categorias),
        secciones: clonar(SECCIONES),
        config: { titulo: TITULO_APP, nombreApp: NOMBRE_APP, version: APP_VERSION, appUrl: '', dominiosPermitidos: [], servidor: 'local' },
        fechaServidor: ahoraISO()
      };
    },

    guardarHerramienta(datos) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      if (!datos || typeof datos !== 'object') throw new ErrorApi('Los datos del enlace no son válidos.');
      const id = String(datos.id || '').trim();
      const previo = id ? d.items.find(i => i.id === id) || null : null;
      if (previo) {
        if (previo.eliminado) throw new ErrorApi('El enlace está en la papelera; un administrador debe restaurarlo antes de editarlo.');
        if (!puedeEditarItem(previo, u)) throw new ErrorApi('Solo el autor del enlace o un administrador pueden modificarlo.');
      }
      const v = Reglas.validar(datos, { previo, categorias: d.categorias });
      if (!v.valido) throw new ErrorApi(Reglas.primerError(v.errores));
      /* Como en Codigo.gs: al editar solo se revisa duplicado si la URL cambió (no se re-confirman duplicados ya aceptados) */
      const urlCambio = !previo || Reglas.urlComparable(previo.url) !== Reglas.urlComparable(v.item.url);
      if (v.item.url && urlCambio && datos.confirmarDuplicado !== true) {
        const dup = Reglas.buscarDuplicado(v.item.url, d.items, previo ? previo.id : null);
        if (dup) throw new ErrorApi(`Este enlace ya existe en el directorio: "${dup.nombre}"`, { duplicado: { id: dup.id, nombre: dup.nombre } });
      }
      const ahora = ahoraISO();
      let final, accion;
      if (previo) {
        const cambios = camposCambiados(previo, v.item);
        Object.assign(previo, v.item, { modificadoPor: u.email, modificadoPorNombre: u.nombre, fechaModificacion: ahora });
        final = previo; accion = 'actualizado';
        registrar(d, u, 'EDITAR', previo, cambios.length ? JSON.stringify({ campos: cambios }) : 'Sin cambios de contenido');
      } else {
        final = Object.assign({ id: 'lnk_' + uuid() }, v.item, {
          creadoPor: u.email, creadoPorNombre: u.nombre, fechaCreacion: ahora,
          modificadoPor: '', modificadoPorNombre: '', fechaModificacion: '',
          visitas: 0, eliminado: false, eliminadoPor: '', fechaEliminacion: ''
        });
        d.items.push(final); accion = 'creado';
        registrar(d, u, 'CREAR', final, JSON.stringify({ categoria: final.categoriaId, url: final.url, estado: final.estado }));
      }
      escribir(d);
      return { item: conPermiso(final, u), accion };
    },

    eliminarHerramienta(id) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      const it = buscarItem(d, id);
      if (it.eliminado) throw new ErrorApi('El enlace ya está en la papelera.');
      if (!puedeEditarItem(it, u)) throw new ErrorApi('Solo el autor del enlace o un administrador pueden eliminarlo.');
      Object.assign(it, { eliminado: true, eliminadoPor: u.email, fechaEliminacion: ahoraISO() });
      registrar(d, u, 'ELIMINAR', it, 'Movido a la papelera');
      escribir(d);
      return { id: it.id };
    },

    fijarHerramienta(id, fijado) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      const it = buscarItem(d, id);
      if (it.eliminado) throw new ErrorApi('El enlace está en la papelera.');
      if (!puedeEditarItem(it, u)) throw new ErrorApi('Solo el autor del enlace o un administrador pueden fijarlo.');
      it.fijado = aBool(fijado);
      registrar(d, u, 'FIJAR', it, it.fijado ? 'Fijado en Warroom' : 'Retirado del Warroom');
      escribir(d);
      return { item: conPermiso(it, u) };
    },

    registrarVisita(id) {
      const d = leer();
      const it = buscarItem(d, id);
      if (it.eliminado) throw new ErrorApi('El enlace está en la papelera.');
      it.visitas = (Number(it.visitas) || 0) + 1;
      escribir(d);
      return { visitas: it.visitas };
    },

    obtenerPanelAdmin() {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const activos = d.items.filter(i => !i.eliminado);
      /* Como listarUsuariosPanel_: registrados + propietario + autores de enlaces sin fila en USUARIOS (p. ej. importados) */
      const filas = d.usuarios.slice();
      if (!filas.some(f => f.email === PROPIETARIO)) filas.unshift({ email: PROPIETARIO, nombre: 'Admin Local', rol: 'ADMIN', fechaAlta: '', ultimoAcceso: '', accesos: 0 });
      const vistos = new Set(filas.map(f => f.email));
      activos.forEach(i => {
        const e = i.creadoPor;
        if (!e || vistos.has(e) || !esEmail(e)) return;
        vistos.add(e);
        filas.push({ email: e, nombre: i.creadoPorNombre || '', rol: 'USUARIO', fechaAlta: '', ultimoAcceso: '', accesos: 0 });
      });
      const usuarios = filas.map(f => ({
        email: f.email, nombre: f.nombre || nombreDesdeEmail(f.email), rol: esAdminFila(f) ? 'admin' : 'usuario',
        fechaAlta: f.fechaAlta || '', ultimoAcceso: f.ultimoAcceso || '', accesos: Number(f.accesos) || 0,
        esPropietario: f.email === PROPIETARIO, totalEnlaces: activos.filter(i => i.creadoPor === f.email).length

/* ============ 9. Búsqueda (§6.4) y filtrado ============ */
function indexar() {
  S.indice = new Map();
  for (const it of S.items) {
    const cat = catDe(it);
    const sec = seccionDe(cat);
    const f = {
      nombre: normalizar(it.nombre),
      descripcion: normalizar(it.descripcion),
      tags: it.tags.map(normalizar),
      tecnologias: it.tecnologias.map(normalizar),
      iniciativa: normalizar(it.iniciativa),
      categoria: normalizar(cat.nombre),
      autor: normalizar(it.creadoPorNombre + ' ' + it.creadoPor)
    };
    f.tagsSin = f.tags.map(t => t.replace(/^#/, ''));
    f.hay = [
      f.nombre, f.descripcion, f.tags.join(' '), f.tagsSin.join(' '), f.tecnologias.join(' | '), f.iniciativa,
      f.categoria, normalizar(sec ? sec.nombre : ''), normalizar((ESTADO_MAP[it.estado] || {}).etiqueta),
      normalizar(it.frecuencia), f.autor, hostDe(it.url)

  }
}
function terminos(q) { return normalizar(q).split(/\s+/).filter(Boolean); }
/** Puntaje de relevancia; null si algún término no aparece. */
function puntuar(it, terms) {
  const f = S.indice.get(it.id);
  if (!f) return null;
  let total = 0;
  for (const t of terms) {
    if (!f.hay.includes(t)) return null;
    const tSin = t.replace(/^#/, '');
    let s = 0;
    if (f.nombre.includes(t)) { s += 10; if (f.nombre.startsWith(t)) s += 5; }
    if (tSin && f.tagsSin.includes(tSin)) s += 8;
    if (f.tecnologias.some(x => x.includes(t))) s += 6;
    if (f.iniciativa.includes(t)) s += 6;
    if (f.categoria.includes(t)) s += 4;
    if (f.autor.includes(t)) s += 3;
    if (f.descripcion.includes(t)) s += 2;
    total += s || 1;
  }
  return total;
}

function hayFiltrosContenido() {
  const f = S.filtros;
  return !!(S.terms.length || f.estado !== 'todos' || f.soloMios || f.soloFavs || f.tag);
}
function hayFiltros() {

}
function pasaFiltrosContenido(it) {
  const f = S.filtros;
  if (f.estado !== 'todos' && it.estado !== f.estado) return false;
  if (f.soloMios && it.creadoPor !== S.usuario.email) return false;
  if (f.soloFavs && !S.favoritos.has(it.id)) return false;
  if (f.tag) { const k = f.tag.toLowerCase(); if (!it.tags.some(t => t.toLowerCase() === k)) return false; }
  return true;
}

const fechaAct = (it) => Math.max(aFecha(it.fechaModificacion) ? aFecha(it.fechaModificacion).getTime() : 0, aFecha(it.fechaCreacion) ? aFecha(it.fechaCreacion).getTime() : 0);
const fechaCre = (it) => (aFecha(it.fechaCreacion) ? aFecha(it.fechaCreacion).getTime() : 0);
const cmpTexto = (a, b) => String(a || '').localeCompare(String(b || ''), 'es', { sensitivity: 'base', numeric: true });
const ORDEN_ESTADO = { produccion: 0, desarrollo: 1, historico: 2 };

function ordenEfectivo() { return (S.orden === 'relevancia' && !S.terms.length) ? 'recientes' : S.orden; }
function comparador(clave, puntajes) {
  switch (clave) {
    case 'relevancia': return (a, b) => (puntajes.get(b.id) || 0) - (puntajes.get(a.id) || 0) || (b.fijado - a.fijado) || cmpTexto(a.nombre, b.nombre);
    case 'nombre': return (a, b) => cmpTexto(a.nombre, b.nombre);
    case 'visitados': return (a, b) => b.visitas - a.visitas || cmpTexto(a.nombre, b.nombre);
    case 'actualizacion': return (a, b) => fechaAct(b) - fechaAct(a) || cmpTexto(a.nombre, b.nombre);
    case 'recientes':
    default: return (a, b) => fechaCre(b) - fechaCre(a) || cmpTexto(a.nombre, b.nombre);

const CMP_TABLA = {
  fav: (a, b) => (S.favoritos.has(b.id) - S.favoritos.has(a.id)) || cmpTexto(a.nombre, b.nombre),
  nombre: (a, b) => cmpTexto(a.nombre, b.nombre),
  categoria: (a, b) => cmpTexto(catDe(a).nombre, catDe(b).nombre) || cmpTexto(a.nombre, b.nombre),
  estado: (a, b) => ORDEN_ESTADO[a.estado] - ORDEN_ESTADO[b.estado] || cmpTexto(a.nombre, b.nombre),
  tecnologias: (a, b) => cmpTexto(a.tecnologias.join(', '), b.tecnologias.join(', ')),
  tags: (a, b) => cmpTexto(a.tags.join(' '), b.tags.join(' ')),
  autor: (a, b) => cmpTexto(a.creadoPorNombre, b.creadoPorNombre) || cmpTexto(a.nombre, b.nombre),
  fecha: (a, b) => fechaCre(a) - fechaCre(b),
  visitas: (a, b) => a.visitas - b.visitas || cmpTexto(a.nombre, b.nombre)

/** Calcula resultados + conteos facetados para pestañas y categorías. */
function calcular() {
  S.terms = terminos(S.filtros.q);
  const f = S.filtros;
  const puntajes = new Map();
  const base = [];
  for (const it of S.items) {
    let p = 0;
    if (S.terms.length) { p = puntuar(it, S.terms); if (p === null) continue; }
    if (!pasaFiltrosContenido(it)) continue;
    puntajes.set(it.id, p);
    base.push(it);
  }
  const conteoSec = { todo: base.length };
  base.forEach(it => { const s = catDe(it).seccion; conteoSec[s] = (conteoSec[s] || 0) + 1; });
  const enSeccion = f.seccion === 'todo' ? base : base.filter(it => catDe(it).seccion === f.seccion);
  const conteoCat = {};
  enSeccion.forEach(it => { conteoCat[it.categoriaId] = (conteoCat[it.categoriaId] || 0) + 1; });
  const lista = f.cat === 'todos' ? enSeccion.slice() : enSeccion.filter(it => it.categoriaId === f.cat);
  lista.sort(comparador(ordenEfectivo(), puntajes));
  S.calc = { puntajes, base, conteoSec, conteoCat, lista };
  return S.calc;
}
function resultadosFiltrados() { return (S.calc || calcular()).lista; }
function esAgrupado() { return S.vista === 'tarjetas' && !S.terms.length && ordenEfectivo() === 'recientes' && S.agrupar; }

/** Orden canónico (sección → categoría → nombre) para exportar e imprimir. */
function ordenCanonico(items) {
  const posSec = (id) => { const i = S.secciones.findIndex(s => s.id === id); return i < 0 ? 99 : i; };
  return items.slice().sort((a, b) => {
    const ca = catDe(a), cb = catDe(b);
    return posSec(ca.seccion) - posSec(cb.seccion) || ca.orden - cb.orden || cmpTexto(ca.nombre, cb.nombre) || cmpTexto(a.nombre, b.nombre);
  });
}

/** Resalta términos con <mark>. Se escapa PRIMERO y luego se resalta sobre el texto escapado,
    tratando cada entidad HTML como un único carácter (nunca se parte una entidad). */
function resaltar(texto, terms = S.terms) {
  const seguro = esc(texto);
  if (!terms || !terms.length || !seguro) return seguro;
  const unidades = seguro.match(/&(?:amp|lt|gt|quot|#39|#96);|[\s\S]/g) || [];
  let norm = '';
  const mapa = [];
  unidades.forEach((u, i) => {
    const n = normalizar(u.length > 1 ? MAPA_DESESCAPE[u] : u);
    for (let k = 0; k < n.length; k++) { norm += n[k]; mapa.push(i); }
  });
  const rangos = [];
  for (const t0 of terms) {
    const t = t0.length > 1 ? t0.replace(/^#/, '') : t0;
    if (!t) continue;
    let p = norm.indexOf(t);
    while (p !== -1) { rangos.push([mapa[p], mapa[p + t.length - 1] + 1]); p = norm.indexOf(t, p + t.length); }
  }
  if (!rangos.length) return seguro;
  rangos.sort((a, b) => a[0] - b[0]);
  const fusion = [rangos[0].slice()];
  for (let i = 1; i < rangos.length; i++) {
    const ult = fusion[fusion.length - 1];
    if (rangos[i][0] <= ult[1]) ult[1] = Math.max(ult[1], rangos[i][1]); else fusion.push(rangos[i].slice());
  }
  let out = '', pos = 0;
  for (const [a, b] of fusion) {
    out += unidades.slice(pos, a).join('') + '<mark>' + unidades.slice(a, b).join('') + '</mark>';
    pos = b;
  }
  return out + unidades.slice(pos).join('');
}

function datosKpi(k) {
  const total = S.items.length || 0;
  const pct = (n) => (total ? Math.round(n / total * 100) : 0);
  if (k.id === 'total') {
    const prod = S.items.filter(i => i.estado === 'produccion').length;
    const nuevos = S.items.filter(i => esReciente(i.fechaCreacion)).length;
    return { v: total, meter: pct(prod), txt: `${fmtNum(prod)} en producción · ${fmtNum(nuevos)} nuevos`, tip: 'Ver todo el directorio' };
  }
  if (k.id === 'contrib') {
    const autores = new Set(S.items.map(i => i.creadoPor).filter(Boolean));
    const prom = autores.size ? (total / autores.size) : 0;
    return { v: autores.size, meter: null, txt: `${prom.toLocaleString('es-MX', { maximumFractionDigits: 1 })} enlaces c/u · Ver ranking ›`, tip: 'Ver contribuidores' };
  }
  const n = k.cat ? S.items.filter(i => i.categoriaId === k.cat).length : S.items.filter(i => catDe(i).seccion === k.seccion).length;
  return { v: n, meter: pct(n), txt: `${pct(n)}% del total`, tip: k.cat ? 'Filtrar por esta categoría' : 'Ver la Biblioteca de Conocimiento' };
}
function kpiActivo(k) {
  const f = S.filtros;
  if (k.id === 'total') return S.cargado && !hayFiltros();

function renderKpis() {
  const cont = $('#kpis');

    cont.innerHTML = KPIS.map(k => `
      <button type="button" class="kpi kpi-skel" data-accion="kpi" data-valor="${k.id}" aria-pressed="false">
        <span class="kpi-top"><span class="kpi-ico">${icon(k.icono)}</span><span class="kpi-label">${esc(k.label)}</span></span>
        <span class="kpi-num" data-valor="0">0</span>

      </button>`).join('');
  }
  if (!S.cargado) return;
  KPIS.forEach(k => {
    const el = cont.querySelector(`[data-valor="${k.id}"]`);
    const d = datosKpi(k);
    el.classList.remove('kpi-skel');
    el.setAttribute('aria-pressed', String(kpiActivo(k)));

    el.title = d.tip;
    animarNumero(el.querySelector('.kpi-num'), d.v);
    const meter = el.querySelector('.kpi-meter');
    meter.style.display = d.meter === null ? 'none' : '';
    if (d.meter !== null) meter.firstElementChild.style.width = Math.max(d.meter, d.v ? 3 : 0) + '%';
    el.querySelector('.txt').textContent = d.txt;
  });

function animarNumero(el, hasta) {
  const desde = Number(el.dataset.valor || 0);
  el.dataset.valor = String(hasta);
  if (desde === hasta || reducirMovimiento()) { el.textContent = fmtNum(hasta); return; }
  const dur = 750, t0 = performance.now();
  const paso = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtNum(Math.round(desde + (hasta - desde) * e));
    if (p < 1 && el.dataset.valor === String(hasta)) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

  next.disabled = t.scrollLeft + t.clientWidth >= t.scrollWidth - 2;

  t.classList.toggle('hay-der', !next.disabled);

/** Columnas del tablero agrupado: mismo cálculo que auto-fill minmax(320px, 1fr) con gap de 14px. */
function columnasTablero() {
  const ancho = ($('#resCuerpo') && $('#resCuerpo').clientWidth) || 1200;

/* Subdivisiones por columna del tablero agrupado: permiten repartir el sobrante de una fila sin romper el orden. */
const PISTAS_POR_COL = 12;
/**
 * Reparte los grupos en filas respetando el orden (sección → orden de categoría), sin reordenar.
 * Cada grupo ocupa de forma natural min(nº de tarjetas, columnas); el sobrante de cada fila se reparte
 * proporcionalmente (máx. ×2) para que la fila quede llena sin huecos ni tarjetas gigantes.
 */
function distribuirGrupos(grupos, cols) {
  const filas = [];
  let fila = [], usadas = 0;
  grupos.forEach(g => {
    g.span = Math.max(1, Math.min(g.items.length || 1, cols));
    if (fila.length && usadas + g.span > cols) { filas.push(fila); fila = []; usadas = 0; }
    fila.push(g); usadas += g.span;
  });
  if (fila.length) filas.push(fila);
  const max = cols * PISTAS_POR_COL;
  filas.forEach(f => {
    const total = f.reduce((n, g) => n + g.span, 0);
    const factor = Math.min(cols / total, 2);
    let suma = 0;
    f.forEach((g, i) => {
      g.pistas = Math.max(PISTAS_POR_COL, Math.round(g.span * factor * PISTAS_POR_COL));
      g.inicioFila = i === 0;
      suma += g.pistas;
    });
    if (suma > max) f[f.length - 1].pistas -= suma - max;
  });
  return grupos;
}
function grupoHtml(g) {
  const { cat, items, span, pistas, inicioFila } = g;
  const sinCat = cat.id === '__sin__';
  return `<section class="grupo" style="${varsColor(cat.color)};grid-column:${inicioFila ? '1 / ' : ''}span ${pistas};--span:${span}" aria-label="${esc(cat.nombre)}">

      ${!sinCat && cat.activa && puedeEscribir() ? `<button type="button" class="btn btn-text btn-sm" data-accion="nuevo-en-cat" data-valor="${esc(cat.id)}" aria-label="Agregar enlace en ${esc(cat.nombre)}" title="Agregar enlace en esta categoría">${icon('plus')}${pistas > PISTAS_POR_COL ? 'Agregar' : ''}</button>` : ''}
    </div>
    ${items.length ? `<div class="grid">${items.map(tarjeta).join('')}</div>` : vacioMini(cat)}
  </section>`;
}
function vistaAgrupada(lista) {
  const porCat = new Map();
  lista.forEach(it => {
    const k = S.catMap.has(it.categoriaId) ? it.categoriaId : '__sin__';
    if (!porCat.has(k)) porCat.set(k, []);
    porCat.get(k).push(it);
  });
  const mostrarVacias = S.filtros.cat === 'todos' && !hayFiltrosContenido();
  const secciones = S.filtros.seccion === 'todo' ? S.secciones : S.secciones.filter(s => s.id === S.filtros.seccion);
  const cols = columnasTablero();
  S.colsTablero = cols;
  let html = '';
  for (const sec of secciones) {
    const cats = S.categorias.filter(c => c.seccion === sec.id && (porCat.has(c.id) || (mostrarVacias && c.activa)));
    if (!cats.length) continue;
    const total = cats.reduce((n, c) => n + (porCat.get(c.id) || []).length, 0);
    if (S.filtros.seccion === 'todo') {
      html += `<div class="sec-banda">${icon(sec.icono === 'book' ? 'book' : 'grid')}<h3>${esc(sec.nombre)}</h3><span class="n">${plural(total, 'enlace', 'enlaces')}</span><span class="d">${esc(sec.descripcion || '')}</span></div>`;
    }
    const grupos = distribuirGrupos(cats.map(c => ({ cat: c, items: porCat.get(c.id) || [] })), cols);
    html += `<div class="grupos" style="--cols:${cols}">${grupos.map(grupoHtml).join('')}</div>`;
  }
  if (porCat.has('__sin__')) html += `<div class="grupos" style="--cols:${cols}">${distribuirGrupos([{ cat: CAT_DESCONOCIDA, items: porCat.get('__sin__') }], cols).map(grupoHtml).join('')}</div>`;
  return html;
}
