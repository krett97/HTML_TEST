      d.items = d.items.filter(i => i.id !== it.id);
      registrar(d, u, 'PURGAR', it, 'Eliminado definitivamente');
      escribir(d);
      return { id: it.id };
    },

    guardarRolUsuario(email, rol) {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const e = String(email || '').toLowerCase().trim();
      const r = String(rol || '').toLowerCase().trim();
      if (!esEmail(e)) throw new ErrorApi('Ingresa un correo electrónico válido.');
      if (r !== 'admin' && r !== 'usuario') throw new ErrorApi('Rol no válido: usa "admin" o "usuario".');
      if (e === PROPIETARIO && r === 'usuario') throw new ErrorApi('El propietario del directorio siempre es administrador.');
      if (e === u.email && r === 'usuario') {
        const admins = d.usuarios.filter(esAdminFila).map(f => f.email);
        if (!admins.includes(PROPIETARIO)) admins.push(PROPIETARIO);
        if (admins.filter(x => x !== e).length < 1) throw new ErrorApi('Eres el último administrador; no puedes quitarte el rol.');
      }
      const f = filaUsuario(d, e, true);
      f.rol = r === 'admin' ? 'ADMIN' : 'USUARIO';
      registrar(d, u, 'ROL', null, `${e} → ${f.rol}`);
      escribir(d);
      return { usuario: { email: f.email, nombre: f.nombre, rol: r, fechaAlta: f.fechaAlta, ultimoAcceso: f.ultimoAcceso, accesos: f.accesos, esPropietario: f.email === PROPIETARIO } };
    },

    guardarCategoria(cat) {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const c = cat || {};
      const nombre = String(c.nombre || '').trim();
      const seccion = String(c.seccion || '').trim();
      const icono = String(c.icono || '').trim();
      const color = String(c.color || '').trim().toUpperCase();
      const orden = Number(c.orden);
      const descripcion = String(c.descripcion || '').trim();
      if (nombre.length < 2 || nombre.length > 60) throw new ErrorApi('El nombre de la categoría debe tener entre 2 y 60 caracteres.');
      if (!SECCIONES.some(s => s.id === seccion)) throw new ErrorApi('Selecciona una sección válida.');
      if (!ICONOS_PERMITIDOS.includes(icono)) throw new ErrorApi('Icono no permitido.');
      if (!hexValido(color)) throw new ErrorApi('El color debe tener formato #RRGGBB.');
      if (c.orden === '' || c.orden == null || !isFinite(orden)) throw new ErrorApi('El orden debe ser un número.');
      if (descripcion.length > 200) throw new ErrorApi('La descripción admite máximo 200 caracteres.');
      const activa = c.activa === undefined ? true : aBool(c.activa);
      const existente = c.id ? d.categorias.find(x => x.id === String(c.id)) : null;
      let final;
      if (existente) {
        Object.assign(existente, { nombre, seccion, icono, color, orden, descripcion, activa });
        final = existente;
      } else {
        final = { id: slugUnico(c.id || nombre, d.categorias, null), nombre, seccion, icono, color, orden, descripcion, activa };
        d.categorias.push(final);
      }
      registrar(d, u, 'CATEGORIA', null, `${existente ? 'Actualizada' : 'Creada'}: ${final.id} (${final.nombre})`);
      escribir(d);
      return { categoria: clonar(final) };
    },

    eliminarCategoria(id) {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const cat = d.categorias.find(c => c.id === String(id || ''));
      if (!cat) throw new ErrorApi('La categoría no existe.');
      const n = d.items.filter(i => !i.eliminado && i.categoriaId === cat.id).length;
      if (n > 0) throw new ErrorApi(`La categoría tiene ${n} ${n === 1 ? 'enlace' : 'enlaces'}. Muévelos o desactívala.`);
      d.categorias = d.categorias.filter(c => c.id !== cat.id);
      registrar(d, u, 'CATEGORIA_ELIMINAR', null, `${cat.id} (${cat.nombre})`);
      escribir(d);
      return { id: cat.id };
    },

    actualizarMiPerfil(nombre) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      const n = String(nombre || '').trim().replace(/\s+/g, ' ');
      if (n.length < 2 || n.length > 60) throw new ErrorApi('El nombre debe tener entre 2 y 60 caracteres.');
      const f = filaUsuario(d, u.email, true);
      f.nombre = n;
      registrar(d, u, 'PERFIL', null, `Nombre: ${n}`);
      escribir(d);
      return { usuario: sesion(d) };
    },

    importarHerramientas(items) {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      if (!Array.isArray(items)) throw new ErrorApi('El archivo debe contener una lista de enlaces.');
      let creados = 0, actualizados = 0, omitidos = 0;
      const errores = [];
      const ahora = ahoraISO();
      items.forEach((x, i) => {
        const etiqueta = `#${i + 1}${x && x.nombre ? ` ("${String(x.nombre).slice(0, 60)}")` : ''}`;
        if (!x || typeof x !== 'object') { omitidos++; errores.push(`${etiqueta}: registro inválido.`); return; }
        const id = String(x.id || '').trim();
        const existente = id ? d.items.find(it => it.id === id) : null;
        if (existente && existente.eliminado) { omitidos++; errores.push(`${etiqueta}: está en la papelera; restáuralo antes de importar.`); return; }
        const v = Reglas.validar(x, { previo: existente, categorias: d.categorias });
        if (!v.valido) { omitidos++; errores.push(`${etiqueta}: ${Reglas.primerError(v.errores)}`); return; }
        if (existente) {
          Object.assign(existente, v.item, { modificadoPor: u.email, modificadoPorNombre: u.nombre, fechaModificacion: ahora });
          actualizados++;
        } else {
          const autorValido = esEmail(x.creadoPor);
          const fechaValida = !!aFecha(x.fechaCreacion);
          d.items.push(Object.assign({ id: /^[A-Za-z0-9_\-]{1,64}$/.test(id) ? id : 'lnk_' + uuid() }, v.item, {
            creadoPor: autorValido ? String(x.creadoPor).toLowerCase().trim() : u.email,
            creadoPorNombre: autorValido ? (String(x.creadoPorNombre || '').trim() || nombreDesdeEmail(x.creadoPor)) : u.nombre,
            fechaCreacion: fechaValida ? aFecha(x.fechaCreacion).toISOString() : ahora,
            modificadoPor: '', modificadoPorNombre: '', fechaModificacion: '',
            visitas: 0, eliminado: false, eliminadoPor: '', fechaEliminacion: ''
          }));
          creados++;
        }
      });
      registrar(d, u, 'IMPORTAR', null, JSON.stringify({ creados, actualizados, omitidos }));
      escribir(d);
      return { creados, actualizados, omitidos, errores };
    },

    cargarSemillaFaltante() {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      let agregados = 0, categoriasAgregadas = 0;
      CATEGORIAS_SEMILLA.forEach(c => { if (!d.categorias.some(x => x.id === c.id)) { d.categorias.push(clonar(c)); categoriasAgregadas++; } });
      SEMILLA_ITEMS.forEach(s => {
        if (!d.items.some(i => i.id === s.id)) {
          const it = itemSemilla(s);
          it.fechaCreacion = ahoraISO();
          d.items.push(it); agregados++;
        }
      });
      registrar(d, u, 'SEMILLA', null, JSON.stringify({ origen: 'manual', items: agregados, categorias: categoriasAgregadas }));
      escribir(d);
      return { agregados, categoriasAgregadas };
    }
  };

  const api = { modo: 'local' };
  Object.keys(metodos).forEach(fn => {
    api[fn] = (...args) => new Promise((resolve, reject) => {
      setTimeout(() => {
        try {
          resolve(Object.assign({ ok: true }, metodos[fn](...args)));
        } catch (e) {
          reject(Object.assign({ ok: false, error: (e && e.message) || String(e) }, (e && e.extra) || {}));
        }
      }, fn === 'registrarVisita' ? 40 : LATENCIA);
    });
  });
  /** Utilidades exclusivas de la demo local */
  api.perfilActual = perfilActual;
  api.cambiarPerfil = (id) => { Almacen.set(CLAVES.PERFIL, PERFILES_DEMO.some(p => p.id === id) ? id : 'admin'); };
  api.reiniciarDemo = () => { Almacen.remove(CLAVES.DB); };
  return api;
}

const Api = createApi();

/* ============ 8. Estado de la aplicación ============ */
const CAT_DESCONOCIDA = { id: '__sin__', nombre: 'Sin categoría', seccion: '', icono: 'folder', color: '#64748B', orden: 99999, descripcion: 'Enlaces cuya categoría ya no existe.', activa: false };

const S = {

  secciones: SECCIONES.slice(),
  config: {},
  catMap: new Map(),
  secMap: new Map(),

};

const catDe = (it) => S.catMap.get(it.categoriaId) || CAT_DESCONOCIDA;
const seccionDe = (cat) => S.secMap.get(cat && cat.seccion) || null;
const itemPorId = (id) => S.items.find(i => i.id === id) || null;
const puedeEscribir = () => !!(S.usuario.puedeEscribir && S.usuario.email);
/** Permiso calculado por el servidor; si falta, se infiere (admin o autor). La autorización real vive en el servidor. */
function puedeEditar(it) {
  if (!it || !S.usuario.email) return false;
  if (typeof it.puedeEditar === 'boolean') return it.puedeEditar;
  return S.usuario.rol === 'admin' || it.creadoPor === S.usuario.email;
}

function normalizarItem(r) {
  const it = Object.assign({}, r);
  const t = (v) => String(v == null ? '' : v);
  it.id = t(it.id); it.nombre = t(it.nombre); it.categoriaId = t(it.categoriaId);
  it.url = t(it.url).trim(); it.urlScript = t(it.urlScript).trim(); it.descripcion = t(it.descripcion);
  it.tags = Array.isArray(it.tags) ? it.tags.map(t).filter(Boolean) : Reglas.normalizarTags(it.tags);
  it.tecnologias = Array.isArray(it.tecnologias) ? it.tecnologias.map(t).filter(Boolean) : Reglas.normalizarLista(it.tecnologias);
  it.iniciativa = t(it.iniciativa); it.frecuencia = t(it.frecuencia);
  it.estado = ESTADO_MAP[it.estado] ? it.estado : 'produccion';
  it.fijado = aBool(it.fijado); it.tiempoReal = aBool(it.tiempoReal);
  it.visitas = Number(it.visitas) || 0;
  it.creadoPor = t(it.creadoPor).toLowerCase();
  it.creadoPorNombre = t(it.creadoPorNombre) || (it.creadoPor ? nombreDesdeEmail(it.creadoPor) : 'Desconocido');
  it.fechaCreacion = t(it.fechaCreacion); it.modificadoPor = t(it.modificadoPor);
  it.modificadoPorNombre = t(it.modificadoPorNombre); it.fechaModificacion = t(it.fechaModificacion);
  it.eliminado = aBool(it.eliminado);
  if (typeof it.puedeEditar !== 'boolean') delete it.puedeEditar;
  return it;
}
function normalizarCat(c) {
  return {
    id: String(c.id || ''), nombre: String(c.nombre || c.id || ''), seccion: String(c.seccion || ''),
    icono: ICONOS_PERMITIDOS.includes(c.icono) ? c.icono : 'folder', color: hexValido(c.color) ? c.color : '#64748B',
    orden: Number(c.orden) || 0, descripcion: String(c.descripcion || ''), activa: c.activa === undefined ? true : aBool(c.activa)
  };
}

function reconstruirMapas() {
  S.secMap = new Map(S.secciones.map(s => [s.id, s]));
  S.catMap = new Map(S.categorias.map(c => [c.id, c]));
}

function aplicarCatalogo(r, { desdeCache = false } = {}) {
  const u = (r && r.usuario) || {};
  const rol = ['admin', 'usuario', 'invitado'].includes(u.rol) ? u.rol : 'invitado';
  S.usuario = {
    email: String(u.email || '').toLowerCase().trim(),
    nombre: String(u.nombre || '') || (u.email ? nombreDesdeEmail(u.email) : 'Invitado'),
    rol,
    esPropietario: !!u.esPropietario,
    puedeEscribir: u.puedeEscribir !== undefined ? !!u.puedeEscribir : rol !== 'invitado'
  };
  S.secciones = Array.isArray(r.secciones) && r.secciones.length ? r.secciones : SECCIONES.slice();
  S.categorias = (Array.isArray(r.categorias) ? r.categorias : []).map(normalizarCat)
    .sort((a, b) => a.orden - b.orden || a.nombre.localeCompare(b.nombre, 'es'));
  S.items = (Array.isArray(r.items) ? r.items : []).filter(i => i && !aBool(i.eliminado)).map(normalizarItem);
  S.config = (r && r.config) || {};
  S.desdeCache = desdeCache;
  reconstruirMapas();
  indexar();
  cargarFavoritos();
  S.cargado = true;
  sanearFiltros();
}

function sanearFiltros() {
  const f = S.filtros;
  if (f.seccion !== 'todo' && !S.secMap.has(f.seccion)) f.seccion = 'todo';
  if (f.cat !== 'todos' && !S.catMap.has(f.cat)) f.cat = 'todos';
  if (f.soloMios && !S.usuario.email) f.soloMios = false;
}

/** Caché del catálogo (modo GAS): pinta al instante en la próxima carga. */
function guardarCache() {
  if (S.modo !== 'gas') return;
  Almacen.setJSON(CLAVES.CACHE, {
    guardado: new Date().toISOString(),
    datos: { usuario: S.usuario, items: S.items, categorias: S.categorias, secciones: S.secciones, config: S.config }
  });
}

/* Favoritos personales (★) por usuario */
function claveFav() { return CLAVES.FAV + (S.usuario.email || 'local'); }
function cargarFavoritos() {
  const lista = Almacen.getJSON(claveFav(), []);
  S.favoritos = new Set(Array.isArray(lista) ? lista.map(String) : []);
}
function guardarFavoritos() { Almacen.setJSON(claveFav(), Array.from(S.favoritos)); }

/* ============ 9. Búsqueda (§6.4) y filtrado ============ */
function indexar() {
  S.indice = new Map();
  for (const it of S.items) {
    const cat = catDe(it);
    const sec = seccionDe(cat);
    const f = {
      nombre: normalizar(it.nombre),
      descripcion: normalizar(it.descripcion),
      tags: it.tags.map(normalizar),
      tecnologias: it.tecnologias.map(normalizar),
      iniciativa: normalizar(it.iniciativa),
      categoria: normalizar(cat.nombre),
      autor: normalizar(it.creadoPorNombre + ' ' + it.creadoPor)
    };
    f.tagsSin = f.tags.map(t => t.replace(/^#/, ''));
    f.hay = [
      f.nombre, f.descripcion, f.tags.join(' '), f.tagsSin.join(' '), f.tecnologias.join(' | '), f.iniciativa,
      f.categoria, normalizar(sec ? sec.nombre : ''), normalizar((ESTADO_MAP[it.estado] || {}).etiqueta),
      normalizar(it.frecuencia), f.autor, hostDe(it.url)
    ].join('\u0001');
    S.indice.set(it.id, f);
  }
}
function terminos(q) { return normalizar(q).split(/\s+/).filter(Boolean); }
/** Puntaje de relevancia; null si algún término no aparece. */
function puntuar(it, terms) {
  const f = S.indice.get(it.id);
  if (!f) return null;
  let total = 0;
  for (const t of terms) {
    if (!f.hay.includes(t)) return null;
    const tSin = t.replace(/^#/, '');
    let s = 0;
    if (f.nombre.includes(t)) { s += 10; if (f.nombre.startsWith(t)) s += 5; }
    if (tSin && f.tagsSin.includes(tSin)) s += 8;
    if (f.tecnologias.some(x => x.includes(t))) s += 6;
    if (f.iniciativa.includes(t)) s += 6;
    if (f.categoria.includes(t)) s += 4;
    if (f.autor.includes(t)) s += 3;
    if (f.descripcion.includes(t)) s += 2;
    total += s || 1;
  }
  return total;
}

function hayFiltrosContenido() {
  const f = S.filtros;
  return !!(S.terms.length || f.estado !== 'todos' || f.soloMios || f.soloFavs || f.tag);
}
function hayFiltros() {
  const f = S.filtros;
  return hayFiltrosContenido() || f.seccion !== 'todo' || f.cat !== 'todos';
}
function pasaFiltrosContenido(it) {
  const f = S.filtros;
  if (f.estado !== 'todos' && it.estado !== f.estado) return false;
  if (f.soloMios && it.creadoPor !== S.usuario.email) return false;
  if (f.soloFavs && !S.favoritos.has(it.id)) return false;
  if (f.tag) { const k = f.tag.toLowerCase(); if (!it.tags.some(t => t.toLowerCase() === k)) return false; }
  return true;
}

const fechaAct = (it) => Math.max(aFecha(it.fechaModificacion) ? aFecha(it.fechaModificacion).getTime() : 0, aFecha(it.fechaCreacion) ? aFecha(it.fechaCreacion).getTime() : 0);
const fechaCre = (it) => (aFecha(it.fechaCreacion) ? aFecha(it.fechaCreacion).getTime() : 0);
const cmpTexto = (a, b) => String(a || '').localeCompare(String(b || ''), 'es', { sensitivity: 'base', numeric: true });
const ORDEN_ESTADO = { produccion: 0, desarrollo: 1, historico: 2 };

function ordenEfectivo() { return (S.orden === 'relevancia' && !S.terms.length) ? 'recientes' : S.orden; }
function comparador(clave, puntajes) {
  switch (clave) {
    case 'relevancia': return (a, b) => (puntajes.get(b.id) || 0) - (puntajes.get(a.id) || 0) || (b.fijado - a.fijado) || cmpTexto(a.nombre, b.nombre);
    case 'nombre': return (a, b) => cmpTexto(a.nombre, b.nombre);
    case 'visitados': return (a, b) => b.visitas - a.visitas || cmpTexto(a.nombre, b.nombre);
    case 'actualizacion': return (a, b) => fechaAct(b) - fechaAct(a) || cmpTexto(a.nombre, b.nombre);
    case 'recientes':
    default: return (a, b) => fechaCre(b) - fechaCre(a) || cmpTexto(a.nombre, b.nombre);
  }
}
const CMP_TABLA = {
  fav: (a, b) => (S.favoritos.has(b.id) - S.favoritos.has(a.id)) || cmpTexto(a.nombre, b.nombre),
  nombre: (a, b) => cmpTexto(a.nombre, b.nombre),
  categoria: (a, b) => cmpTexto(catDe(a).nombre, catDe(b).nombre) || cmpTexto(a.nombre, b.nombre),
  estado: (a, b) => ORDEN_ESTADO[a.estado] - ORDEN_ESTADO[b.estado] || cmpTexto(a.nombre, b.nombre),
  tecnologias: (a, b) => cmpTexto(a.tecnologias.join(', '), b.tecnologias.join(', ')),
  tags: (a, b) => cmpTexto(a.tags.join(' '), b.tags.join(' ')),
  autor: (a, b) => cmpTexto(a.creadoPorNombre, b.creadoPorNombre) || cmpTexto(a.nombre, b.nombre),
  fecha: (a, b) => fechaCre(a) - fechaCre(b),
  visitas: (a, b) => a.visitas - b.visitas || cmpTexto(a.nombre, b.nombre)
};

/** Calcula resultados + conteos facetados para pestañas y categorías. */
function calcular() {
  S.terms = terminos(S.filtros.q);
  const f = S.filtros;
  const puntajes = new Map();
  const base = [];
  for (const it of S.items) {
    let p = 0;
    if (S.terms.length) { p = puntuar(it, S.terms); if (p === null) continue; }
    if (!pasaFiltrosContenido(it)) continue;
    puntajes.set(it.id, p);
    base.push(it);
  }
  const conteoSec = { todo: base.length };
  base.forEach(it => { const s = catDe(it).seccion; conteoSec[s] = (conteoSec[s] || 0) + 1; });
  const enSeccion = f.seccion === 'todo' ? base : base.filter(it => catDe(it).seccion === f.seccion);
  const conteoCat = {};
  enSeccion.forEach(it => { conteoCat[it.categoriaId] = (conteoCat[it.categoriaId] || 0) + 1; });
  const lista = f.cat === 'todos' ? enSeccion.slice() : enSeccion.filter(it => it.categoriaId === f.cat);
  lista.sort(comparador(ordenEfectivo(), puntajes));
  S.calc = { puntajes, base, conteoSec, conteoCat, lista };
  return S.calc;
}
function resultadosFiltrados() { return (S.calc || calcular()).lista; }
function esAgrupado() { return S.vista === 'tarjetas' && !S.terms.length && ordenEfectivo() === 'recientes' && S.agrupar; }

/** Orden canónico (sección → categoría → nombre) para exportar e imprimir. */
function ordenCanonico(items) {
  const posSec = (id) => { const i = S.secciones.findIndex(s => s.id === id); return i < 0 ? 99 : i; };
  return items.slice().sort((a, b) => {
    const ca = catDe(a), cb = catDe(b);
    return posSec(ca.seccion) - posSec(cb.seccion) || ca.orden - cb.orden || cmpTexto(ca.nombre, cb.nombre) || cmpTexto(a.nombre, b.nombre);
  });
}

/** Resalta términos con <mark>. Se escapa PRIMERO y luego se resalta sobre el texto escapado,
    tratando cada entidad HTML como un único carácter (nunca se parte una entidad). */
function resaltar(texto, terms = S.terms) {
  const seguro = esc(texto);
  if (!terms || !terms.length || !seguro) return seguro;
  const unidades = seguro.match(/&(?:amp|lt|gt|quot|#39|#96);|[\s\S]/g) || [];
  let norm = '';
  const mapa = [];
  unidades.forEach((u, i) => {
    const n = normalizar(u.length > 1 ? MAPA_DESESCAPE[u] : u);
    for (let k = 0; k < n.length; k++) { norm += n[k]; mapa.push(i); }
  });
  const rangos = [];
  for (const t0 of terms) {
    const t = t0.length > 1 ? t0.replace(/^#/, '') : t0;
    if (!t) continue;
    let p = norm.indexOf(t);
    while (p !== -1) { rangos.push([mapa[p], mapa[p + t.length - 1] + 1]); p = norm.indexOf(t, p + t.length); }
  }
  if (!rangos.length) return seguro;
  rangos.sort((a, b) => a[0] - b[0]);
  const fusion = [rangos[0].slice()];
  for (let i = 1; i < rangos.length; i++) {
    const ult = fusion[fusion.length - 1];
    if (rangos[i][0] <= ult[1]) ult[1] = Math.max(ult[1], rangos[i][1]); else fusion.push(rangos[i].slice());
  }
  let out = '', pos = 0;
  for (const [a, b] of fusion) {
    out += unidades.slice(pos, a).join('') + '<mark>' + unidades.slice(a, b).join('') + '</mark>';
    pos = b;
  }
  return out + unidades.slice(pos).join('');
}

/* Menú ⋯ de cada enlace (un único menú flotante reutilizable) */
function abrirMenuItem(btn) {
  const it = itemPorId(btn.dataset.id);

  const menu = $('#itemMenu');
  const url = urlSegura(it.url), urlS = urlSegura(it.urlScript);
  const puede = puedeEditar(it);
  const fav = S.favoritos.has(it.id);
  const comoAdmin = puede && S.usuario.rol === 'admin' && it.creadoPor !== S.usuario.email;
  const id = esc(it.id);
  const op = (accion, ic, txt, extra = '', clase = '') => `<button type="button" class="um-item ${clase}" role="menuitem" data-accion="${accion}" data-id="${id}" ${extra}>${icon(ic)}<span>${esc(txt)}</span></button>`;
  let html = '';
  if (url) html += op('copiar', 'copy', 'Copiar enlace');
  if (urlS) html += `<a class="um-item" role="menuitem" href="${esc(urlS)}" target="_blank" rel="noopener noreferrer" data-cerrar-menu>${icon('code')}<span>Código / Script</span></a>`;
  html += op('fav', 'star', fav ? 'Quitar de favoritos' : 'Favorito', '', fav ? 'on' : '');
  if (puede) {
    html += op('fijar', 'pin', it.fijado ? 'Quitar de fijados' : 'Fijar');
    html += '<div class="um-sep" role="separator"></div>';
    if (comoAdmin) html += `<div class="um-nota como-admin">${icon('shield')}<span>Admin · de ${esc(it.creadoPorNombre)}</span></div>`;
    if (!url) html += op('editar', 'link', 'Completar URL', 'data-enfocar="url"');
    html += op('editar', 'edit', 'Editar');
    html += op('eliminar', 'trash', 'Eliminar', '', 'peligro');
  }
  menu.innerHTML = html;
  menu.dataset.id = it.id;
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  S.menuItem = { btn, id: it.id };
  posicionarMenuItem();
  requestAnimationFrame(() => { const p = menu.querySelector('.um-item'); if (p) p.focus({ preventScroll: true }); });
}
/** Mantiene el menú ⋯ pegado a su botón (al desplazar o redimensionar); se cierra si el botón sale de la vista. */
function posicionarMenuItem() {
  const m = S.menuItem;
  const menu = $('#itemMenu');
  if (!m || menu.hidden) return;
  if (!m.btn.isConnected) { cerrarMenuItem(); return; }
  const r = m.btn.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight) { cerrarMenuItem(); return; }
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  const left = Math.min(Math.max(8, r.right - mw), window.innerWidth - mw - 8);
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8 && r.top - mh - 6 > 8) top = r.top - mh - 6;
  menu.style.left = Math.round(left) + 'px';
  menu.style.top = Math.round(top) + 'px';
}
function cerrarMenuItem(devolverFoco = false) {
  const menu = $('#itemMenu');
  if (!menu || menu.hidden) { S.menuItem = null; return; }
  menu.hidden = true;
  menu.innerHTML = '';
  const m = S.menuItem;
  S.menuItem = null;
  if (m && m.btn && m.btn.isConnected) {
    m.btn.setAttribute('aria-expanded', 'false');
    if (devolverFoco) m.btn.focus({ preventScroll: true });
  }
}

/** Columnas del tablero agrupado: mismo cálculo que auto-fill minmax(264px, 1fr) con gap de 16px. */
const MOSAICO_MIN = 264, MOSAICO_GAP = 16;
function columnasTablero() {
  const ancho = ($('#resCuerpo') && $('#resCuerpo').clientWidth) || 1200;
  return Math.max(1, Math.floor((ancho + MOSAICO_GAP) / (MOSAICO_MIN + MOSAICO_GAP)));

function grupoHtml(cat, items, cols) {
  const span = Math.max(1, Math.min(items.length || 1, cols));
  const sinCat = cat.id === '__sin__';
  const agregar = !sinCat && cat.activa && puedeEscribir()
    ? `<button type="button" class="icon-btn xs add" data-accion="nuevo-en-cat" data-valor="${esc(cat.id)}" aria-label="Agregar en ${esc(cat.nombre)}" data-tip="Agregar en ${esc(cat.nombre)}" data-tip-pos="izq">${icon('plus')}</button>` : '';

    <div class="tiles">${items.map(tile).join('')}</div>
  </section>`;

/** Vista agrupada: sección → categorías con contenido (las vacías se ocultan), en orden de sección y `orden`. */
function vistaAgrupada(lista) {
  const porCat = new Map();
  lista.forEach(it => {
    const k = S.catMap.has(it.categoriaId) ? it.categoriaId : '__sin__';
    if (!porCat.has(k)) porCat.set(k, []);
    porCat.get(k).push(it);
  });
  const secciones = S.filtros.seccion === 'todo' ? S.secciones : S.secciones.filter(s => s.id === S.filtros.seccion);
  const cols = columnasTablero();
  S.colsTablero = cols;
  let html = '';
  for (const sec of secciones) {
    const cats = S.categorias.filter(c => c.seccion === sec.id && porCat.has(c.id));
    if (!cats.length) continue;
    if (S.filtros.seccion === 'todo') html += `<h3 class="sec-label" title="${esc(sec.nombre)}">${esc(nombreCortoSeccion(sec))}</h3>`;
    html += `<div class="grupos" style="--cols:${cols}">${cats.map(c => grupoHtml(c, porCat.get(c.id), cols)).join('')}</div>`;
  }
  if (porCat.has('__sin__')) html += `<div class="grupos" style="--cols:${cols};margin-top:22px">${grupoHtml(CAT_DESCONOCIDA, porCat.get('__sin__'), cols)}</div>`;
  return html;
}

/* Lista (tabla compacta): sin desplazamiento horizontal a 1280 px */
const COLUMNAS = [
  { id: 'nombre', etiqueta: 'Nombre', clase: 'c-nombre' },
  { id: 'categoria', etiqueta: 'Categoría', clase: 'c-cat', ancho: 230 },

];
function ordenTablaActual() {
  if (S.tablaOrden) return S.tablaOrden;
  const o = ordenEfectivo();
  if (o === 'nombre') return { col: 'nombre', dir: 'asc', implicito: true };
  if (o === 'recientes') return { col: 'fecha', dir: 'desc', implicito: true };
  return null;
}
function filaTabla(it) {
  const cat = catDe(it);
  const e = ESTADO_MAP[it.estado] || ESTADOS[0];
  const id = esc(it.id);
  return `<tr data-id="${id}" style="${varsColor(cat.color)}">
    <td class="c-nombre"><div class="t-nom"><span class="cat-ico xs" aria-hidden="true">${icon(cat.icono)}</span><button type="button" class="nm" data-accion="ficha" data-id="${id}" title="${esc(it.descripcion)}">${resaltar(it.nombre)}</button></div></td>
    <td class="c-cat" title="${esc(cat.nombre)}">${esc(cat.nombre)}</td>
    <td class="c-est">${dotEstado(it)}<span class="t-est">${esc(ESTADO_CORTO[e.id])}</span></td>
    <td class="c-autor">${resaltar(it.creadoPorNombre)}</td>
    <td class="c-fecha"><time datetime="${esc(it.fechaCreacion)}" title="${esc(fechaLarga(it.fechaCreacion))}">${esc(fechaMini(it.fechaCreacion))}</time></td>
    <td class="c-acc"><div class="t-acc2">${botonAbrirMini(it)}${botonMenu(it)}</div></td>

}
function vistaTabla(lista) {
  const ord = ordenTablaActual();
  const filas = lista.slice();
  if (S.tablaOrden && CMP_TABLA[S.tablaOrden.col]) {
    const cmp = CMP_TABLA[S.tablaOrden.col];
    filas.sort((a, b) => (S.tablaOrden.dir === 'asc' ? cmp(a, b) : -cmp(a, b)));
  }
  const ths = COLUMNAS.map(c => {
    const sort = ord && ord.col === c.id ? (ord.dir === 'asc' ? 'ascending' : 'descending') : null;
    const ic = sort === 'ascending' ? 'arrow-up' : sort === 'descending' ? 'arrow-down' : 'sort';
    const contenido = c.sinOrden ? `<span class="sr-only">${esc(c.aria || c.etiqueta)}</span>`
      : `<button type="button" class="th-btn" data-accion="tabla-orden" data-valor="${c.id}" aria-label="Ordenar por ${esc(c.etiqueta)}">${esc(c.etiqueta)}${icon(ic)}</button>`;
    return `<th scope="col" class="${c.clase || ''}" ${sort ? `aria-sort="${sort}"` : ''}>${contenido}</th>`;
  }).join('');
  const cols = COLUMNAS.map(c => `<col class="${c.clase}"${c.ancho ? ` style="width:${c.ancho}px"` : ''}>`).join('');
  return `<div class="tabla-wrap" role="region" aria-label="Lista del directorio" tabindex="0"><table class="tabla"><caption class="sr-only">Directorio en lista: ${filas.length} enlaces</caption>
    <colgroup>${cols}</colgroup><thead><tr>${ths}</tr></thead><tbody>${filas.map(filaTabla).join('')}</tbody></table></div>`;
}

function estadoVacio() {
  const f = S.filtros;
  if (f.cat !== 'todos') {
    const cat = S.catMap.get(f.cat);
    if (cat && !S.items.some(i => i.categoriaId === cat.id)) return vacio(cat.icono, mensajeVacioCategoria(cat), botonCta(cat, 'Agregar'), cat.color);

function claveFoco() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.dataset || !a.dataset.accion) return a && a.id ? { id: a.id } : null;
  return { accion: a.dataset.accion, id: a.dataset.id || '', valor: a.dataset.valor || '', zona: a.closest('.fijados') ? 'wr' : a.closest('.tabla') ? 'tb' : a.closest('.filtros-pop') ? 'fp' : '' };
}
function restaurarFoco(k) {
  if (!k || Modales.hay()) return;
  if (k.id && !k.accion) { const el = document.getElementById(k.id); if (el && document.activeElement !== el) el.focus({ preventScroll: true }); return; }
  if (document.activeElement && document.activeElement !== document.body && document.activeElement.isConnected) return;
  const zona = (e) => (e.closest('.fijados') ? 'wr' : e.closest('.tabla') ? 'tb' : e.closest('.filtros-pop') ? 'fp' : '');
  const el = $$(`[data-accion="${k.accion}"]`).find(e => (e.dataset.id || '') === k.id && (e.dataset.valor || '') === k.valor && zona(e) === k.zona && !e.closest('[hidden]'));
  if (el) el.focus({ preventScroll: true });
}

/* ============ 14. Toasts (mensajes breves) ============ */
const DURACION_TOAST = 3500;
function toast(mensaje, tipo = 'info') {
  const cont = $('#toasts');
  const el = document.createElement('div');
  const ic = tipo === 'success' ? 'check' : tipo === 'error' ? 'alert' : 'info';
  el.className = `toast toast-${tipo}`;
  el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  el.innerHTML = `${icon(ic)}<span class="t-msg">${esc(mensaje)}</span><button type="button" class="t-x" aria-label="Cerrar notificación">${icon('x')}</button><span class="t-bar" style="animation-duration:${DURACION_TOAST}ms" aria-hidden="true"></span>`;
  const cerrar = () => {
    if (!el.isConnected || el.classList.contains('saliendo')) return;
    el.classList.add('saliendo');
    setTimeout(() => el.remove(), reducirMovimiento() ? 0 : 200);
  };
  el.querySelector('.t-x').addEventListener('click', cerrar);
  cont.appendChild(el);
  while (cont.children.length > 4) cont.firstElementChild.remove();
  setTimeout(cerrar, DURACION_TOAST);
  return el;
}
function mensajeError(e) { return (e && (e.error || e.message)) || 'Ocurrió un error inesperado.'; }

/* ============ 15. Sistema de modales (foco atrapado y retorno de foco) ============ */
const SELECTOR_ENFOCABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
function enfocables(raiz) {
  return $$(SELECTOR_ENFOCABLE, raiz).filter(el => !el.closest('[hidden]') && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
}

const Modales = {
  pila: [],
  hay() { return this.pila.length > 0; },
  tope() { return this.pila[this.pila.length - 1] || null; },
  /**
   * Abre un modal. opciones: { titulo, subtitulo, antetituloHtml, accionesCabHtml, icono, color, cuerpo, pie, tamano, rol, antesDeCerrar, alCerrar, clase, foco }
   * foco: selector del elemento que recibe el foco inicial (por defecto, el primer control del cuerpo).
   * Devuelve { el, cuerpo, pie, cerrar(forzar) }.
   */
  abrir(o) {
    cerrarFlotantes();
    const idT = 'mt-' + Math.random().toString(36).slice(2, 9);
    const capa = document.createElement('div');
    capa.className = 'modal-capa';
    capa.innerHTML = `
      <div class="modal ${o.tamano || 'md'} ${o.clase || ''}" role="${o.rol || 'dialog'}" aria-modal="true" aria-labelledby="${idT}" tabindex="-1" ${o.color ? `style="${varsColor(o.color)}"` : ''}>
        <header class="modal-cab">
          ${o.icono ? `<span class="m-ico">${icon(o.icono)}</span>` : ''}
          <div class="m-tit">${o.antetituloHtml || ''}<h2 id="${idT}">${esc(o.titulo || '')}</h2>${o.subtituloHtml ? `<div class="m-sub">${o.subtituloHtml}</div>` : o.subtitulo ? `<div class="m-sub">${esc(o.subtitulo)}</div>` : ''}</div>
          ${o.accionesCabHtml || ''}<button type="button" class="icon-btn" data-cerrar aria-label="Cerrar">${icon('x')}</button>
        </header>
        <div class="modal-cuerpo">${o.cuerpo || ''}</div>
        ${o.pie ? `<footer class="modal-pie">${o.pie}</footer>` : ''}
      </div>`;
    const previo = document.activeElement;
    const m = {
      capa, el: capa.querySelector('.modal'), cuerpo: capa.querySelector('.modal-cuerpo'), pie: capa.querySelector('.modal-pie'),
      cerrado: false,
      async cerrar(forzar = false) {
        if (m.cerrado) return;
        if (!forzar && o.antesDeCerrar) { const seguir = await o.antesDeCerrar(); if (!seguir) return; }
        m.cerrado = true;
        Modales.pila = Modales.pila.filter(x => x !== m);
        capa.classList.add('saliendo');
        setTimeout(() => capa.remove(), reducirMovimiento() ? 0 : 140);
        Modales.actualizarInert();
        if (o.alCerrar) o.alCerrar();
        if (previo && previo.isConnected && typeof previo.focus === 'function') previo.focus({ preventScroll: true });
        else if (Modales.tope()) Modales.tope().el.focus();
        else { const r = $('#resultados'); if (r) r.focus({ preventScroll: true }); }
      }
    };
    capa.addEventListener('mousedown', (e) => { if (e.target === capa) m.cerrar(); });
    capa.addEventListener('click', (e) => { if (e.target.closest('[data-cerrar]')) m.cerrar(); });
    $('#modalRoot').appendChild(capa);
    this.pila.push(m);
    this.actualizarInert();
    requestAnimationFrame(() => {
      const preferido = (o.foco && m.el.querySelector(o.foco)) || m.el.querySelector('[autofocus]') || enfocables(m.cuerpo)[0] || enfocables(m.el)[0] || m.el;
      preferido.focus({ preventScroll: true });
    });
    return m;
  },
  cerrarTope() { const t = this.tope(); if (t) t.cerrar(); },
  actualizarInert() {
    const app = $('#app');
    const hay = this.pila.length > 0;
    if (hay) {
      const ancho = window.innerWidth - document.documentElement.clientWidth;
      if (!document.body.classList.contains('con-modal')) document.body.style.paddingRight = ancho > 0 ? ancho + 'px' : '';
      document.body.classList.add('con-modal');
      app.setAttribute('inert', ''); app.setAttribute('aria-hidden', 'true');
    } else {
      document.body.classList.remove('con-modal'); document.body.style.paddingRight = '';
      app.removeAttribute('inert'); app.removeAttribute('aria-hidden');
    }
    this.pila.forEach((m, i) => { if (i < this.pila.length - 1) m.capa.setAttribute('inert', ''); else m.capa.removeAttribute('inert'); });
  }
};

/** Botón con spinner mientras se espera al servidor (escrituras pesimistas). */
function conCarga(btn, cargando, textoCarga) {
  if (!btn) return;
  if (cargando) {
    btn.dataset.html = btn.innerHTML;
    btn.classList.add('cargando'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = `<span class="spin" aria-hidden="true"></span><span class="lbl-m">${esc(textoCarga || 'Guardando…')}</span>`;
  } else if (btn.dataset.html !== undefined) {
    btn.innerHTML = btn.dataset.html; delete btn.dataset.html;
    btn.classList.remove('cargando'); btn.disabled = false; btn.removeAttribute('aria-busy');
  }
}

/**
 * Diálogo de confirmación propio (no window.confirm).
 * Si se pasa `accion` (async), se ejecuta con spinner y el diálogo solo se cierra si tiene éxito.
 */
function confirmar({ titulo, mensaje, mensajeHtml, textoConfirmar = 'Confirmar', textoCancelar = 'Cancelar', peligro = false, icono, accion, textoCarga }) {
  return new Promise((resolve) => {
    let resultado = false;
    const m = Modales.abrir({
      titulo, icono: icono || (peligro ? 'alert' : 'info'), color: peligro ? '#DC2626' : '#0284C7', tamano: 'sm', rol: 'alertdialog',
      cuerpo: `<p class="confirm-txt">${mensajeHtml || esc(mensaje || '')}</p><div class="alerta alerta-error" data-err hidden style="margin-top:12px"></div>`,
      pie: `<button type="button" class="btn btn-secondary" data-cancelar>${esc(textoCancelar)}</button>
            <button type="button" class="btn ${peligro ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(textoConfirmar)}</button>`,
      antesDeCerrar: async () => !m.el.querySelector('[data-ok]').classList.contains('cargando'),
      alCerrar: () => resolve(resultado)
    });
    const ok = m.el.querySelector('[data-ok]');
    m.el.querySelector('[data-cancelar]').addEventListener('click', () => m.cerrar());
    ok.addEventListener('click', async () => {
      if (!accion) { resultado = true; m.cerrar(true); return; }
      const err = m.el.querySelector('[data-err]');
      err.hidden = true;
      conCarga(ok, true, textoCarga || 'Procesando…');
      try {
        await accion();
        resultado = true;
        m.cerrar(true);
      } catch (e) {
        conCarga(ok, false);
        err.innerHTML = `${icon('alert')}<span>${esc(mensajeError(e))}</span>`;
        err.hidden = false;
        toast(mensajeError(e), 'error');
      }
    });
    requestAnimationFrame(() => (peligro ? m.el.querySelector('[data-cancelar]') : ok).focus());
  });
}

/* ============ 16. Acciones sobre enlaces (escrituras pesimistas) ============ */
function upsertItem(raw) {
  const it = normalizarItem(raw);
  const i = S.items.findIndex(x => x.id === it.id);
  if (i >= 0) S.items[i] = it; else S.items.push(it);
  indexar();
  guardarCache();
}
function quitarItem(id) {
  S.items = S.items.filter(x => x.id !== id);
  S.favoritos.delete(id);
  guardarFavoritos();
  indexar();
  guardarCache();
}
function destacarTarjeta(id) {
  requestAnimationFrame(() => {
    const el = $(`#resCuerpo .tile[data-id="${CSS.escape(id)}"]`) || $(`.tabla tr[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: reducirMovimiento() ? 'auto' : 'smooth' });
    el.classList.remove('destello'); void el.offsetWidth; el.classList.add('destello');
  });
}

function alternarFavorito(id) {
  const it = itemPorId(id);
  if (!it) return;
  const ahora = !S.favoritos.has(id);
  if (ahora) S.favoritos.add(id); else S.favoritos.delete(id);
  guardarFavoritos();
  renderDirectorio();
  $$(`.modal [data-fav-ficha="${CSS.escape(id)}"]`).forEach(b => pintarBotonFavFicha(b, ahora));
  toast(ahora ? 'Agregado a favoritos' : 'Quitado de favoritos', 'info');
}

/** Fijar / quitar del Warroom (equipo). Devuelve true si se aplicó. */
async function alternarFijado(id, btn) {
  const it = itemPorId(id);
  if (!it) return false;
  if (!puedeEditar(it)) { toast('Solo el autor o un admin', 'error'); return false; }
  const nuevo = !it.fijado;
  if (btn) conCarga(btn, true, nuevo ? 'Fijando…' : 'Quitando…');
  try {
    const r = await Api.fijarHerramienta(it.id, nuevo);
    upsertItem(r.item || Object.assign({}, it, { fijado: nuevo }));
    render();
    toast(nuevo ? 'Fijado' : 'Quitado de fijados', 'success');
    return true;
  } catch (err) {
    if (btn) conCarga(btn, false);
    toast(mensajeError(err), 'error');
    return false;
  }
}

function copiarEnlaceItem(id) {
  const it = itemPorId(id);
  const url = it && urlSegura(it.url);
  if (!url) { toast('Sin URL', 'info'); return; }
  copiarTexto(url).then(() => toast('Enlace copiado', 'success')).catch(() => toast('No se pudo copiar: ' + url, 'error'));
}

function registrarVisita(id) {
  const it = itemPorId(id);
  if (!it) return;
  Api.registrarVisita(id).then(r => {
    const n = Number(r && r.visitas);
    if (!isNaN(n)) {
      it.visitas = n;
      $$(`[data-visitas="${CSS.escape(id)}"]`).forEach(el => { el.textContent = fmtNum(n); });
      guardarCache();
    }
  }).catch(() => { /* registrar visitas nunca bloquea la navegación */ });
}

function eliminarItem(id) {
  const it = itemPorId(id);
  if (!it) return;
  if (!puedeEditar(it)) { toast('Solo el autor o un admin', 'error'); return; }
  const ajeno = it.creadoPor !== S.usuario.email;
  return confirmar({
    titulo: '¿Eliminar enlace?', peligro: true, icono: 'trash', textoConfirmar: 'Eliminar', textoCarga: 'Eliminando…',
    mensajeHtml: `<strong>«${esc(it.nombre)}»</strong> irá a la papelera.${ajeno ? ` Subido por ${esc(it.creadoPorNombre)}.` : ''}`,
    accion: async () => {
      await Api.eliminarHerramienta(id);
      quitarItem(id);
      Modales.pila.filter(m => m.el.dataset.fichaId === id).forEach(m => m.cerrar(true));
      render();
      toast('Eliminado', 'success');
    }
  });
}

/* ============ 17. Ficha de detalle (único lugar con todos los datos) ============ */
function urlFicha(id) {
  if (S.modo === 'gas') {
    const base = String(S.config.appUrl || '');
    return base ? `${base}${base.includes('?') ? '&' : '?'}id=${encodeURIComponent(id)}` : '';
  }
  return `${location.href.split(/[?#]/)[0]}?id=${encodeURIComponent(id)}`;
}
function pintarBotonFavFicha(btn, on) {
  btn.setAttribute('aria-pressed', String(on));
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-label', on ? 'Quitar de favoritos' : 'Agregar a favoritos');
  btn.setAttribute('data-tip', on ? 'Quitar favorito' : 'Favorito');
  btn.innerHTML = icon('star');
}
function abrirFicha(id) {
  const it = itemPorId(id);
  if (!it) { toast('Enlace no encontrado', 'error'); return; }
  cerrarMenuItem();
  const cat = catDe(it);
  const est = ESTADO_MAP[it.estado] || ESTADOS[0];
  const puede = puedeEditar(it);
  const fav = S.favoritos.has(it.id);
  const vivo = it.tiempoReal && it.estado === 'produccion';
  const url = urlSegura(it.url), urlS = urlSegura(it.urlScript);
  const ib = (m, ic, tip, extra = '') => `<button type="button" class="icon-btn" data-m="${m}" aria-label="${esc(tip)}" data-tip="${esc(tip)}" ${extra}>${icon(ic)}</button>`;
  const abrir = url
    ? `<a class="btn btn-primary btn-abrir" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-m="visita" aria-label="Abrir ${esc(it.nombre)} (pestaña nueva)">Abrir ${icon('external')}</a>`
    : puede ? `<button type="button" class="btn btn-primary btn-abrir" data-m="editar-url">${icon('link')}Completar URL</button>`
    : `<span class="btn btn-secondary btn-abrir" aria-disabled="true">${icon('link-off')}${it.url ? 'URL no válida' : 'Sin URL'}</span>`;
  const iconos = [
    url ? ib('copiar-url', 'copy', 'Copiar enlace', `data-url="${esc(url)}"`) : '',
    urlS ? `<a class="icon-btn" href="${esc(urlS)}" target="_blank" rel="noopener noreferrer" aria-label="Código / Script" data-tip="Código / Script">${icon('code')}</a>` : '',
    `<button type="button" class="icon-btn fav" data-m="fav" data-fav-ficha="${esc(it.id)}"></button>`,
    puede ? ib('fijar', 'pin', it.fijado ? 'Quitar de fijados' : 'Fijar', `aria-pressed="${it.fijado}"`) : '',
    ib('copiar-ficha', 'link', 'Copiar enlace a la ficha'),
    puede ? `<span class="f-div" aria-hidden="true"></span>${ib('editar', 'edit', 'Editar')}${ib('eliminar', 'trash', 'Eliminar')}` : ''
  ].join('');
  const datos = [];
  datos.push(['Subido por', `<span title="${esc(it.creadoPor || '')}">${esc(it.creadoPorNombre)}</span> · <time datetime="${esc(it.fechaCreacion)}" title="${esc(fechaLarga(it.fechaCreacion))}">${esc(fechaMini(it.fechaCreacion))}</time>`]);
  if (it.fechaModificacion) datos.push(['Actualizado', `${esc(it.modificadoPorNombre || it.modificadoPor || '—')} · <time datetime="${esc(it.fechaModificacion)}" title="${esc(fechaLarga(it.fechaModificacion))}">${esc(fechaMini(it.fechaModificacion))}</time>`]);
  if (it.iniciativa) datos.push(['Iniciativa', esc(it.iniciativa)]);
  if (it.frecuencia) datos.push(['Frecuencia', esc(it.frecuencia)]);
  if (it.tecnologias.length) datos.push(['Tecnologías', `<div class="chips">${it.tecnologias.map(t => `<span class="chip-tec">${esc(t)}</span>`).join('')}</div>`, 'ancho']);
  if (it.tags.length) datos.push(['Etiquetas', `<div class="chips">${it.tags.map(t => `<button type="button" class="tag" data-m="tag" data-valor="${esc(t)}" aria-label="Filtrar por ${esc(t)}">${esc(t)}</button>`).join('')}</div>`, 'ancho']);
  const cuerpo = `<div class="f-acc">${abrir}<div class="f-iconos">${iconos}</div></div>
    <p class="ficha-desc">${esc(it.descripcion)}</p>
    <dl class="f-datos">${datos.map(([k, v, c]) => `<div class="${c || ''}"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <div class="f-visitas" title="Visitas">${icon('eye')}<span data-visitas="${esc(it.id)}">${fmtNum(it.visitas)}</span><span class="sr-only"> visitas</span></div>`;
  const sub = `<div class="f-sub">${dotEstado(it)}<span>${esc(est.etiqueta)}${vivo ? ' · Tiempo real' : ''}</span><span class="sep" aria-hidden="true">·</span><span class="f-cat">${esc(cat.nombre)}</span></div>`;
  const m = Modales.abrir({ titulo: it.nombre, icono: cat.icono, color: cat.color, tamano: 'md', clase: 'ficha', foco: '[data-cerrar]', subtituloHtml: sub, cuerpo });
  m.el.dataset.fichaId = it.id;
  pintarBotonFavFicha(m.el.querySelector('[data-m="fav"]'), fav);
  m.el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const acc = b.dataset.m;
    if (acc === 'visita') { registrarVisita(it.id); return; }
    if (acc === 'copiar-url') { copiarTexto(b.dataset.url).then(() => toast('Enlace copiado', 'success')).catch(() => toast('No se pudo copiar', 'error')); return; }
    if (acc === 'copiar-ficha') {
      const u = urlFicha(it.id);
      if (!u) { toast('URL de la app no disponible', 'error'); return; }
      copiarTexto(u).then(() => toast('Enlace a ficha copiado', 'success')).catch(() => toast('No se pudo copiar: ' + u, 'error'));
      return;
    }
    if (acc === 'fav') { alternarFavorito(it.id); return; }
    if (acc === 'tag') { m.cerrar(true); aplicarFiltro({ tag: b.dataset.valor }); return; }
    if (acc === 'editar') { m.cerrar(true); abrirFormulario(itemPorId(it.id)); return; }
    if (acc === 'editar-url') { m.cerrar(true); abrirFormulario(itemPorId(it.id), { enfocar: 'url' }); return; }
    if (acc === 'eliminar') { eliminarItem(it.id); return; }
    if (acc === 'fijar') {
      if (await alternarFijado(it.id, b)) { m.cerrar(true); abrirFicha(it.id); }
    }
  });
}

/* ============ 18. Formulario Agregar / Editar (lo esencial + "Más opciones") ============ */
function opcionesCategoria(seleccion) {
  return S.secciones.map(sec => {
    const cats = S.categorias.filter(c => c.seccion === sec.id && (c.activa || c.id === seleccion));
    if (!cats.length) return '';
    return `<optgroup label="${esc(sec.nombre)}">${cats.map(c => `<option value="${esc(c.id)}" ${c.id === seleccion ? 'selected' : ''}>${esc(c.nombre)}${!c.activa ? ' (inactiva)' : ''}</option>`).join('')}</optgroup>`;
  }).join('');
}

          <div class="chips-sel" id="fTecChips" role="group" aria-labelledby="lblTec"></div>
          <div class="tec-libre"><input type="text" id="fTecLibre" class="campo-input" maxlength="40" placeholder="Otra… (Enter)" aria-label="Agregar otra tecnología">
            <button type="button" class="btn btn-secondary" id="fTecAgregar" aria-label="Agregar tecnología">${icon('plus')}</button></div>
          <span class="err" id="eTecnologias"></span>
        </div>
        <div class="campo">
          <label for="fIniciativa">Iniciativa</label>
          <input type="text" id="fIniciativa" name="iniciativa" list="dlIniciativas" maxlength="80" value="${esc(base.iniciativa)}" placeholder="SPEI, MP2C…" aria-describedby="eIniciativa">
          <datalist id="dlIniciativas">${SUG_INICIATIVAS.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
          <span class="err" id="eIniciativa"></span>
        </div>
        <div class="campo">
          <label for="fFrecuencia">Frecuencia</label>
          <input type="text" id="fFrecuencia" name="frecuencia" list="dlFrecuencias" maxlength="60" value="${esc(base.frecuencia)}" placeholder="Diario, Tiempo real…" aria-describedby="eFrecuencia">
          <datalist id="dlFrecuencias">${SUG_FRECUENCIAS.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
          <span class="err" id="eFrecuencia"></span>
        </div>
        <fieldset class="campo span-2">
          <legend class="lbl">Estado</legend>
          <div class="seg seg-radio">
            ${ESTADOS.map(e => `<label title="${esc(e.etiqueta)}"><input type="radio" name="estado" value="${e.id}" ${base.estado === e.id ? 'checked' : ''}><span class="dot" style="background:${e.color}" aria-hidden="true"></span>${esc(ESTADO_CORTO[e.id])}</label>`).join('')}
          </div>
        </fieldset>
        <div class="campo span-2">
          <div class="check-cards">
            <label class="check-card"><input type="checkbox" id="fFijado" ${base.fijado ? 'checked' : ''}><span class="switch-v" aria-hidden="true"></span><span class="ck-t">${icon('pin')}Fijar en Warroom</span></label>
            <label class="check-card"><input type="checkbox" id="fTiempoReal" ${base.tiempoReal ? 'checked' : ''}><span class="switch-v" aria-hidden="true"></span><span class="ck-t">${icon('activity')}Monitor en tiempo real</span></label>
          </div>
        </div>
      </div>
    </form>`;
  const nota = edicion
    ? `Subido por <strong>${esc(item.creadoPorNombre)}</strong> · <span title="${esc(fechaLarga(item.fechaCreacion))}">${esc(fechaMini(item.fechaCreacion))}</span>`
    : `Se publicará como <strong>${esc(S.usuario.nombre)}</strong>`;
  const pie = `<span class="nota" title="${esc(edicion ? item.creadoPor : S.usuario.email)}">${nota}</span>
    <button type="button" class="btn btn-secondary" data-cancelar>Cancelar</button>
    <button type="submit" form="formEnlace" class="btn btn-primary" id="fGuardar">${icon('check')}Guardar</button>`;

  let inicial = '';
  let guardado = false;
  const m = Modales.abrir({
    titulo: edicion ? 'Editar enlace' : 'Nuevo enlace',
    icono: edicion ? 'edit' : 'plus', tamano: 'md', cuerpo, pie,
    antesDeCerrar: async () => {
      if (guardado || JSON.stringify(leer()) === inicial) return true;
      return confirmar({ titulo: '¿Descartar cambios?', mensaje: 'Los cambios no guardados se perderán.', textoConfirmar: 'Descartar', peligro: true, icono: 'alert' });
    }
  });
  const f = (id) => m.el.querySelector('#' + id);
  const form = f('formEnlace');

  function leer() {
    const est = form.querySelector('input[name="estado"]:checked');
    return {
      id: edicion ? item.id : '',
      nombre: f('fNombre').value, categoriaId: f('fCategoria').value, url: f('fUrl').value, urlScript: f('fUrlScript').value,
      descripcion: f('fDescripcion').value, tags: Reglas.normalizarTags(f('fTags').value), tecnologias: tecSel.slice(),
      iniciativa: f('fIniciativa').value, frecuencia: f('fFrecuencia').value, estado: est ? est.value : 'produccion',
      fijado: f('fFijado').checked, tiempoReal: f('fTiempoReal').checked
    };
  }
  /* "Más opciones" plegable */
  function masOpciones(abrir) {
    const b = f('fMas');
    const on = abrir === undefined ? b.getAttribute('aria-expanded') !== 'true' : !!abrir;
    b.setAttribute('aria-expanded', String(on));
    f('fMasPanel').hidden = !on;
  }
  f('fMas').addEventListener('click', () => masOpciones());

  const MAPA_ERR = { nombre: ['fNombre', 'eNombre'], categoriaId: ['fCategoria', 'eCategoria'], url: ['fUrl', 'eUrl'], urlScript: ['fUrlScript', 'eUrlScript'],
    descripcion: ['fDescripcion', 'eDescripcion'], tags: ['fTags', 'eTags'], tecnologias: ['fTecLibre', 'eTecnologias'], iniciativa: ['fIniciativa', 'eIniciativa'], frecuencia: ['fFrecuencia', 'eFrecuencia'] };
  function mostrarErrores(errores, soloCampo) {
    Object.keys(MAPA_ERR).forEach(k => {
      if (soloCampo && k !== soloCampo) return;
      const [inp, err] = MAPA_ERR[k];
      const msg = errores[k] ? (ERR_CORTO[k] ? ERR_CORTO[k](errores[k]) : errores[k]) : '';
      f(err).innerHTML = msg ? `${icon('alert')}<span>${esc(msg)}</span>` : '';
      if (msg) f(inp).setAttribute('aria-invalid', 'true'); else f(inp).removeAttribute('aria-invalid');
    });
  }
  function validarCampo(k) { const v = Reglas.validar(leer(), { previo: item, categorias: S.categorias }); mostrarErrores(v.errores, k); return v; }

  /* Tecnologías: chips sugeridos + texto libre */
  function pintarTec() {
    const extras = tecSel.filter(t => !SUG_TECNOLOGIAS.some(s => s.toLowerCase() === t.toLowerCase()));
    f('fTecChips').innerHTML = SUG_TECNOLOGIAS.map(t => {
      const on = tecSel.some(x => x.toLowerCase() === t.toLowerCase());
      return `<button type="button" class="chip-sel" data-tec="${esc(t)}" aria-pressed="${on}">${on ? icon('check') : ''}${esc(t)}</button>`;
    }).join('') + extras.map(t => `<button type="button" class="chip-sel libre" data-tec="${esc(t)}" aria-pressed="true" aria-label="Quitar ${esc(t)}">${esc(t)}${icon('x')}</button>`).join('');
    const c = f('cTec');
    c.textContent = tecSel.length ? `${tecSel.length}/8` : '';
    c.classList.toggle('mal', tecSel.length > 8);
  }
  function alternarTec(t) {
    const i = tecSel.findIndex(x => x.toLowerCase() === t.toLowerCase());
    if (i >= 0) tecSel.splice(i, 1);
    else {
      if (tecSel.length >= LIMITES.TEC_MAX) { f('eTecnologias').innerHTML = `${icon('alert')}<span>Máximo ${LIMITES.TEC_MAX}</span>`; return; }
      tecSel.push(t);
    }
    f('eTecnologias').innerHTML = '';
    pintarTec();
  }
  function agregarTecLibre() {
    const inp = f('fTecLibre');
    Reglas.partirLista(inp.value).map(t => Reglas.linea(t).slice(0, LIMITES.TEC_LEN).trim()).filter(Boolean).forEach(t => {
      if (!tecSel.some(x => x.toLowerCase() === t.toLowerCase())) alternarTec(t);
    });
    inp.value = '';
  }
  f('fTecChips').addEventListener('click', (e) => { const b = e.target.closest('[data-tec]'); if (b) alternarTec(b.dataset.tec); });
  f('fTecAgregar').addEventListener('click', agregarTecLibre);
  f('fTecLibre').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); agregarTecLibre(); } });

  /* Etiquetas: vista previa normalizada + sugeridas */
  function pintarTags() {
    const valor = f('fTags').value;
    const tags = Reglas.normalizarTags(valor);
    const crudos = Reglas.partirLista(valor);
    const recortadas = crudos.length > LIMITES.TAGS_MAX || crudos.some(t => ('#' + t.replace(/\s+/g, '').replace(/^#+/, '')).length > LIMITES.TAG_LEN);
    f('fTagsPrev').innerHTML = tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')
      + (recortadas ? `<span class="aviso-tags">Se guardarán máximo ${LIMITES.TAGS_MAX} de ${LIMITES.TAG_LEN} caracteres</span>` : '');
    const c = f('cTags');
    c.textContent = tags.length ? `${tags.length}/${LIMITES.TAGS_MAX}` : '';
    c.classList.toggle('mal', recortadas);
    const usadas = new Set(tags.map(t => t.toLowerCase()));
    const sug = tagsPopulares().filter(t => !usadas.has(t.tag.toLowerCase())).slice(0, 5);
    f('fTagsSug').innerHTML = sug.length && tags.length < LIMITES.TAGS_MAX
      ? sug.map(t => `<button type="button" class="chip-sug" data-tag-add="${esc(t.tag)}" aria-label="Agregar etiqueta ${esc(t.tag)}">${icon('plus')}${esc(t.tag)}</button>`).join('')
      : '';
  }
  f('fTags').addEventListener('input', pintarTags);
  f('fTagsSug').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tag-add]');
    if (!b) return;
    const inp = f('fTags');
    const actual = inp.value.trim().replace(/[,;]\s*$/, '');
    inp.value = (actual ? actual + ', ' : '') + b.dataset.tagAdd;
    pintarTags();
    const sig = f('fTagsSug').querySelector('[data-tag-add]');
    (sig || inp).focus();
  });
  f('fTags').addEventListener('blur', () => validarCampo('tags'));

  /* Contador de descripción: pista "Breve" que se pone ámbar después de 200 caracteres */
  function pintarContador() {
    const n = f('fDescripcion').value.trim().length;
    const c = f('cDescripcion');
    c.textContent = n > 200 ? `${n} / 1000` : 'Breve: 1–2 líneas';
    c.classList.toggle('largo', n > 200 && n <= 1000);
    c.classList.toggle('mal', n > 1000);
  }
  f('fDescripcion').addEventListener('input', pintarContador);

  /* Aviso en vivo de URL duplicada contra los enlaces cargados */
  const revisarDuplicado = debounce(() => {
    const dup = urlSegura(f('fUrl').value) ? Reglas.buscarDuplicado(f('fUrl').value, S.items, edicion ? item.id : null) : null;
    const box = f('fDup');
    if (dup) {
      box.innerHTML = `${icon('alert')}<span>Ya existe: <strong>«${esc(dup.nombre)}»</strong> · <button type="button" class="link-mini" data-ver-dup="${esc(dup.id)}">Ver</button></span>`;
      box.hidden = false;
    } else { box.hidden = true; box.innerHTML = ''; }
  }, 150);
  f('fUrl').addEventListener('input', revisarDuplicado);
  f('fDup').addEventListener('click', (e) => { const b = e.target.closest('[data-ver-dup]'); if (b) abrirFicha(b.dataset.verDup); });

  ['fNombre', 'fCategoria', 'fUrl', 'fUrlScript', 'fDescripcion', 'fIniciativa', 'fFrecuencia'].forEach(id => {
    const k = Object.keys(MAPA_ERR).find(x => MAPA_ERR[x][0] === id);
    f(id).addEventListener('blur', () => { if (f(id).value.trim() || f(id).getAttribute('aria-invalid')) validarCampo(k); });
    f(id).addEventListener('input', () => { if (f(id).getAttribute('aria-invalid')) validarCampo(k); });
  });
  f('fCategoria').addEventListener('change', () => validarCampo('categoriaId'));
  m.el.querySelector('[data-cancelar]').addEventListener('click', () => m.cerrar());

  async function guardar(confirmarDuplicado = false) {
    const datos = leer();
    const v = Reglas.validar(datos, { previo: item, categorias: S.categorias });
    mostrarErrores(v.errores);
    const gen = f('fErrGeneral');
    gen.hidden = true;
    if (!v.valido) {
      if (CAMPOS_MAS_OPCIONES.some(k => v.errores[k])) masOpciones(true);
      const primero = Object.keys(MAPA_ERR).find(k => v.errores[k]);
      if (primero) f(MAPA_ERR[primero][0]).focus();
      return;
    }
    const btn = f('fGuardar') || m.el.querySelector('#fGuardar');
    conCarga(btn, true, 'Guardando…');
    try {
      const r = await Api.guardarHerramienta(confirmarDuplicado ? Object.assign({}, datos, { confirmarDuplicado: true }) : datos);
      guardado = true;
      upsertItem(r.item);
      m.cerrar(true);
      render();
      destacarTarjeta(r.item.id);
      toast(r.accion === 'creado' ? 'Enlace agregado' : 'Guardado', 'success');
    } catch (e) {
      conCarga(btn, false);
      if (e && e.duplicado && !confirmarDuplicado) {
        const seguir = await confirmar({
          titulo: 'Enlace duplicado', icono: 'alert', textoConfirmar: 'Guardar de todos modos',
          mensajeHtml: `Ya existe <strong>«${esc((e.duplicado && e.duplicado.nombre) || '')}»</strong> con esta URL.`
        });
        if (seguir) return guardar(true);
        f('fUrl').focus();
        return;
      }
      gen.innerHTML = `${icon('alert')}<span>${esc(mensajeError(e))}</span>`;
      gen.hidden = false;
      toast(mensajeError(e), 'error');
    }
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); guardar(false); });

  pintarTec(); pintarTags(); pintarContador();
  inicial = JSON.stringify(leer());
  requestAnimationFrame(() => {
    const destino = enfocar === 'url' ? f('fUrl') : f('fNombre');
    destino.focus();
    if (enfocar === 'url') destino.scrollIntoView({ block: 'center' });
  });
}

/* ============ 19. Exportación (JSON / Markdown / CSV) ============ */
const ARCHIVOS_EXPORT = { json: 'Directorio_Space_1_0.json', md: 'Directorio_Space_1_0.md', csv: 'Directorio_Space_1_0.csv' };
function itemExportable(it) {
  const campos = ['id', 'nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia',
    'creadoPor', 'creadoPorNombre', 'fechaCreacion', 'modificadoPor', 'modificadoPorNombre', 'fechaModificacion', 'visitas'];
  const o = {};
  campos.forEach(k => { o[k] = it[k]; });
  return o;
}
function generadoPor() { return S.usuario.email ? `${S.usuario.nombre} (${S.usuario.email})` : 'Invitado'; }
const Exportar = {
  json(items) {
    return JSON.stringify({
      generado: new Date().toISOString(),
      generadoPor: generadoPor(),
      version: S.config.version || APP_VERSION,
      categorias: S.categorias.map(c => clonar(c)),
      items: ordenCanonico(items).map(itemExportable)
    }, null, 2);
  },
  md(items) {
    const celda = (v) => String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/\|/g, '\\|').replace(/\r?\n|\r/g, ' ').trim();
    const urlMd = (u) => u.replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/ /g, '%20');
    const ancla = (t) => String(t).toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s/g, '-');
    const lista = ordenCanonico(items);
    const porEstado = {};
    lista.forEach(i => { porEstado[i.estado] = (porEstado[i.estado] || 0) + 1; });
    const lineas = [];
    lineas.push('# Directorio Space 1.0 — Hub de Herramientas, Scripts y Tableros', '');
    lineas.push(`> Generado el ${fechaLarga(new Date().toISOString())} por ${generadoPor()}`);
    lineas.push(`> ${TITULO_APP}`, '');
    lineas.push('## Resumen', '');
    lineas.push(`- **Total de enlaces:** ${lista.length}`);
    S.secciones.forEach(s => lineas.push(`- **${s.nombre}:** ${lista.filter(i => catDe(i).seccion === s.id).length}`));
    lineas.push(`- **Por estado:** ${ESTADOS.map(e => `${e.etiqueta}: ${porEstado[e.id] || 0}`).join(' · ')}`);
    lineas.push(`- **Contribuidores:** ${new Set(lista.map(i => i.creadoPor)).size}`, '');
    const grupos = [];
    S.secciones.forEach(sec => {
      const cats = S.categorias.filter(c => c.seccion === sec.id).map(c => ({ cat: c, items: lista.filter(i => i.categoriaId === c.id) })).filter(g => g.items.length);
      if (cats.length) grupos.push({ sec, cats });
    });
    const huerfanos = lista.filter(i => !S.catMap.has(i.categoriaId));
    lineas.push('## Índice', '');
    grupos.forEach(g => {
      lineas.push(`- [${g.sec.nombre}](#${ancla(g.sec.nombre)})`);
      g.cats.forEach(c => lineas.push(`  - [${c.cat.nombre} (${c.items.length})](#${ancla(`${c.cat.nombre} (${c.items.length})`)})`));
    });
    if (huerfanos.length) lineas.push(`- [Sin categoría (${huerfanos.length})](#${ancla(`Sin categoría (${huerfanos.length})`)})`);
    lineas.push('');
    const tabla = (its) => {
      lineas.push('| Herramienta | Descripción | Estado | Etiquetas | Subido por | Fecha | Enlaces |', '|---|---|---|---|---|---|---|');
      its.forEach(i => {
        const u = urlSegura(i.url), us = urlSegura(i.urlScript);
        const enlaces = [u ? `[Abrir](${urlMd(u)})` : 'URL pendiente', us ? `[Código](${urlMd(us)})` : ''].filter(Boolean).join(' · ');
        lineas.push(`| **${celda(i.nombre)}** | ${celda(i.descripcion)} | ${celda((ESTADO_MAP[i.estado] || {}).etiqueta)} | ${celda(i.tags.join(' '))} | ${celda(i.creadoPorNombre)} | ${celda(fechaCorta(i.fechaCreacion))} | ${enlaces} |`);
      });
      lineas.push('');
    };
    grupos.forEach(g => {
      lineas.push(`## ${g.sec.nombre}`, '', g.sec.descripcion ? `_${g.sec.descripcion}_` : '', '');
      g.cats.forEach(c => { lineas.push(`### ${c.cat.nombre} (${c.items.length})`, ''); if (c.cat.descripcion) lineas.push(c.cat.descripcion, ''); tabla(c.items); });
    });
    if (huerfanos.length) { lineas.push(`### Sin categoría (${huerfanos.length})`, ''); tabla(huerfanos); }
    lineas.push('---', `_Directorio Space 1.0 · PTM Banxico · v${S.config.version || APP_VERSION}_`);
    return lineas.join('\n').replace(/\n{3,}/g, '\n\n');
  },
  csv(items) {
    const celda = (v) => {
      let s = String(v == null ? '' : v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;             // protección contra inyección de fórmulas
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const cab = ['ID', 'Nombre', 'Sección', 'Categoría', 'Estado', 'Descripción', 'URL', 'URL Script', 'Etiquetas', 'Tecnologías', 'Iniciativa', 'Frecuencia',
      'Fijado en Warroom', 'Tiempo real', 'Subido por', 'Correo del autor', 'Fecha de creación', 'Modificado por', 'Fecha de modificación', 'Visitas'];
    const filas = ordenCanonico(items).map(i => {
      const cat = catDe(i), sec = seccionDe(cat);
      return [i.id, i.nombre, sec ? sec.nombre : '', cat.nombre, (ESTADO_MAP[i.estado] || {}).etiqueta, i.descripcion, i.url, i.urlScript, i.tags.join(', '), i.tecnologias.join(', '),
        i.iniciativa, i.frecuencia, i.fijado ? 'Sí' : 'No', i.tiempoReal ? 'Sí' : 'No', i.creadoPorNombre, i.creadoPor, i.fechaCreacion, i.modificadoPorNombre || i.modificadoPor,
        i.fechaModificacion, i.visitas].map(celda).join(',');
    });
    return [cab.map(celda).join(',')].concat(filas).join('\r\n');
  }
};
const MIME_EXPORT = { json: 'application/json;charset=utf-8', md: 'text/markdown;charset=utf-8', csv: 'text/csv;charset=utf-8' };

function abrirExportar() {
  const filtrados = resultadosFiltrados();
  let formato = 'json';
  let alcance = hayFiltros() ? 'filtrados' : 'completo';
  const cuerpo = `
    <div class="exp-cab">
      <div class="seg" role="tablist" aria-label="Formato de exportación">
        <button type="button" role="tab" data-fmt="json" aria-selected="true" aria-pressed="true">${icon('json')}JSON</button>
        <button type="button" role="tab" data-fmt="md" aria-selected="false" aria-pressed="false">${icon('file-text')}Markdown</button>
        <button type="button" role="tab" data-fmt="csv" aria-selected="false" aria-pressed="false">${icon('table')}CSV</button>
      </div>
      <fieldset class="alcance"><legend>Alcance</legend>
        <label><input type="radio" name="alcance" value="filtrados" ${alcance === 'filtrados' ? 'checked' : ''}>Filtrados (${filtrados.length})</label>
        <label><input type="radio" name="alcance" value="completo" ${alcance === 'completo' ? 'checked' : ''}>Todo (${S.items.length})</label>
      </fieldset>
    </div>
    <label for="expPreview" class="sr-only">Vista previa</label>
    <textarea id="expPreview" class="preview" readonly spellcheck="false"></textarea>
    <div class="exp-meta"><span id="expArchivo"></span><span id="expTam"></span></div>`;
  const m = Modales.abrir({
    titulo: 'Exportar catálogo', icono: 'download', tamano: 'lg', cuerpo,
    pie: `<button type="button" class="btn btn-secondary" data-m="copiar">${icon('copy')}Copiar</button><button type="button" class="btn btn-primary" data-m="descargar">${icon('download')}Descargar</button>`
  });
  let contenido = '';
  const actualizar = () => {
    const lista = alcance === 'filtrados' ? filtrados : S.items;
    contenido = Exportar[formato](lista);
    m.el.querySelector('#expPreview').value = contenido;
    m.el.querySelector('#expArchivo').innerHTML = `${icon('file-text')} ${esc(ARCHIVOS_EXPORT[formato])} · ${plural(lista.length, 'enlace', 'enlaces')}${formato === 'csv' ? ' · UTF-8 con BOM' : ''}`;
    m.el.querySelector('#expTam').textContent = `${(new Blob([contenido]).size / 1024).toFixed(1)} KB`;
    $$('[data-fmt]', m.el).forEach(b => { const on = b.dataset.fmt === formato; b.setAttribute('aria-selected', String(on)); b.setAttribute('aria-pressed', String(on)); });
  };
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-fmt],[data-m]');
    if (!b) return;
    if (b.dataset.fmt) { formato = b.dataset.fmt; actualizar(); return; }
    if (b.dataset.m === 'copiar') copiarTexto(contenido).then(() => toast('Copiado', 'success')).catch(() => toast('No se pudo copiar', 'error'));
    if (b.dataset.m === 'descargar') {
      descargarArchivo(ARCHIVOS_EXPORT[formato], (formato === 'csv' ? '﻿' : '') + contenido, MIME_EXPORT[formato]);
      toast('Descargando…', 'success');
    }
  });
  m.el.addEventListener('change', (e) => { if (e.target.name === 'alcance') { alcance = e.target.value; actualizar(); } });
  actualizar();
}

/* ============ 20. Reporte para imprimir / PDF ============ */
function describirFiltros() {
  const f = S.filtros, d = [];
  if (f.q.trim()) d.push(`Búsqueda: «${f.q.trim()}»`);
  if (f.seccion !== 'todo') d.push(`Sección: ${(S.secMap.get(f.seccion) || {}).nombre || f.seccion}`);
  if (f.cat !== 'todos') d.push(`Categoría: ${(S.catMap.get(f.cat) || {}).nombre || f.cat}`);
  if (f.estado !== 'todos') d.push(`Estado: ${(ESTADO_MAP[f.estado] || {}).etiqueta}`);
  if (f.tag) d.push(`Etiqueta: ${f.tag}`);
  if (f.soloMios) d.push('Solo mis enlaces');
  if (f.soloFavs) d.push('Solo favoritos');
  return d.length ? d.join(' · ') : 'Sin filtros (catálogo completo)';
}
function construirReporte() {
  const items = ordenCanonico(resultadosFiltrados());
  const porEstado = {};
  items.forEach(i => { porEstado[i.estado] = (porEstado[i.estado] || 0) + 1; });
  let html = `<div class="pr-cab"><h1>${esc(TITULO_APP)}</h1><div class="pr-sub">${esc(NOMBRE_APP)}</div>
    <div class="pr-meta"><span><strong>Fecha:</strong> ${esc(fechaLarga(new Date().toISOString()))}</span><span><strong>Generado por:</strong> ${esc(generadoPor())}</span><span><strong>Filtros:</strong> ${esc(describirFiltros())}</span></div></div>
    <div class="pr-resumen"><div><strong>${items.length}</strong>Enlaces</div>${ESTADOS.map(e => `<div><strong>${porEstado[e.id] || 0}</strong>${esc(e.etiqueta)}</div>`).join('')}<div><strong>${new Set(items.map(i => i.creadoPor)).size}</strong>Contribuidores</div></div>`;
  const tabla = (its) => `<table class="pr-tabla"><thead><tr><th style="width:34%">Herramienta</th><th>Estado</th><th>Tecnologías</th><th>Etiquetas</th><th>Subido por</th><th>Fecha</th><th style="width:18%">URL</th></tr></thead><tbody>
    ${its.map(i => `<tr><td><div class="pr-nom">${esc(i.nombre)}</div><div class="pr-desc">${esc(i.descripcion)}</div></td><td>${esc((ESTADO_MAP[i.estado] || {}).etiqueta)}</td><td>${esc(i.tecnologias.join(', '))}</td><td>${esc(i.tags.join(' '))}</td><td>${esc(i.creadoPorNombre)}</td><td>${esc(fechaCorta(i.fechaCreacion))}</td><td class="pr-url">${esc(urlSegura(i.url) || 'URL pendiente')}</td></tr>`).join('')}</tbody></table>`;
  S.secciones.forEach(sec => {
    const cats = S.categorias.filter(c => c.seccion === sec.id).map(c => ({ c, its: items.filter(i => i.categoriaId === c.id) })).filter(g => g.its.length);
    if (!cats.length) return;
    html += `<div class="pr-seccion">${esc(sec.nombre)}</div>`;
    cats.forEach(g => { html += `<div class="pr-cat"><span class="dot" style="background:${g.c.color}"></span>${esc(g.c.nombre)} (${g.its.length})</div>${tabla(g.its)}`; });
  });
  const huerfanos = items.filter(i => !S.catMap.has(i.categoriaId));
  if (huerfanos.length) html += `<div class="pr-cat">Sin categoría (${huerfanos.length})</div>${tabla(huerfanos)}`;
  if (!items.length) html += '<p>No hay enlaces con los filtros actuales.</p>';
  html += `<div class="pr-pie">Directorio Space 1.0 · PTM Banxico · v${esc(S.config.version || APP_VERSION)} · Documento de uso interno</div>`;
  $('#printReport').innerHTML = html;
  return items.length;
}
function imprimir() {
  if (!S.cargado) { toast('Cargando…', 'info'); return; }
  construirReporte();
  try { window.print(); } catch (e) { toast('No se pudo imprimir', 'error'); }
}

      conCarga(b, true, 'Restaurando…');

    }

      return confirmar({ titulo: '¿Eliminar para siempre?', peligro: true, icono: 'trash', textoConfirmar: 'Eliminar para siempre', textoCarga: 'Eliminando…',
        mensajeHtml: `<strong>«${esc(it ? it.nombre : b.dataset.id)}»</strong> no se podrá recuperar.`,

          ${r.errores && r.errores.length ? `<ul>${r.errores.slice(0, 50).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</span></div>`;
        toast(`Importados: ${r.creados} nuevos, ${r.actualizados} actualizados`, 'success');

      return;

      toast('Respaldo descargado', 'success');
      return;
    }
    if (a === 'reiniciar') {
      return confirmar({ titulo: '¿Restablecer datos demo?', peligro: true, textoConfirmar: 'Restablecer', mensaje: 'Se borrarán los cambios locales.',
        accion: async () => { Api.reiniciarDemo(); await trasCambio(); toast('Datos demo restablecidos', 'success'); } });

    const btn = f.querySelector('[type="submit"]');

  });
  /* Importación: archivo elegido o arrastrado a la zona de carga */
  function leerArchivoImport(file) {
    if (!file) return;
    if (!/\.json$/i.test(file.name || '') && !/json/i.test(file.type || '')) { toast('Selecciona un archivo .json', 'error'); return; }
    const lector = new FileReader();
    lector.onload = () => {
      if (!body.querySelector('#admJson')) return;   // el usuario cambió de pestaña mientras se leía
      body.querySelector('#admJson').value = String(lector.result || '');
      body.querySelector('#admArchivo').textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
      try { const n = leerJsonImport().length; body.querySelector('#admJsonInfo').textContent = `${plural(n, 'enlace detectado', 'enlaces detectados')}. Revisa y pulsa Importar.`; }
      catch (ex) { body.querySelector('#admJsonInfo').textContent = ex.message; }
    };
    lector.onerror = () => toast('No se pudo leer el archivo.', 'error');
    lector.readAsText(file, 'utf-8');
  }
  m.el.addEventListener('change', (e) => {
    if (e.target.dataset.a !== 'archivo' || !e.target.files || !e.target.files[0]) return;
    leerArchivoImport(e.target.files[0]);
    e.target.value = '';
  });
  m.el.addEventListener('dragover', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');
    if (!dz) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    dz.classList.add('is-over');
  });
  m.el.addEventListener('dragleave', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');
    if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('is-over');
  });
  m.el.addEventListener('drop', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove('is-over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) leerArchivoImport(file); else toast('Arrastra un archivo .json', 'info');
  });
  pintarTabs();
  cargar();
}

    pie: `${mios.length ? `<button type="button" class="btn btn-secondary" data-m="mios">${icon('filter')}Ver mis enlaces</button>` : ''}<button type="button" class="btn btn-secondary" data-cerrar>Cerrar</button>`
  });

function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
}
function alternarTema() {
  const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  aplicarTema(nuevo);
  Almacen.set(CLAVES.TEMA, nuevo);
  render();
  toast(nuevo === 'dark' ? 'Tema oscuro' : 'Tema claro', 'info');
}
function cambiarVista(v) {
  S.vista = v === 'tabla' ? 'tabla' : 'tarjetas';
  Almacen.set(CLAVES.VISTA, S.vista);
  renderTopbar();
  renderDirectorio();
}
/** Aplica cambios de filtro; con limpiar=true parte de filtros vacíos. */
function aplicarFiltro(cambios, { limpiar = false, desplazar = true } = {}) {
  const qAntes = S.filtros.q;
  if (limpiar) S.filtros = { q: '', seccion: 'todo', cat: 'todos', estado: 'todos', soloMios: false, soloFavs: false, tag: '' };
  Object.assign(S.filtros, cambios);
  if ('q' in cambios || limpiar) { $('#q').value = S.filtros.q; ajustarOrdenPorBusqueda(qAntes); }
  renderDirectorio();
  if (desplazar) desplazarAResultados();
}
function ajustarOrdenPorBusqueda(qAntes) {
  const antes = terminos(qAntes).length > 0, ahora = terminos(S.filtros.q).length > 0;
  if (!antes && ahora && !S.ordenManual) S.orden = 'relevancia';
  if (!ahora && S.orden === 'relevancia') { S.orden = 'recientes'; S.ordenManual = false; }
}
function limpiarFiltros() {
  S.orden = 'recientes'; S.ordenManual = false; S.tablaOrden = null;
  aplicarFiltro({}, { limpiar: true, desplazar: false });
}
function desplazarAResultados() {
  const dock = $('#searchDock');
  const res = $('#resultados');
  if (!res || !dock) return;
  const top = res.getBoundingClientRect().top;
  const alto = dock.getBoundingClientRect().height + 16;
  if (top < alto || top > window.innerHeight * 0.75) {
    window.scrollTo({ top: Math.max(0, window.scrollY + top - alto - 120), behavior: reducirMovimiento() ? 'auto' : 'smooth' });
  }
}
function nuevoEnlace(categoriaId = '') {
  if (!puedeEscribir()) { toast('Solo consulta', 'info'); return; }
  abrirFormulario(null, { categoriaId });
}
function enfocarBusqueda() { const q = $('#q'); q.focus(); q.select(); }
