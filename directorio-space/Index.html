<script>
  /* Tema temprano (evita parpadeo). Acceso a localStorage protegido: el iframe de GAS puede bloquearlo. */
  (function () {
    var t = null;
    try { t = window.localStorage.getItem('space10.tema'); } catch (e) { t = null; }
    if (t !== 'light' && t !== 'dark') {
      try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; }
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;

}
body.con-modal { overflow: hidden; }
#app { overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled, [aria-disabled="true"] { cursor: not-allowed; }
a { color: var(--link); text-decoration: none; }

img, svg { display: block; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: rgba(45, 204, 205, .35); }
mark { background: var(--mark-bg); color: var(--mark-text); border-radius: 3px; padding: 0 1px; }
kbd {
  font-family: var(--font); font-size: 11px; font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--text-3);
}
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 300; background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); }
.skip:focus { top: 12px; }
svg.i { display: inline-block; vertical-align: -.15em; width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.wrap { width: 100%; max-width: 1344px; margin: 0 auto; padding: 0 32px; }
.muted { color: var(--text-3); }
.mono { font-family: var(--mono); font-size: .92em; }
.spin {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  border: 2px solid currentColor; border-right-color: transparent; animation: girar .7s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes brillo { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@keyframes pulso { 0% { transform: scale(1); opacity: .6; } 80%, 100% { transform: scale(2.6); opacity: 0; } }

}

.switch { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 8px; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; text-align: left; }

/* Tooltip ligero */

[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--tip-bg); color: #fff; font-size: 12px; font-weight: 500; line-height: 1.35; padding: 5px 8px; border-radius: 6px;

.um-cab .nombre { font-weight: 700; font-size: 14px; }

.um-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--text); text-align: left; white-space: nowrap; }
.um-item .i { font-size: 16px; color: var(--text-3); }
.um-item:hover, .um-item:focus-visible { background: var(--surface-3); outline: none; text-decoration: none; }
.um-item .derecha { margin-left: auto; display: inline-flex; gap: 4px; color: var(--text-3); font-size: 12px; }
.um-item.peligro { color: var(--danger-text); }
.um-item.peligro .i { color: currentColor; }
.um-item.on .i { color: var(--star); fill: currentColor; }
.um-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.um-nota { display: flex; align-items: center; gap: 6px; padding: 4px 10px 6px; font-size: 11.5px; color: var(--warn-text); }
.um-nota .i { font-size: 13px; }
.solo-movil { display: none !important; }

/* Aviso de error de sincronización: línea delgada */
.banners:empty { display: none; }
.banner-error { background: var(--danger-bg); color: var(--danger-text); font-size: 12.5px; border-bottom: 1px solid rgba(220, 38, 38, .2); }
.banner-error .wrap { display: flex; align-items: center; gap: 8px; height: 32px; }
.banner-error .i { font-size: 14px; }
.banner-btn { font-weight: 700; color: inherit; text-decoration: underline; text-underline-offset: 2px; padding: 2px 4px; border-radius: 4px; }

/* =====================================================================
   5. BUSCADOR (protagonista) Y CIFRAS
   ===================================================================== */
.main { flex: 1; padding-top: 20px; padding-bottom: 64px; }
#stickySentinel { height: 1px; margin-bottom: -1px; }
.search-dock { position: sticky; top: 0; z-index: 40; padding: 6px 0; }
.search-dock::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); z-index: -1;
  background: var(--bg); opacity: 0; transition: opacity .2s; border-bottom: 1px solid var(--border);
}
.search-dock.fijo::before { opacity: 1; box-shadow: 0 6px 16px -12px rgba(15, 23, 42, .25); }
.search-box { position: relative; max-width: 720px; margin: 0 auto; }
.search-card {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 10px 0 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border-2); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
}
.search-card:focus-within { border-color: var(--focus); box-shadow: var(--shadow), var(--ring); }
.search-card > .i { font-size: 19px; color: var(--text-3); }
.search-card input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 15.5px; font-weight: 500; color: var(--text); }
.search-card input::placeholder { color: var(--text-3); font-weight: 400; }
.search-card input::-webkit-search-cancel-button { display: none; }
.q-count { font-size: 12.5px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.q-count strong { color: var(--text); font-weight: 700; }
.q-clear { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--text-3); }
.q-clear:hover { background: var(--surface-3); color: var(--text); }
.q-clear .i { font-size: 16px; }
.kbd-hint { display: inline-flex; padding: 0 4px; }
.sugerencias {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 45; padding: 12px 14px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: aparecer .12s ease;
}
.sug-lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 0 0 8px; }
.sug-lbl + .chips { margin-bottom: 12px; }
.sugerencias .chips:last-child { margin-bottom: 0; }
.sug-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.sug-chip:hover, .sug-chip:focus-visible { border-color: var(--sky); color: var(--sky); }
[data-theme="dark"] .sug-chip:hover, [data-theme="dark"] .sug-chip:focus-visible { border-color: var(--aqua); color: var(--aqua); }
.sug-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.cifras { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 2px 2px; margin-top: 10px; min-height: 26px; font-size: 13px; color: var(--text-3); }
.cifra { padding: 2px 7px; border-radius: 6px; color: var(--text-3); white-space: nowrap; transition: background-color .15s, color .15s; }
.cifra b { color: var(--text-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.cifra:hover { background: var(--surface-3); color: var(--text); }
.cifra[aria-pressed="true"] { background: var(--info-bg); color: var(--info-text); }
.cifra[aria-pressed="true"] b { color: inherit; }
.cifra-sep { color: var(--border-2); }

/* =====================================================================
   6. NAVEGACIÓN Y FILTROS (una fila)
   ===================================================================== */
.nav-row { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
.seg-nav .tab { height: 30px; padding: 0 16px; }
.filtros-wrap { position: relative; }
.btn-filtros {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 500;
  color: var(--text-2); border: 1px solid var(--border); background: var(--surface); transition: border-color .15s, color .15s;
}
.btn-filtros .i { font-size: 15px; }
.btn-filtros:hover, .btn-filtros[aria-expanded="true"] { border-color: var(--border-2); color: var(--text); }
.btn-filtros .cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary-bg); color: var(--primary-text); font-size: 11px; font-weight: 700; }
.filtros-pop {
  position: absolute; left: 0; top: calc(100% + 8px); z-index: 46; width: 392px; padding: 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: aparecer .12s ease;
}
.fp-grupo + .fp-grupo { margin-top: 14px; }
.fp-lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.fp-grupo .seg { display: flex; }
.fp-grupo .seg button { flex: 1 1 auto; padding: 0 8px; font-size: 12.5px; }
.fp-switches { margin-left: -8px; margin-right: -8px; }
.fp-grupo .select-wrap, .fp-grupo .select-wrap select { width: 100%; }
.pills { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.pills::-webkit-scrollbar { display: none; }
.pills.desborda { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; white-space: nowrap; flex: none;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 12.5px; font-weight: 500;
  transition: border-color .15s, background-color .15s, color .15s;
}
.pill:hover { border-color: var(--border-2); color: var(--text); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--text-3)); flex: none; }
.pill .n { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.pill.cero { opacity: .6; }
.pill[aria-pressed="true"] { background: var(--c-soft, var(--surface-3)); border-color: var(--c, var(--text-2)); color: var(--text); font-weight: 600; opacity: 1; }
.pill.todos[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.pill.todos[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chips-activos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.chips-activos:empty { display: none; }
.chip-f {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; max-width: 100%; padding: 0 4px 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  background: var(--info-bg); color: var(--info-text);
}
.chip-f .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-f button { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: inherit; flex: none; }
.chip-f button:hover { background: rgba(2, 132, 199, .16); }
.chip-f button .i { font-size: 12px; }
.limpiar { font-size: 12.5px; font-weight: 600; color: var(--text-3); padding: 4px 8px; border-radius: 6px; }
.limpiar:hover { color: var(--danger-text); background: var(--danger-bg); }

/* =====================================================================
   7. FIJADOS (acceso rápido)
   ===================================================================== */
.fijados { margin-top: 24px; }
.fj-cab { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 8px; }
.fj-cab h2 { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-3); }
.fj-cab h2 .i { color: var(--star); fill: currentColor; font-size: 13px; }
.fj-nav { margin-left: auto; display: flex; gap: 4px; }
.nav-btn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--text-3); transition: background-color .15s, color .15s, opacity .15s; }
.nav-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.nav-btn:disabled { opacity: .35; }
.nav-btn .i { font-size: 15px; }
.fj-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; padding: 2px; margin: -2px; }
.fj-track::-webkit-scrollbar { display: none; }
.wr-tile {
  position: relative; flex: 0 0 244px; display: flex; align-items: center; height: 48px; scroll-snap-align: start; min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-xs);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.wr-tile:hover { border-color: var(--border-2); box-shadow: var(--shadow); transform: translateY(-1px); }
.wr-link { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 100%; padding: 0 14px 0 10px; color: var(--text); text-align: left; border-radius: 10px; }
.wr-link:hover { text-decoration: none; }
.wr-nom { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wr-link .estado-dot { margin-left: 2px; }
.wr-star { position: absolute; right: 6px; top: 50%; margin-top: -13px; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--text-3); background: var(--surface); opacity: 0; transition: opacity .15s, background-color .15s; }
.wr-star .i { font-size: 14px; }
.wr-tile:hover .wr-star, .wr-star:focus-visible, .wr-star.on { opacity: 1; }
.wr-star:hover { background: var(--surface-3); }
.wr-tile.fav .wr-link { padding-right: 38px; }

/* =====================================================================
   8. RESULTADOS: MOSAICOS
   ===================================================================== */
.resultados { margin-top: 26px; outline: none; }
.sec-label { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
.sec-label:first-child { margin-top: 0; }
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.grupos { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 22px 16px; align-items: start; }
.grupo { grid-column: span var(--span, 1); min-width: 0; }
.grupo-cab { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 8px; min-width: 0; }
.grupo-cab .gi { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--c-soft); color: var(--c-fg, var(--c)); flex: none; }
.grupo-cab .gi .i { font-size: 12px; }
.grupo-cab h4 { font-size: 13px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.grupo-cab .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
.grupo-cab .add { margin-left: auto; opacity: 0; transition: opacity .15s; flex: none; }
.grupo:hover .grupo-cab .add, .grupo-cab .add:focus-visible { opacity: 1; }
.tiles { display: grid; grid-template-columns: repeat(var(--span, 1), minmax(0, 1fr)); gap: 16px; }
.tiles-flat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(264px, 100%), 1fr)); gap: 16px; }
.tile {
  position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) 28px; grid-template-rows: auto auto 1fr; column-gap: 12px;
  height: 100px; padding: 14px 10px 12px 14px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-xs); transition: transform .16s ease, box-shadow .16s ease, border-color .16s; animation: aparecer .2s ease both;
}
.tile.con-desc { height: 122px; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-2); }
.tile.destello { animation: destello 1.6s ease; }
.tile > .cat-ico { grid-row: 1 / span 3; }
.t-nombre { grid-column: 2; grid-row: 1; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; min-width: 0; }
.t-nombre button { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; text-align: left; color: var(--text); }
.t-nombre button::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius); }
.t-nombre button:focus-visible { outline: none; }
.t-nombre button:focus-visible::after { outline: 2px solid var(--focus); outline-offset: 2px; }
.tile:hover .t-nombre button { color: var(--link); }
.t-desc { grid-column: 2; grid-row: 2; margin-top: 3px; font-size: 13px; line-height: 1.45; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-meta { grid-column: 2; grid-row: 3; align-self: end; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); min-width: 0; white-space: nowrap; }
.t-meta .t-autor { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-meta time { flex: none; }
.t-side { grid-column: 3; grid-row: 1 / span 3; position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; margin: -5px 0 -4px; }
.t-open, .t-sinurl { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; flex: none; }
.t-open { color: var(--primary-bg); background: var(--info-bg); transition: background-color .15s, color .15s; }
[data-theme="dark"] .t-open { color: var(--aqua); background: rgba(45, 204, 205, .12); }
.t-open:hover { background: var(--primary-bg); color: var(--primary-text); text-decoration: none; }
.t-open .i, .t-sinurl .i { font-size: 15px; }
.t-sinurl { color: var(--text-3); opacity: .45; cursor: default; }

/* Vacíos, error y esqueletos (una línea + un botón) */
.vacio { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 28px 20px; border: 1px dashed var(--border-2); border-radius: 12px; background: var(--surface); text-align: center; }
.vac-ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--c-soft, var(--surface-3)); color: var(--c-fg, var(--text-3)); flex: none; }
.vac-ico .i { font-size: 18px; }
.vac-txt { font-size: 14px; font-weight: 600; color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
.sk { background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%); background-size: 400% 100%; animation: brillo 1.4s ease infinite; border-radius: 6px; }
.sk-tile { display: grid; grid-template-columns: 36px 1fr; gap: 10px 12px; height: 100px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

/* =====================================================================
   9. RESULTADOS: LISTA (tabla)
   ===================================================================== */
.tabla-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-xs); overflow-x: auto; scrollbar-width: thin; }
.tabla { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tabla th {
  text-align: left; padding: 0 10px; height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.tabla th:first-child { border-top-left-radius: 12px; padding-left: 16px; }
.tabla th:last-child { border-top-right-radius: 12px; }
.tabla th .th-btn { display: inline-flex; align-items: center; gap: 4px; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; height: 26px; padding: 0 4px; margin: 0 -4px; border-radius: 6px; }
.tabla th .th-btn:hover { color: var(--text); background: var(--surface-3); }
.tabla th .th-btn .i { font-size: 12px; opacity: .4; }
.tabla th[aria-sort] .th-btn { color: var(--text); }
.tabla th[aria-sort] .th-btn .i { opacity: 1; color: var(--sky); }
.tabla td { height: 50px; padding: 0 10px; border-bottom: 1px solid var(--border); vertical-align: middle; background: var(--surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.tabla td:first-child { padding-left: 16px; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tbody tr:hover td { background: var(--surface-2); }
.tabla tr.destello td { animation: destello 1.6s ease; }
.t-nom { display: flex; align-items: center; gap: 10px; min-width: 0; }
.t-nom .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-weight: 600; font-size: 13.5px; color: var(--text); }
.t-nom .nm:hover { color: var(--link); }
.t-est { margin-left: 7px; }
.c-acc .t-acc2 { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }

/* =====================================================================
   10. MODALES
   ===================================================================== */
.modal-capa {
  position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 24px; background: var(--scrim);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); animation: fundido .16s ease;
}
.modal-capa.saliendo { animation: fundido .14s ease reverse forwards; }
@keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
@keyframes emerger { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal {
  position: relative; display: flex; flex-direction: column; width: min(100%, var(--w, 620px)); min-width: 0; max-height: calc(100vh - 48px);
  background: var(--surface); color: var(--text); border-radius: 16px; box-shadow: var(--shadow-xl); border: 1px solid var(--border); overflow: hidden; overflow: clip;
  animation: emerger .2s cubic-bezier(.2, .8, .2, 1);
}
.modal.sm { --w: 440px; } .modal.md { --w: 620px; } .modal.lg { --w: 800px; } .modal.xl { --w: 1080px; }
.modal.admin { height: min(86vh, 820px); }
.modal-cab { display: flex; align-items: center; gap: 14px; padding: 18px 16px 14px 22px; }
.modal-cab .m-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--c-soft, var(--info-bg)); color: var(--c-fg, var(--c, var(--info-text))); flex: none; }
.modal-cab .m-ico .i { font-size: 20px; }
.modal-cab .m-tit { min-width: 0; flex: 1; padding-top: 1px; }
.modal-cab h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
.modal-cab .m-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.modal-cuerpo { padding: 4px 22px 20px; overflow: auto; flex: 1; overscroll-behavior: contain; }
.modal-pie { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
.modal-pie .nota { margin-right: auto; font-size: 12.5px; color: var(--text-3); min-width: 0; flex: 1 1 200px; }
.modal-pie .nota strong { color: var(--text-2); }
.alerta { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 9px; font-size: 13px; line-height: 1.45; }
.alerta .i { font-size: 15px; margin-top: 2px; }
.alerta-info { background: var(--info-bg); color: var(--info-text); }
.alerta-warn { background: var(--warn-bg); color: var(--warn-text); }
.alerta-error { background: var(--danger-bg); color: var(--danger-text); }
.alerta-ok { background: var(--ok-bg); color: var(--ok-text); }
.alerta button.link-mini { color: inherit; text-decoration: underline; padding: 0; font-weight: 600; }
.alerta + .form-grid, .alerta + .alerta { margin-top: 12px; }
.confirm-txt { font-size: 14px; color: var(--text-2); line-height: 1.6; overflow-wrap: anywhere; }
.confirm-txt strong { color: var(--text); }

/* Ficha */
.f-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.f-sub .sep { opacity: .6; }
.f-acc { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.btn-abrir { height: 40px; padding: 0 22px; font-size: 14px; }
.f-iconos { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.f-div { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
.ficha-desc { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.f-datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--border); }
.f-datos > div { min-width: 0; }
.f-datos > .ancho { grid-column: 1 / -1; }
.f-datos dt { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.f-datos dd { margin: 0; font-size: 13.5px; color: var(--text); overflow-wrap: anywhere; }
.f-visitas { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 16px; font-size: 12px; color: var(--text-3); }
.f-visitas .i { font-size: 13px; }

/* Formulario */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo.span-2 { grid-column: 1 / -1; }
.campo > label, .campo .lbl { font-size: 12.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
.campo .req { color: var(--danger); }
.campo .opc { font-weight: 400; color: var(--text-3); }
.campo .err { font-size: 12px; color: var(--danger-text); display: flex; gap: 5px; align-items: center; }
.campo .err:empty { display: none; }
.campo .err .i { font-size: 13px; }
.campo .fila-ayuda { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.contador { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.contador.largo { color: var(--warn-text); font-weight: 600; }
.contador.mal { color: var(--danger-text); font-weight: 600; }
fieldset.campo { border: 0; padding: 0; margin: 0; }
fieldset.campo legend { padding: 0; margin-bottom: 6px; }
.seg-radio { display: flex; }
.seg-radio label { flex: 1; position: relative; }
.mas-opciones { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 6px 8px; margin-left: -8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.mas-opciones:hover { background: var(--surface-3); color: var(--text); }
.mas-opciones .i { font-size: 15px; transition: transform .15s; }
.mas-opciones[aria-expanded="true"] .i { transform: rotate(180deg); }
.mas-panel { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
.check-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-card { position: relative; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border-2); border-radius: 10px; cursor: pointer; background: var(--surface); transition: border-color .15s, background-color .15s; }
.check-card:hover { border-color: var(--text-3); }
.check-card input { position: absolute; opacity: 0; pointer-events: none; }
.check-card .switch-v { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--border-2); flex: none; transition: background-color .18s; }
.check-card .switch-v::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .18s; }
.check-card:has(input:checked) { border-color: var(--primary-bg); background: var(--info-bg); }
.check-card:has(input:checked) .switch-v { background: var(--primary-bg); }
.check-card:has(input:checked) .switch-v::after { transform: translateX(12px); }
.check-card:has(input:focus-visible) { box-shadow: var(--ring); }
.check-card .ck-t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.check-card .ck-t .i { font-size: 14px; color: var(--text-3); }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-sel { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--text-2); transition: background-color .15s, color .15s, border-color .15s; }
.chip-sel:hover { border-color: var(--text-3); color: var(--text); }
.chip-sel[aria-pressed="true"] { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-text); }
.chip-sel .i { font-size: 12px; }
.chip-sel.libre { padding-right: 6px; }
.tec-libre { display: flex; gap: 8px; margin-top: 8px; }
.tec-libre input { flex: 1; }
.tags-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 0; }
.tags-fila:has(.tags-prev:empty):has(.sugeridas:empty) { display: none; }
.tags-prev { display: contents; }
.tags-prev .tag { height: 22px; font-size: 11.5px; }
.sugeridas { display: contents; }
.chip-sug { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; border: 1px dashed var(--border-2); background: var(--surface); font-size: 11.5px; font-weight: 500; color: var(--text-3); transition: border-color .15s, color .15s; }
.chip-sug:hover { border-style: solid; border-color: var(--sky); color: var(--sky); }
[data-theme="dark"] .chip-sug:hover { border-color: var(--aqua); color: var(--aqua); }
.chip-sug .i { font-size: 11px; }
.aviso-tags { font-size: 12px; color: var(--warn-text); width: 100%; }
.dup-aviso { margin-top: 2px; }

/* Panel de administración */
.adm-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -4px -22px 18px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.adm-tabs::-webkit-scrollbar { display: none; }
.adm-tab { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.adm-tab .i { font-size: 15px; }
.adm-tab:hover { color: var(--text); }
.adm-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--navy-700); }
[data-theme="dark"] .adm-tab[aria-selected="true"] { border-bottom-color: var(--aqua); }
.adm-tab .cnt { font-size: 11px; padding: 0 6px; height: 18px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-3); color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.stat .s-l { font-size: 12px; color: var(--text-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .s-l .i { font-size: 14px; }
.stat .s-v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.adm-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 16px; }
.panel { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); min-width: 0; }
.panel + .panel { margin-top: 16px; }
.panel h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.panel h3 .i { font-size: 15px; color: var(--text-3); }
.panel h3 .link-mini { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--link); }
.barras { display: grid; gap: 8px; }
.barra { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 12.5px; }
.barra .b-l { display: flex; align-items: center; gap: 7px; color: var(--text-2); min-width: 0; }
.barra .b-l .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.barra .b-l .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.barra .b-t { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.barra .b-t > span { display: block; height: 100%; border-radius: inherit; background: var(--c); }
.barra .b-v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.top-lista { display: grid; gap: 10px; }
.top-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.top-item .avatar { width: 28px; height: 28px; font-size: 11px; }
.top-item .ti { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-item .tv { font-weight: 700; font-variant-numeric: tabular-nums; }
.adm-barra { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.adm-barra .campo { flex: 1 1 240px; }
.adm-barra .derecha { margin-left: auto; }
.t-simple { width: 100%; border-collapse: collapse; font-size: 13px; }
.t-simple th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); position: sticky; top: -4px; z-index: 1; }
.t-simple td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.t-simple tr:last-child td { border-bottom: 0; }
.t-simple tr:hover td { background: var(--surface-2); }
.t-num { text-align: right; font-variant-numeric: tabular-nums; }
.t-simple th.t-num { text-align: right; }
.t-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
.t-autor { display: flex; align-items: center; gap: 9px; line-height: 1.35; min-width: 0; }
.t-autor .avatar { width: 26px; height: 26px; font-size: 10px; }
.t-acc { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.t-fecha { white-space: nowrap; color: var(--text-2); }
.t-fecha .rel { display: block; font-size: 11.5px; color: var(--text-3); }
.t-cat { display: flex; align-items: center; gap: 7px; color: var(--text-2); }
.t-cat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.accion-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.ab-CREAR { background: var(--ok-bg); color: var(--ok-text); }
.ab-EDITAR, .ab-PERFIL { background: var(--info-bg); color: var(--info-text); }
.ab-ELIMINAR, .ab-PURGAR, .ab-CATEGORIA_ELIMINAR { background: var(--danger-bg); color: var(--danger-text); }
.ab-RESTAURAR, .ab-IMPORTAR, .ab-SEMILLA { background: rgba(45, 204, 205, .16); color: var(--aqua-700); }
[data-theme="dark"] .ab-RESTAURAR, [data-theme="dark"] .ab-IMPORTAR, [data-theme="dark"] .ab-SEMILLA { color: var(--aqua); }
.ab-ROL, .ab-FIJAR, .ab-CATEGORIA { background: var(--warn-bg); color: var(--warn-text); }
.estado-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
.cat-fila-ico { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--c-soft); color: var(--c-fg, var(--c)); flex: none; }
.cat-fila-ico .i { font-size: 15px; }
.icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.icon-picker button { display: grid; place-items: center; height: 38px; border-radius: 9px; border: 1px solid var(--border); color: var(--text-2); background: var(--surface); }
.icon-picker button .i { font-size: 17px; }
.icon-picker button:hover { border-color: var(--text-3); color: var(--text); }
.icon-picker button[aria-pressed="true"] { border-color: var(--c, var(--primary-bg)); background: var(--c-soft, var(--info-bg)); color: var(--c-fg, var(--c, var(--text))); box-shadow: inset 0 0 0 1px var(--c, var(--primary-bg)); }
.color-fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.color-fila input[type="color"] { width: 44px; height: 40px; padding: 3px; border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface); cursor: pointer; }
.color-fila input[type="text"] { width: 110px !important; font-family: var(--mono); }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-2); }
.datos-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.datos-grid textarea { width: 100%; min-height: 140px; font-family: var(--mono); font-size: 12px; }
.res-import { margin-top: 12px; }
.res-import ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; max-height: 160px; overflow: auto; }
.dropzone { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1.5px dashed var(--border-2); border-radius: 12px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background-color .15s; }
.dropzone:hover { border-color: var(--text-3); }
.dropzone:focus-within { border-color: var(--focus); box-shadow: var(--ring); }
.dropzone.is-over { border-color: var(--sky); border-style: solid; background: var(--info-bg); }
.dropzone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.dropzone .dz-ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--info-bg); color: var(--info-text); flex: none; }
.dropzone .dz-ico .i { font-size: 18px; }
.dropzone .dz-t { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
.dropzone .dz-d { font-size: 12px; color: var(--text-3); display: block; overflow-wrap: anywhere; }
.dropzone .dz-d:empty { display: none; }
.cargando-bloque { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px; color: var(--text-3); }

/* Exportación */
.exp-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.alcance { display: flex; gap: 8px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
.alcance legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.alcance label { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border: 1px solid var(--border-2); border-radius: 9px; font-size: 13px; cursor: pointer; }
.alcance label:has(input:checked) { border-color: var(--primary-bg); background: var(--info-bg); color: var(--info-text); font-weight: 600; }
.alcance input { accent-color: var(--primary-bg); }
.preview { width: 100%; height: 300px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.5; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); white-space: pre; }
.exp-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* Atajos, identidad, contribuidores, perfil */
.atajos { display: grid; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.atajo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.atajo:last-child { border-bottom: 0; }
.atajo .ks { display: inline-flex; gap: 4px; align-items: center; color: var(--text-3); font-size: 12px; }
.ident-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ident { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border-2); border-radius: 12px; text-align: left; transition: border-color .15s, background-color .15s; background: var(--surface); min-width: 0; }
.ident:hover { border-color: var(--text-3); }
.ident[aria-pressed="true"] { border-color: var(--primary-bg); background: var(--info-bg); box-shadow: inset 0 0 0 1px var(--primary-bg); }
.ident .avatar { width: 34px; height: 34px; font-size: 12px; }
.ident .it { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ident .ie { display: block; font-size: 12px; color: var(--text-3); }
.contrib { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border-radius: 10px; text-align: left; }
.contrib:hover { background: var(--surface-3); }
.contrib .avatar { width: 32px; height: 32px; font-size: 12px; }
.contrib .ci { flex: 1; min-width: 0; }
.contrib .ci .e { font-size: 12px; color: var(--text-3); }
.contrib .cv { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.perfil-cab { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.perfil-cab .avatar { width: 52px; height: 52px; font-size: 18px; }
.perfil-cab .pn { font-size: 17px; font-weight: 700; }
.perfil-cab .pe { font-size: 13px; color: var(--text-3); }
.perfil-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

/* =====================================================================
   11. TOASTS
   ===================================================================== */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  position: relative; overflow: hidden; pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 220px; max-width: min(400px, calc(100vw - 32px)); padding: 10px 8px 10px 14px;
  border-radius: 10px; background: #0B1A30; color: #fff; box-shadow: var(--shadow-xl); font-size: 13.5px; line-height: 1.4;
  animation: entrarToast .22s cubic-bezier(.2, .8, .2, 1);
}
[data-theme="dark"] .toast { background: #1A2A44; }
.toast .i { font-size: 16px; }
.toast-success > .i { color: #4ADE80; }
.toast-error > .i { color: #F87171; }
.toast-info > .i { color: var(--aqua); }
.toast .t-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--aqua); opacity: .7; transform-origin: left; animation: barraToast linear forwards; }
.toast-success .t-bar { background: #4ADE80; } .toast-error .t-bar { background: #F87171; }
@keyframes barraToast { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.toast .t-msg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .t-x { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: rgba(255, 255, 255, .55); }
.toast .t-x:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.toast .t-x .i { font-size: 13px; color: inherit; }
.toast.saliendo { animation: salirToast .2s ease forwards; }
@keyframes entrarToast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes salirToast { to { opacity: 0; transform: translateY(10px); } }
#printReport { display: none; }

/* =====================================================================
   12. RESPONSIVO
   ===================================================================== */
@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tabla .c-autor { display: none; }
}
@media (max-width: 920px) {
  .adm-cols, .datos-grid { grid-template-columns: 1fr; }
  .brand .t-largo { display: none; }
  .brand .t-corto { display: inline; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .tb { height: 54px; gap: 6px; }
  .brand { gap: 6px; }
  .brand h1 { font-size: 14.5px; }
  .tb-acc { gap: 4px; }
  .sync { margin-right: 0; }
  .sync:hover #btnRefrescar { opacity: 0; width: 0; }
  .sync.err #btnRefrescar, #btnRefrescar:focus-visible { opacity: 1; width: 26px; }
  #btnExportar, #btnImprimir { display: none; }
  .solo-movil { display: flex !important; }
  .btn-nuevo { width: 34px; padding: 0; justify-content: center; margin: 0; }
  .btn-nuevo .lbl { display: none; }
  .vista-seg { background: transparent; padding: 0; }
  .vista-seg button { width: 34px; height: 34px; color: rgba(255, 255, 255, .82); }
  .vista-seg button[aria-pressed="true"] { display: none; }
  .pill-consulta .lbl { display: none; }
  .pill-consulta { padding: 0 6px; }
  .user-wrap { margin-left: 2px; }
  .main { padding-top: 10px; }
  .search-card { height: 50px; padding: 0 8px 0 14px; gap: 8px; }
  .search-card input { font-size: 15px; }
  .kbd-hint { display: none; }
  .cifras { font-size: 12.5px; margin-top: 8px; }
  .cifra { padding: 2px 4px; }
  .nav-row { margin-top: 16px; gap: 8px; }
  .seg-nav { flex: 1; }
  .seg-nav .tab { flex: 1; padding: 0 8px; }
  .filtros-pop { left: auto; right: 0; width: min(360px, calc(100vw - 32px)); }
  .fp-grupo .seg { display: grid; grid-template-columns: 1fr 1fr; }
  .pills { margin-right: -16px; padding-right: 16px; }
  .fijados { margin-top: 20px; }
  .fj-track { margin-right: -16px; padding-right: 16px; }
  .wr-tile { flex-basis: 200px; }
  .resultados { margin-top: 22px; }
  .tile { height: 96px; }
  .tile.con-desc { height: 116px; }

/* ============ 2. Utilidades ============ */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));
const MAPA_ESCAPE = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
const MAPA_DESESCAPE = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&#96;': '`' };

/** Escapa cualquier valor antes de insertarlo en HTML (único punto de escape). */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"'`]/g, c => MAPA_ESCAPE[c]);
}

/** Misma regla que esUrlValida_ (Codigo.gs): solo http(s), host válido, sin espacios ni caracteres peligrosos. */
function esUrlValida(u) {
  const s = String(u == null ? '' : u);
  if (!/^https?:\/\//i.test(s)) return false;
  if (/[\s<>"`\\\u0000-\u001F\u007F]/.test(s)) return false;
  const autoridad = s.replace(/^https?:\/\//i, '').split(/[/?#]/)[0];
  const host = autoridad.replace(/^[^@]*@/, '').replace(/:\d{1,5}$/, '');
  if (!host) return false;
  if (/^\[[0-9a-f:.]+\]$/i.test(host)) return true;
  const et = '[a-z0-9\\u00a1-\\uffff](?:[a-z0-9\\u00a1-\\uffff_-]*[a-z0-9\\u00a1-\\uffff])?';
  return new RegExp('^' + et + '(?:\\.' + et + ')*\\.?$', 'i').test(host);
}
/** Devuelve la URL solo si es http(s) válida; en otro caso cadena vacía (nunca se usa otra cosa en un href). */
function urlSegura(u) {
  const s = String(u == null ? '' : u).trim();
  if (!esUrlValida(s)) return '';
  try {
    const x = new URL(s);
    return (x.protocol === 'http:' || x.protocol === 'https:') && x.hostname ? s : '';
  } catch (e) { return ''; }
}

const RE_DIACRITICOS = /[̀-ͯ]/g;
/** Normaliza para búsqueda: NFD + sin diacríticos + minúsculas. */
function normalizar(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(RE_DIACRITICOS, '').toLowerCase();
}

function hostDe(u) {
  try { return new URL(u).host.toLowerCase(); } catch (e) { return ''; }
}

function aBool(v) {
  if (v === true || v === 1) return true;
  const s = normalizar(String(v == null ? '' : v).trim());
  return s === 'true' || s === 'si' || s === '1' || s === 'verdadero' || s === 'x';
}

function clonar(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }

function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sin crypto */ }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function debounce(fn, ms) {
  let t = null;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* Correo válido; se aceptan además los dominios de la demo local (@demo, @local). */
function esEmail(s) { return /^[^\s@]+@([^\s@]+\.[^\s@]+|demo|local)$/.test(String(s || '').trim()); }

/** 'juan.perez_lopez@x.com' → 'Juan Perez Lopez' */
function nombreDesdeEmail(email) {
  const local = String(email || '').split('@')[0] || '';
  const partes = local.split(/[._\-+]+/).filter(Boolean);
  if (!partes.length) return 'Usuario';
  return partes.map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
}

function iniciales(nombre, email) {
  const base = String(nombre || '').trim() || nombreDesdeEmail(email);
  const p = base.split(/\s+/).filter(w => /[A-Za-zÀ-ÿ]/.test(w));
  if (!p.length) return '?';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : (p[0][1] || ''))).toUpperCase();
}

/* Paleta institucional para avatares (determinista por correo/nombre) */
const PALETA_AVATAR = ['#004481', '#0E7490', '#7C3AED', '#0F766E', '#B45309', '#BE185D', '#1D4ED8', '#475569', '#15803D', '#9333EA'];
function colorAvatar(semilla) {
  const s = String(semilla || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETA_AVATAR[h % PALETA_AVATAR.length];
}
function avatarHtml(nombre, email, clase = '') {
  return `<span class="avatar ${clase}" style="--av:${colorAvatar(email || nombre)}" aria-hidden="true">${esc(iniciales(nombre, email))}</span>`;
}

function hexValido(c) { return /^#[0-9a-f]{6}$/i.test(String(c || '')); }
function hexRgba(hex, a) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  return `rgba(${parseInt(h.slice(0, 2), 16)}, ${parseInt(h.slice(2, 4), 16)}, ${parseInt(h.slice(4, 6), 16)}, ${a})`;
}
/** Mezcla un color con blanco (t = 0..1) para mejorar el contraste en tema oscuro. */
function aclarar(hex, t) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  const canal = (i) => Math.round(parseInt(h.slice(i, i + 2), 16) + (255 - parseInt(h.slice(i, i + 2), 16)) * t).toString(16).padStart(2, '0');
  return '#' + canal(0) + canal(2) + canal(4);
}
/** Mezcla un color con negro (t = 0..1) para texto con contraste AA sobre fondos claros. */
function oscurecer(hex, t) {
  const h = hexValido(hex) ? hex.slice(1) : '64748B';
  const canal = (i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - t)).toString(16).padStart(2, '0');
  return '#' + canal(0) + canal(2) + canal(4);
}
/** Variables CSS de color de categoría (solo colores validados #RRGGBB). */
function varsColor(color) {
  const c = hexValido(color) ? color : '#64748B';
  const oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
  return `--c:${c};--c-soft:${hexRgba(c, oscuro ? 0.2 : 0.11)};--c-fg:${oscuro ? aclarar(c, 0.45) : c};--c-txt:${oscuro ? aclarar(c, 0.6) : oscurecer(c, 0.4)}`;
}

/* Fechas */
function aFecha(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
let FMT_LARGA, FMT_CORTA, FMT_HORA, FMT_DIA, RTF;
try {
  FMT_LARGA = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  FMT_CORTA = new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
  FMT_HORA = new Intl.DateTimeFormat('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
  FMT_DIA = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  RTF = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
} catch (e) { /* Intl limitado: se usan formatos de respaldo */ }
function fechaLarga(iso) { const d = aFecha(iso); if (!d) return '—'; return FMT_LARGA ? FMT_LARGA.format(d) : d.toLocaleString(); }
function fechaCorta(iso) { const d = aFecha(iso); if (!d) return '—'; return FMT_CORTA ? FMT_CORTA.format(d).replace(/\./g, '') : d.toLocaleDateString(); }
function horaCorta(d) { d = d instanceof Date ? d : aFecha(d); if (!d) return '—'; return FMT_HORA ? FMT_HORA.format(d) : d.toTimeString().slice(0, 5); }
function fechaRelativa(iso) {
  const d = aFecha(iso); if (!d) return '—';
  const seg = Math.round((d.getTime() - Date.now()) / 1000);
  const abs = Math.abs(seg);
  if (!RTF) return fechaCorta(iso);
  if (abs < 45) return 'hace un momento';
  if (abs < 3600) return RTF.format(Math.round(seg / 60), 'minute');
  if (abs < 86400) return RTF.format(Math.round(seg / 3600), 'hour');
  if (abs < 86400 * 7) return RTF.format(Math.round(seg / 86400), 'day');
  if (abs < 86400 * 30) return RTF.format(Math.round(seg / (86400 * 7)), 'week');
  if (abs < 86400 * 365) return RTF.format(Math.round(seg / (86400 * 30)), 'month');
  return RTF.format(Math.round(seg / (86400 * 365)), 'year');
}
function esReciente(iso, dias = 7) { const d = aFecha(iso); return !!d && (Date.now() - d.getTime()) < dias * 86400000 && d.getTime() <= Date.now() + 60000; }
function fmtNum(n) { try { return Number(n || 0).toLocaleString('es-MX'); } catch (e) { return String(n || 0); } }
function plural(n, uno, varios) { return `${fmtNum(n)} ${n === 1 ? uno : varios}`; }
function reducirMovimiento() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }

/** Copia al portapapeles con respaldo (el iframe de GAS puede bloquear la API asíncrona). */
function copiarTexto(texto) {
  const respaldo = () => new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('No se pudo copiar'));
  });
  try {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto).catch(respaldo);
    }
  } catch (e) { /* continúa con respaldo */ }
  return respaldo();
}

/** Descarga un archivo generado en el navegador (Blob + a[download]). */
function descargarArchivo(nombre, contenido, mime) {
  const blob = new Blob([contenido], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ============ 3. Almacenamiento seguro (localStorage con respaldo en memoria) ============ */
const Almacen = (() => {
  const memoria = Object.create(null);
  const soloMemoria = new Set();   // claves cuya última escritura no llegó a localStorage (p. ej. cuota llena)
  let disponible = false;
  let avisado = false;
  try {
    const k = '__space10_prueba__';
    window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k);
    disponible = true;
  } catch (e) { disponible = false; }
  /* Aviso único: la base local deja de persistir, pero nunca se borra lo ya guardado */
  function avisarCuota(k) {
    if (avisado || k !== CLAVES.DB) return;
    avisado = true;
    setTimeout(() => {
      try { toast('Almacenamiento lleno: los cambios solo duran en esta pestaña. Descarga un respaldo.', 'error'); } catch (e) { /* sin interfaz */ }
    }, 0);
  }
  return {
    disponible: () => disponible,
    get(k) {
      if (disponible && !soloMemoria.has(k)) {
        try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* bloqueado */ }
      }
      return k in memoria ? memoria[k] : null;
    },
    set(k, v) {
      memoria[k] = String(v);
      if (!disponible) return;
      try { window.localStorage.setItem(k, String(v)); soloMemoria.delete(k); }
      catch (e) { soloMemoria.add(k); avisarCuota(k); }   // se conserva el valor previo; la memoria es la fuente de verdad
    },
    remove(k) {
      delete memoria[k];
      soloMemoria.delete(k);
      if (!disponible) return;
      try { window.localStorage.removeItem(k); } catch (e) { /* sin acceso */ }
    },
    getJSON(k, def) {
      const v = this.get(k);
      if (v == null) return def;
      try { return JSON.parse(v); } catch (e) { return def; }
    },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); }
  };
})();

/* ============ 5. Reglas de validación compartidas (reflejan Codigo.gs) ============ */
const LIMITES = { TAGS_MAX: 12, TAG_LEN: 40, TEC_MAX: 8, TEC_LEN: 40 };
const Reglas = {
  /** Quita caracteres de control (como quitarControl_ del servidor). */
  quitarControl(s) { return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, ''); },
  /** Texto de una sola línea con espacios colapsados (textoLinea_). */
  linea(v) { return Reglas.quitarControl(String(v == null ? '' : v).replace(/[\r\n\t]+/g, ' ')).replace(/\s+/g, ' ').trim(); },
  /** Texto multilínea (textoLargo_). */
  largo(v) { return Reglas.quitarControl(String(v == null ? '' : v).replace(/\r\n?/g, '\n')).trim(); },
  /** Acepta arreglo o texto separado por comas / punto y coma / saltos de línea (partirLista_). */
  partirLista(v) {
    if (v === null || v === undefined || v === '') return [];
    const res = [];
    (Array.isArray(v) ? v : [v]).forEach(x => {
      if (x === null || x === undefined) return;
      String(x).split(/[,;\r\n]+/).forEach(p => { const t = p.trim(); if (t) res.push(t); });
    });
    return res;
  },
  /** Etiquetas: sin espacios internos, prefijo '#', sin duplicados; se RECORTAN a 12 × 40 como en el servidor. */
  normalizarTags(v) {
    const vistos = new Set();
    const out = [];
    for (const bruto of Reglas.partirLista(v)) {
      if (out.length >= LIMITES.TAGS_MAX) break;
      const base = Reglas.quitarControl(bruto).replace(/\s+/g, '').replace(/^#+/, '');
      if (!base) continue;
      const t = ('#' + base).slice(0, LIMITES.TAG_LEN);
      const k = t.toLowerCase();
      if (vistos.has(k)) continue;
      vistos.add(k); out.push(t);
    }
    return out;
  },
  /** Tecnologías: recortadas a 8 × 40, sin duplicados (normalizarTecnologias_). */
  normalizarLista(v) {
    const vistos = new Set();
    const out = [];
    for (const bruto of Reglas.partirLista(v)) {
      if (out.length >= LIMITES.TEC_MAX) break;
      const t = Reglas.linea(bruto).slice(0, LIMITES.TEC_LEN).trim();
      if (!t) continue;
      const k = t.toLowerCase();
      if (vistos.has(k)) continue;
      vistos.add(k); out.push(t);
    }
    return out;
  },
  /** Estado canónico o '' si no se reconoce (acepta etiquetas como "Producción (Activo)"). */
  normalizarEstado(v) {
    const s = normalizar(String(v == null ? '' : v).trim());
    if (!s) return '';
    if (ESTADO_MAP[s]) return s;
    if (s.startsWith('prod') || s.startsWith('activo')) return 'produccion';
    if (s.startsWith('desa') || s.startsWith('en desarrollo') || s === 'mvp') return 'desarrollo';
    if (s.startsWith('hist') || s.startsWith('consulta')) return 'historico';
    return '';
  },
  /** Clave para duplicados idéntica a normalizarUrl_: host en minúsculas, sin #hash ni '/' final. */
  urlComparable(u) {
    let s = String(u == null ? '' : u).trim();
    if (!s) return '';
    s = s.replace(/#.*$/, '');
    const m = s.match(/^([a-z][a-z0-9+.\-]*:\/\/)([^\/?#]*)(.*)$/i);
    if (m) s = m[1].toLowerCase() + m[2].toLowerCase() + m[3];
    return s.replace(/\/+$/, '');
  },
  buscarDuplicado(url, items, idExcluir) {
    const k = Reglas.urlComparable(url);
    if (!k) return null;
    return items.find(i => !i.eliminado && i.id !== idExcluir && i.url && Reglas.urlComparable(i.url) === k) || null;
  },
  /** Valida y limpia un enlace con las mismas reglas que validarItem_. Devuelve { item, errores, valido }. */
  validar(datos, { previo = null, categorias = [] } = {}) {
    const d = Object.assign({}, datos || {});
    /* En edición, los campos ausentes conservan su valor (igual que validarItem_) */
    if (previo) ['nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia']
      .forEach(k => { if (d[k] === undefined) d[k] = previo[k]; });
    const errores = {};
    const estadoBruto = Reglas.linea(d.estado);
    const item = {
      nombre: Reglas.linea(d.nombre),
      categoriaId: Reglas.linea(d.categoriaId),
      url: Reglas.linea(d.url),
      urlScript: Reglas.linea(d.urlScript),
      descripcion: Reglas.largo(d.descripcion),
      tags: Reglas.normalizarTags(d.tags),
      tecnologias: Reglas.normalizarLista(d.tecnologias),
      iniciativa: Reglas.linea(d.iniciativa),
      estado: estadoBruto ? Reglas.normalizarEstado(estadoBruto) : 'produccion',
      fijado: aBool(d.fijado),
      tiempoReal: aBool(d.tiempoReal),
      frecuencia: Reglas.linea(d.frecuencia)
    };
    if (item.nombre.length < 3 || item.nombre.length > 120) errores.nombre = 'El nombre debe tener entre 3 y 120 caracteres.';
    const cat = categorias.find(c => c.id === item.categoriaId);
    const conservaCategoria = !!previo && previo.categoriaId === item.categoriaId;   // una categoría desactivada se puede conservar al editar
    if (!item.categoriaId) errores.categoriaId = 'Selecciona una categoría.';
    else if (!cat || (!aBool(cat.activa) && !conservaCategoria)) errores.categoriaId = 'La categoría seleccionada no existe o está inactiva.';
    if (!item.url) {
      if (!previo) errores.url = 'La URL principal es obligatoria.';
      else if (previo.url) errores.url = 'La URL principal no puede quedar vacía.';
    } else if (item.url.length > 2000) errores.url = 'La URL es demasiado larga (máx. 2000 caracteres).';
    else if (!urlSegura(item.url)) errores.url = 'La URL debe iniciar con http:// o https://, tener un dominio válido y no contener espacios ni los caracteres < > " `.';
    if (item.urlScript && (item.urlScript.length > 2000 || !urlSegura(item.urlScript))) errores.urlScript = 'La URL del script debe iniciar con http:// o https://, tener un dominio válido y no contener espacios.';
    if (item.descripcion.length < 10 || item.descripcion.length > 1000) errores.descripcion = 'La descripción debe tener entre 10 y 1000 caracteres.';
    if (item.iniciativa.length > 80) errores.iniciativa = 'La iniciativa admite máximo 80 caracteres.';
    if (item.frecuencia.length > 60) errores.frecuencia = 'La frecuencia admite máximo 60 caracteres.';
    if (!item.estado || !ESTADO_MAP[item.estado]) errores.estado = 'Estado no válido. Usa: Producción (Activo), En Desarrollo (MVP) o Histórico / Consulta.';
    return { item, errores, valido: Object.keys(errores).length === 0 };
  },
  primerError(errores) { const k = Object.keys(errores || {}); return k.length ? errores[k[0]] : ''; }
};

/* ============ 6. Api: fábrica y adaptador GAS ============ */
const API_METODOS = ['obtenerCatalogoHerramientas', 'guardarHerramienta', 'eliminarHerramienta', 'fijarHerramienta', 'registrarVisita',
  'obtenerPanelAdmin', 'restaurarHerramienta', 'purgarHerramienta', 'guardarRolUsuario', 'guardarCategoria', 'eliminarCategoria',
  'actualizarMiPerfil', 'importarHerramientas', 'cargarSemillaFaltante'];

function createApi() { return ES_GAS ? crearApiGas() : crearApiLocal(); }

/** Adaptador GAS: cada método devuelve una promesa sobre google.script.run. */
function crearApiGas() {
  const api = { modo: 'gas' };
  API_METODOS.forEach(fn => {
    api[fn] = (...args) => new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => (r && r.ok ? resolve(r) : reject(r || { error: 'Respuesta vacía del servidor' })))
        .withFailureHandler(e => reject({ error: (e && e.message) || String(e) }))[fn](...args);
    });
  });
  return api;
}

/* ============ 7. Api: adaptador local (misma semántica que Codigo.gs sobre localStorage) ============ */
function crearApiLocal() {
  const PROPIETARIO = 'admin.local@demo';
  const LATENCIA = 120;
  const AUTOR_SEMILLA = { email: 'equipo.space10@local', nombre: 'Equipo Space 1.0' };
  /* Antigüedad (días) de cada semilla para que la demo luzca realista ("Nuevo" < 7 días). */
  const ANTIGUEDAD = { 'seed-001': 2, 'seed-002': 18, 'seed-003': 26, 'seed-004': 33, 'seed-005': 41, 'seed-006': 5, 'seed-007': 12,
    'seed-101': 9, 'seed-102': 9, 'seed-103': 15, 'seed-104': 15, 'seed-105': 20, 'seed-106': 24, 'seed-107': 28, 'seed-108': 6 };
  const MAX_BITACORA = 5000;

  class ErrorApi extends Error { constructor(msg, extra) { super(msg); this.extra = extra || null; } }
  const ahoraISO = () => new Date().toISOString();

  function itemSemilla(s) {
    const dias = ANTIGUEDAD[s.id] || 30;
    return Object.assign(clonar(s), {
      urlScript: '', estado: 'produccion',
      creadoPor: AUTOR_SEMILLA.email, creadoPorNombre: AUTOR_SEMILLA.nombre,
      fechaCreacion: new Date(Date.now() - dias * 86400000 - 3600000 * 3).toISOString(),
      modificadoPor: '', modificadoPorNombre: '', fechaModificacion: '',
      visitas: 0, eliminado: false, eliminadoPor: '', fechaEliminacion: ''
    });
  }
  function crearDB() {
    const f = ahoraISO();
    return {
      items: SEMILLA_ITEMS.map(itemSemilla),
      categorias: clonar(CATEGORIAS_SEMILLA),
      usuarios: [{ email: PROPIETARIO, nombre: 'Admin Local', rol: 'ADMIN', fechaAlta: f, ultimoAcceso: f, accesos: 1 }],
      bitacora: [{ fecha: f, usuario: 'sistema', accion: 'SEMILLA', itemId: '', itemNombre: '', detalle: 'Base local inicializada con 15 enlaces semilla y 14 categorías.' }]
    };
  }
  function leer() {
    let d = Almacen.getJSON(CLAVES.DB, null);
    if (!d || typeof d !== 'object' || !Array.isArray(d.items)) { d = crearDB(); escribir(d); }
    if (!Array.isArray(d.categorias)) d.categorias = clonar(CATEGORIAS_SEMILLA);
    if (!Array.isArray(d.usuarios)) d.usuarios = [];
    if (!Array.isArray(d.bitacora)) d.bitacora = [];
    return d;
  }
  function escribir(d) { Almacen.setJSON(CLAVES.DB, d); }

  function perfilActual() {
    const id = Almacen.get(CLAVES.PERFIL) || 'admin';
    return PERFILES_DEMO.find(p => p.id === id) || PERFILES_DEMO[0];
  }
  /** Resuelve identidad y rol como el servidor (§4). */
  function sesion(d) {
    const email = perfilActual().email;
    if (!email) return { email: '', nombre: 'Invitado', rol: 'invitado', esPropietario: false, puedeEscribir: false };
    const fila = d.usuarios.find(u => u.email === email);
    const esProp = email === PROPIETARIO;
    const rol = esProp || (fila && String(fila.rol).toUpperCase() === 'ADMIN') ? 'admin' : 'usuario';
    return { email, nombre: (fila && fila.nombre) || nombreDesdeEmail(email), rol, esPropietario: esProp, puedeEscribir: true };
  }
  const esAdminFila = (u) => u.email === PROPIETARIO || String(u.rol).toUpperCase() === 'ADMIN';
  function exigirEscritura(u) { if (!u.puedeEscribir) throw new ErrorApi('Modo consulta: identifícate con tu cuenta corporativa para realizar cambios.'); }
  function exigirAdmin(u) { if (u.rol !== 'admin') throw new ErrorApi('Acción reservada para administradores.'); }
  function puedeEditarItem(it, u) { return !!u.email && (u.rol === 'admin' || it.creadoPor === u.email); }
  function conPermiso(it, u) { const c = clonar(it); c.puedeEditar = puedeEditarItem(it, u); return c; }
  function buscarItem(d, id) { const it = d.items.find(i => i.id === String(id || '')); if (!it) throw new ErrorApi('No se encontró el enlace solicitado.'); return it; }
  function registrar(d, u, accion, item, detalle) {
    d.bitacora.unshift({
      fecha: ahoraISO(), usuario: u.email || 'invitado', accion,
      itemId: item ? item.id : '', itemNombre: item ? (item.nombre || '') : '',
      detalle: String(detalle || '').slice(0, 500)
    });
    if (d.bitacora.length > MAX_BITACORA) d.bitacora.length = MAX_BITACORA;
  }
  function ordenarCats(cats) { return clonar(cats).sort((a, b) => (Number(a.orden) || 0) - (Number(b.orden) || 0) || String(a.nombre).localeCompare(String(b.nombre), 'es')); }
  function camposCambiados(antes, despues) {
    const campos = ['nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia'];
    return campos.filter(k => JSON.stringify(antes[k]) !== JSON.stringify(despues[k]));
  }
  function filaUsuario(d, email, crear) {
    let f = d.usuarios.find(u => u.email === email);
    if (!f && crear) {
      const ahora = ahoraISO();
      f = { email, nombre: nombreDesdeEmail(email), rol: 'USUARIO', fechaAlta: ahora, ultimoAcceso: '', accesos: 0 };
      d.usuarios.push(f);
    }
    return f;
  }
  function slugUnico(base, cats, idActual) {
    let s = normalizar(base).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'categoria';
    let cand = s, n = 2;
    while (cats.some(c => c.id === cand && c.id !== idActual)) cand = `${s}-${n++}`;
    return cand;
  }

  const metodos = {
    obtenerCatalogoHerramientas() {
      const d = leer();
      const u = sesion(d);
      if (u.email) {
        const f = filaUsuario(d, u.email, true);
        const ult = aFecha(f.ultimoAcceso);
        if (!ult || Date.now() - ult.getTime() > 30 * 60000) {
          f.ultimoAcceso = ahoraISO(); f.accesos = (Number(f.accesos) || 0) + 1;
        }
        escribir(d);
      }
      return {
        usuario: u,

    guardarHerramienta(datos) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      if (!datos || typeof datos !== 'object') throw new ErrorApi('Los datos del enlace no son válidos.');

      if (previo) {
        if (previo.eliminado) throw new ErrorApi('El enlace está en la papelera; un administrador debe restaurarlo antes de editarlo.');
        if (!puedeEditarItem(previo, u)) throw new ErrorApi('Solo el autor del enlace o un administrador pueden modificarlo.');
      }
      const v = Reglas.validar(datos, { previo, categorias: d.categorias });
      if (!v.valido) throw new ErrorApi(Reglas.primerError(v.errores));
      /* Como en Codigo.gs: al editar solo se revisa duplicado si la URL cambió (no se re-confirman duplicados ya aceptados) */
      const urlCambio = !previo || Reglas.urlComparable(previo.url) !== Reglas.urlComparable(v.item.url);
      if (v.item.url && urlCambio && datos.confirmarDuplicado !== true) {
        const dup = Reglas.buscarDuplicado(v.item.url, d.items, previo ? previo.id : null);
        if (dup) throw new ErrorApi(`Este enlace ya existe en el directorio: "${dup.nombre}"`, { duplicado: { id: dup.id, nombre: dup.nombre } });
      }
      const ahora = ahoraISO();
      let final, accion;
      if (previo) {
        const cambios = camposCambiados(previo, v.item);
        Object.assign(previo, v.item, { modificadoPor: u.email, modificadoPorNombre: u.nombre, fechaModificacion: ahora });
        final = previo; accion = 'actualizado';
        registrar(d, u, 'EDITAR', previo, cambios.length ? JSON.stringify({ campos: cambios }) : 'Sin cambios de contenido');
      } else {
        final = Object.assign({ id: 'lnk_' + uuid() }, v.item, {
          creadoPor: u.email, creadoPorNombre: u.nombre, fechaCreacion: ahora,
          modificadoPor: '', modificadoPorNombre: '', fechaModificacion: '',
          visitas: 0, eliminado: false, eliminadoPor: '', fechaEliminacion: ''
        });
        d.items.push(final); accion = 'creado';
        registrar(d, u, 'CREAR', final, JSON.stringify({ categoria: final.categoriaId, url: final.url, estado: final.estado }));
      }
      escribir(d);
      return { item: conPermiso(final, u), accion };
    },

    eliminarHerramienta(id) {
      const d = leer(); const u = sesion(d);
      exigirEscritura(u);
      const it = buscarItem(d, id);
      if (it.eliminado) throw new ErrorApi('El enlace ya está en la papelera.');

      Object.assign(it, { eliminado: true, eliminadoPor: u.email, fechaEliminacion: ahoraISO() });

    fijarHerramienta(id, fijado) {

    registrarVisita(id) {

      it.visitas = (Number(it.visitas) || 0) + 1;

    },

    obtenerPanelAdmin() {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const activos = d.items.filter(i => !i.eliminado);
      /* Como listarUsuariosPanel_: registrados + propietario + autores de enlaces sin fila en USUARIOS (p. ej. importados) */
      const filas = d.usuarios.slice();
      if (!filas.some(f => f.email === PROPIETARIO)) filas.unshift({ email: PROPIETARIO, nombre: 'Admin Local', rol: 'ADMIN', fechaAlta: '', ultimoAcceso: '', accesos: 0 });
      const vistos = new Set(filas.map(f => f.email));
      activos.forEach(i => {
        const e = i.creadoPor;

        filas.push({ email: e, nombre: i.creadoPorNombre || '', rol: 'USUARIO', fechaAlta: '', ultimoAcceso: '', accesos: 0 });
      });
      const usuarios = filas.map(f => ({

        fechaAlta: f.fechaAlta || '', ultimoAcceso: f.ultimoAcceso || '', accesos: Number(f.accesos) || 0,
        esPropietario: f.email === PROPIETARIO, totalEnlaces: activos.filter(i => i.creadoPor === f.email).length
      })).sort((a, b) => (a.rol !== b.rol ? (a.rol === 'admin' ? -1 : 1) : cmpTexto(a.nombre, b.nombre)));
      const porCategoria = {}, porEstado = {}, porAutor = {};
      activos.forEach(i => {

        porEstado[i.estado] = (porEstado[i.estado] || 0) + 1;
        const k = i.creadoPor || '';

        porAutor[k].total++;
      });
      return {
        usuarios,

        }

    restaurarHerramienta(id) {
      const d = leer(); const u = sesion(d);
      exigirAdmin(u);
      const it = buscarItem(d, id);

    purgarHerramienta(id) {
      const d = leer(); const u = sesion(d);
