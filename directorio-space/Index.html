function claveFoco() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.dataset || !a.dataset.accion) return a && a.id ? { id: a.id } : null;
  return { accion: a.dataset.accion, id: a.dataset.id || '', valor: a.dataset.valor || '', zona: a.closest('.warroom') ? 'wr' : a.closest('.tabla') ? 'tb' : '' };
}
function restaurarFoco(k) {
  if (!k || Modales.hay()) return;
  if (k.id && !k.accion) { const el = document.getElementById(k.id); if (el && document.activeElement !== el) el.focus({ preventScroll: true }); return; }
  if (document.activeElement && document.activeElement !== document.body && document.activeElement.isConnected) return;
  const el = $$(`[data-accion="${k.accion}"]`).find(e => (e.dataset.id || '') === k.id && (e.dataset.valor || '') === k.valor
    && (k.zona === 'wr' ? !!e.closest('.warroom') : k.zona === 'tb' ? !!e.closest('.tabla') : !e.closest('.warroom') && !e.closest('.tabla')));
  if (el) el.focus({ preventScroll: true });
}

/* ============ 14. Toasts ============ */
const DURACION_TOAST = 3500;
function toast(mensaje, tipo = 'info') {
  const cont = $('#toasts');
  const el = document.createElement('div');
  const ic = tipo === 'success' ? 'check' : tipo === 'error' ? 'alert' : 'info';
  el.className = `toast toast-${tipo}`;
  el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  el.innerHTML = `${icon(ic)}<span class="t-msg">${esc(mensaje)}</span><button type="button" class="t-x" aria-label="Cerrar notificación">${icon('x')}</button><span class="t-bar" style="animation-duration:${DURACION_TOAST}ms" aria-hidden="true"></span>`;
  const cerrar = () => {
    if (!el.isConnected || el.classList.contains('saliendo')) return;
    el.classList.add('saliendo');
    setTimeout(() => el.remove(), reducirMovimiento() ? 0 : 200);
  };
  el.querySelector('.t-x').addEventListener('click', cerrar);
  cont.appendChild(el);
  while (cont.children.length > 4) cont.firstElementChild.remove();
  setTimeout(cerrar, DURACION_TOAST);
  return el;
}
function mensajeError(e) { return (e && (e.error || e.message)) || 'Ocurrió un error inesperado.'; }

/* ============ 15. Sistema de modales (foco atrapado y retorno de foco) ============ */
const SELECTOR_ENFOCABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
function enfocables(raiz) {
  return $$(SELECTOR_ENFOCABLE, raiz).filter(el => !el.closest('[hidden]') && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
}

const Modales = {
  pila: [],
  hay() { return this.pila.length > 0; },
  tope() { return this.pila[this.pila.length - 1] || null; },
  /**
   * Abre un modal. opciones: { titulo, subtitulo, antetituloHtml, accionesCabHtml, icono, color, cuerpo, pie, tamano, rol, antesDeCerrar, alCerrar, clase, foco }
   * foco: selector del elemento que recibe el foco inicial (por defecto, el primer control del cuerpo).
   * Devuelve { el, cuerpo, pie, cerrar(forzar) }.
   */
  abrir(o) {
    cerrarMenuUsuario();
    const idT = 'mt-' + Math.random().toString(36).slice(2, 9);
    const capa = document.createElement('div');
    capa.className = 'modal-capa';
    capa.innerHTML = `
      <div class="modal ${o.tamano || 'md'} ${o.clase || ''}" role="${o.rol || 'dialog'}" aria-modal="true" aria-labelledby="${idT}" tabindex="-1" ${o.color ? `style="${varsColor(o.color)}"` : ''}>
        <header class="modal-cab">
          ${o.icono ? `<span class="m-ico">${icon(o.icono)}</span>` : ''}
          <div class="m-tit">${o.antetituloHtml || ''}<h2 id="${idT}">${esc(o.titulo || '')}</h2>${o.subtituloHtml ? `<div class="m-sub">${o.subtituloHtml}</div>` : o.subtitulo ? `<div class="m-sub">${esc(o.subtitulo)}</div>` : ''}</div>
          ${o.accionesCabHtml || ''}<button type="button" class="icon-btn" data-cerrar aria-label="Cerrar">${icon('x')}</button>
        </header>
        <div class="modal-cuerpo">${o.cuerpo || ''}</div>
        ${o.pie ? `<footer class="modal-pie">${o.pie}</footer>` : ''}
      </div>`;
    const previo = document.activeElement;
    const m = {
      capa, el: capa.querySelector('.modal'), cuerpo: capa.querySelector('.modal-cuerpo'), pie: capa.querySelector('.modal-pie'),
      cerrado: false,
      async cerrar(forzar = false) {
        if (m.cerrado) return;
        if (!forzar && o.antesDeCerrar) { const seguir = await o.antesDeCerrar(); if (!seguir) return; }
        m.cerrado = true;
        Modales.pila = Modales.pila.filter(x => x !== m);
        capa.classList.add('saliendo');
        setTimeout(() => capa.remove(), reducirMovimiento() ? 0 : 140);
        Modales.actualizarInert();
        if (o.alCerrar) o.alCerrar();
        if (previo && previo.isConnected && typeof previo.focus === 'function') previo.focus({ preventScroll: true });
        else if (Modales.tope()) Modales.tope().el.focus();
        else { const r = $('#resultados'); if (r) r.focus({ preventScroll: true }); }
      }
    };
    capa.addEventListener('mousedown', (e) => { if (e.target === capa) m.cerrar(); });
    capa.addEventListener('click', (e) => { if (e.target.closest('[data-cerrar]')) m.cerrar(); });
    $('#modalRoot').appendChild(capa);
    this.pila.push(m);
    this.actualizarInert();
    requestAnimationFrame(() => {
      const preferido = (o.foco && m.el.querySelector(o.foco)) || m.el.querySelector('[autofocus]') || enfocables(m.cuerpo)[0] || enfocables(m.el)[0] || m.el;
      preferido.focus({ preventScroll: true });
    });
    return m;
  },
  cerrarTope() { const t = this.tope(); if (t) t.cerrar(); },
  actualizarInert() {
    const app = $('#app');
    const hay = this.pila.length > 0;
    if (hay) {
      const ancho = window.innerWidth - document.documentElement.clientWidth;
      if (!document.body.classList.contains('con-modal')) document.body.style.paddingRight = ancho > 0 ? ancho + 'px' : '';
      document.body.classList.add('con-modal');
      app.setAttribute('inert', ''); app.setAttribute('aria-hidden', 'true');
    } else {
      document.body.classList.remove('con-modal'); document.body.style.paddingRight = '';
      app.removeAttribute('inert'); app.removeAttribute('aria-hidden');
    }
    this.pila.forEach((m, i) => { if (i < this.pila.length - 1) m.capa.setAttribute('inert', ''); else m.capa.removeAttribute('inert'); });
  }
};

/** Botón con spinner mientras se espera al servidor (escrituras pesimistas). */
function conCarga(btn, cargando, textoCarga) {
  if (!btn) return;
  if (cargando) {
    btn.dataset.html = btn.innerHTML;
    btn.classList.add('cargando'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = `<span class="spin" aria-hidden="true"></span><span class="lbl-m">${esc(textoCarga || 'Guardando…')}</span>`;
  } else if (btn.dataset.html !== undefined) {
    btn.innerHTML = btn.dataset.html; delete btn.dataset.html;
    btn.classList.remove('cargando'); btn.disabled = false; btn.removeAttribute('aria-busy');
  }
}

/**
 * Diálogo de confirmación propio (no window.confirm).
 * Si se pasa `accion` (async), se ejecuta con spinner y el diálogo solo se cierra si tiene éxito.
 */
function confirmar({ titulo, mensaje, mensajeHtml, textoConfirmar = 'Confirmar', textoCancelar = 'Cancelar', peligro = false, icono, accion, textoCarga }) {
  return new Promise((resolve) => {
    let resultado = false;
    const m = Modales.abrir({
      titulo, icono: icono || (peligro ? 'alert' : 'info'), color: peligro ? '#DC2626' : '#0284C7', tamano: 'sm', rol: 'alertdialog',
      cuerpo: `<p class="confirm-txt">${mensajeHtml || esc(mensaje || '')}</p><div class="alerta alerta-error" data-err hidden style="margin-top:12px"></div>`,
      pie: `<button type="button" class="btn btn-secondary" data-cancelar>${esc(textoCancelar)}</button>
            <button type="button" class="btn ${peligro ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(textoConfirmar)}</button>`,
      antesDeCerrar: async () => !m.el.querySelector('[data-ok]').classList.contains('cargando'),
      alCerrar: () => resolve(resultado)
    });
    const ok = m.el.querySelector('[data-ok]');
    m.el.querySelector('[data-cancelar]').addEventListener('click', () => m.cerrar());
    ok.addEventListener('click', async () => {
      if (!accion) { resultado = true; m.cerrar(true); return; }
      const err = m.el.querySelector('[data-err]');
      err.hidden = true;
      conCarga(ok, true, textoCarga || 'Procesando…');
      try {
        await accion();
        resultado = true;
        m.cerrar(true);
      } catch (e) {
        conCarga(ok, false);
        err.innerHTML = `${icon('alert')}<span>${esc(mensajeError(e))}</span>`;
        err.hidden = false;
        toast(mensajeError(e), 'error');
      }
    });
    requestAnimationFrame(() => (peligro ? m.el.querySelector('[data-cancelar]') : ok).focus());
  });
}

    ${url ? `<a class="btn btn-primary btn-sm btn-abrir-pie" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-m="visita" aria-label="Abrir Herramienta (pestaña nueva)">Abrir Herramienta ${icon('external')}</a>`
          : puede ? `<button type="button" class="btn btn-primary btn-sm btn-abrir-pie" data-m="editar-url">${icon('link')}Completar URL</button>` : ''}`;
  const badges = `${badgeEstado(it)}${esReciente(it.fechaCreacion) ? '<span class="badge-nuevo">Nuevo</span>' : ''}${it.fijado ? `<span class="badge-nuevo" style="background:var(--info-bg);color:var(--info-text)">Fijado en Warroom</span>` : ''}${vivo ? '<span class="badge-vivo">Tiempo real</span>' : ''}`;
  const migas = `<nav class="m-crumb" aria-label="Ubicación">${icon(sec && sec.icono === 'book' ? 'book' : 'grid')}<span>${esc(sec ? sec.nombre : 'Sin sección')}</span>${icon('chevron-right', 'sepc')}<span class="cat">${esc(cat.nombre)}</span></nav>`;
  const m = Modales.abrir({
    titulo: it.nombre, icono: cat.icono, color: cat.color, tamano: 'lg', clase: 'ficha', foco: '[data-cerrar]',
    antetituloHtml: migas,
    accionesCabHtml: `<button type="button" class="icon-btn fav ${fav ? 'on' : ''}" data-m="fav" data-fav-ficha="${esc(it.id)}" aria-pressed="${fav}"></button>`,
    subtituloHtml: `<div class="ficha-badges">${badges}</div>`,
    cuerpo, pie
  });
  m.el.dataset.fichaId = it.id;
  pintarBotonFavFicha(m.el.querySelector('[data-m="fav"]'), fav);
  m.el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const acc = b.dataset.m;
    if (acc === 'visita') { registrarVisita(it.id); return; }
    if (acc === 'copiar-url') { copiarTexto(b.dataset.url).then(() => toast('Enlace copiado al portapapeles', 'success')).catch(() => toast('No se pudo copiar el enlace.', 'error')); return; }
    if (acc === 'copiar-ficha') {
      const u = urlFicha(it.id);
      if (!u) { toast('La URL pública de la aplicación no está disponible.', 'error'); return; }
      copiarTexto(u).then(() => toast('Enlace a la ficha copiado al portapapeles', 'success')).catch(() => toast('No se pudo copiar: ' + u, 'error'));
      return;
    }
    if (acc === 'fav') { alternarFavorito(it.id); return; }
    if (acc === 'tag') { m.cerrar(true); aplicarFiltro({ tag: b.dataset.valor }); return; }
    if (acc === 'editar') { m.cerrar(true); abrirFormulario(itemPorId(it.id)); return; }
    if (acc === 'editar-url') { m.cerrar(true); abrirFormulario(itemPorId(it.id), { enfocar: 'url' }); return; }
    if (acc === 'eliminar') { eliminarItem(it.id); return; }
    if (acc === 'fijar') {
      const nuevo = !it.fijado;
      conCarga(b, true, nuevo ? 'Fijando…' : 'Quitando…');
      try {
        const r = await Api.fijarHerramienta(it.id, nuevo);
        upsertItem(r.item || Object.assign({}, it, { fijado: nuevo }));
        render();
        m.cerrar(true);
        abrirFicha(it.id);
        toast(nuevo ? 'Fijado en el Warroom para todo el equipo' : 'Retirado del Warroom', 'success');
      } catch (err) { conCarga(b, false); toast(mensajeError(err), 'error'); }
    }
  });
}

/* ============ 18. Formulario Agregar / Editar ============ */
function opcionesCategoria(seleccion) {
  return S.secciones.map(sec => {
    const cats = S.categorias.filter(c => c.seccion === sec.id && (c.activa || c.id === seleccion));
    if (!cats.length) return '';
    return `<optgroup label="${esc(sec.nombre)}">${cats.map(c => `<option value="${esc(c.id)}" ${c.id === seleccion ? 'selected' : ''}>${esc(c.nombre)}${!c.activa ? ' (inactiva)' : ''}</option>`).join('')}</optgroup>`;
  }).join('');
}
function abrirFormulario(item = null, { categoriaId = '', enfocar = '' } = {}) {
  if (!puedeEscribir()) { toast('Estás en modo consulta. Abre el directorio con tu cuenta corporativa para agregar enlaces.', 'info'); return; }
  if (item && !puedeEditar(item)) { toast('Solo el autor del enlace o un administrador pueden editarlo.', 'error'); return; }
  const edicion = !!item;
  const catInicial = item ? item.categoriaId : ((categoriaId && S.catMap.get(categoriaId) && S.catMap.get(categoriaId).activa) ? categoriaId
    : (S.filtros.cat !== 'todos' && S.catMap.get(S.filtros.cat) && S.catMap.get(S.filtros.cat).activa ? S.filtros.cat : ''));
  const base = item ? clonar(item) : { nombre: '', categoriaId: catInicial, url: '', urlScript: '', descripcion: '', tags: [], tecnologias: [], iniciativa: '', estado: 'produccion', fijado: false, tiempoReal: false, frecuencia: '' };
  const tecSel = base.tecnologias.slice();
  const ajeno = edicion && item.creadoPor !== S.usuario.email;
  const urlSemillaVacia = edicion && !item.url;

  const cuerpo = `
    <form id="formEnlace" novalidate autocomplete="off">
      ${ajeno ? `<div class="alerta alerta-warn" style="margin-bottom:16px">${icon('shield')}<span>Estás editando como <strong>administrador</strong> un enlace subido por <strong>${esc(item.creadoPorNombre)}</strong> (${esc(item.creadoPor)}).</span></div>` : ''}
      <div class="alerta alerta-error" id="fErrGeneral" role="alert" hidden style="margin-bottom:16px"></div>
      <div class="form-grid">
        <div class="campo span-2">
          <label for="fNombre">Nombre de la herramienta o recurso <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="fNombre" name="nombre" maxlength="120" required value="${esc(base.nombre)}" placeholder="Ej. SPEI Control Tower · Telemetría 24h" aria-describedby="eNombre">
          <span class="err" id="eNombre"></span>
        </div>
        <div class="campo">
          <label for="fCategoria">Categoría <span class="req" aria-hidden="true">*</span></label>
          <select id="fCategoria" name="categoriaId" required aria-describedby="eCategoria">
            <option value="">Selecciona una categoría…</option>${opcionesCategoria(base.categoriaId)}
          </select>
          <span class="err" id="eCategoria"></span>
        </div>
        <div class="campo">
          <label for="fIniciativa">Iniciativa / Responsable</label>
          <input type="text" id="fIniciativa" name="iniciativa" list="dlIniciativas" maxlength="80" value="${esc(base.iniciativa)}" placeholder="Space 1.0, SPEI, MP2C…" aria-describedby="eIniciativa">
          <datalist id="dlIniciativas">${SUG_INICIATIVAS.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
          <span class="err" id="eIniciativa"></span>
        </div>
        <div class="campo span-2">
          <label for="fUrl">URL Principal ${urlSemillaVacia ? '' : '<span class="req" aria-hidden="true">*</span>'}</label>
          <input type="url" id="fUrl" name="url" inputmode="url" value="${esc(base.url)}" placeholder="https://…" aria-describedby="eUrl hUrl" ${urlSemillaVacia ? '' : 'required'}>
          <span class="ayuda" id="hUrl">${urlSemillaVacia ? 'Este enlace aún no tiene URL. Agrégala cuando esté disponible (puede quedar vacía por ahora).' : 'Solo se permiten direcciones http:// o https://'}</span>
          <span class="err" id="eUrl"></span>
          <div class="alerta alerta-warn dup-aviso" id="fDup" hidden></div>
        </div>
        <div class="campo span-2">
          <label for="fUrlScript">URL del Script / Fuente / Repo / Drive</label>
          <input type="url" id="fUrlScript" name="urlScript" inputmode="url" value="${esc(base.urlScript)}" placeholder="https://script.google.com/… (opcional)" aria-describedby="eUrlScript">
          <span class="err" id="eUrlScript"></span>
        </div>
        <div class="campo span-2">
          <label for="fDescripcion">Descripción breve <span class="req" aria-hidden="true">*</span></label>
          <textarea id="fDescripcion" name="descripcion" maxlength="1000" required placeholder="¿Qué es, para qué sirve y quién lo usa? (10 a 1000 caracteres)" aria-describedby="eDescripcion cDescripcion">${esc(base.descripcion)}</textarea>
          <div class="fila-ayuda"><span class="err" id="eDescripcion"></span><span class="contador" id="cDescripcion" aria-live="polite"></span></div>
        </div>
        <div class="campo span-2">
          <label for="fTags">Etiquetas <span class="muted" style="font-weight:500">(separadas por coma)</span></label>
          <input type="text" id="fTags" name="tags" value="${esc(base.tags.join(', '))}" placeholder="#SPEI, #Quincenas, #MachineLearning" aria-describedby="eTags cTags">
          <div class="fila-ayuda"><div class="tags-prev" id="fTagsPrev" aria-live="polite"></div><span class="contador" id="cTags"></span></div>
          <div class="sugeridas" id="fTagsSug" role="group" aria-label="Etiquetas sugeridas"></div>
          <span class="err" id="eTags"></span>
        </div>
        <div class="campo span-2">
          <span class="lbl" id="lblTec">Tecnologías <span class="contador" id="cTec"></span></span>
          <div class="chips-sel" id="fTecChips" role="group" aria-labelledby="lblTec"></div>
          <div class="tec-libre"><input type="text" id="fTecLibre" class="campo-input" maxlength="40" placeholder="Otra tecnología… (Enter para agregar)" aria-label="Agregar otra tecnología">
            <button type="button" class="btn btn-secondary" id="fTecAgregar">${icon('plus')}Agregar</button></div>
          <span class="err" id="eTecnologias"></span>
        </div>
        <div class="campo span-2">
          <label for="fFrecuencia">Frecuencia de actualización</label>
          <input type="text" id="fFrecuencia" name="frecuencia" list="dlFrecuencias" maxlength="60" value="${esc(base.frecuencia)}" placeholder="Tiempo real (cada 10 min), Diario…" aria-describedby="eFrecuencia">
          <datalist id="dlFrecuencias">${SUG_FRECUENCIAS.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
          <span class="err" id="eFrecuencia"></span>
        </div>
        <fieldset class="campo span-2" style="border:0;padding:0;margin:0">
          <legend class="lbl" style="margin-bottom:6px">Estado</legend>
          <div class="radio-cards">
            ${ESTADOS.map(e => `<label class="radio-card" style="--rc:${e.color};--rc-bg:${hexRgba(e.color, 0.08)}"><input type="radio" name="estado" value="${e.id}" ${base.estado === e.id ? 'checked' : ''}>
              <span class="rc-dot" aria-hidden="true"></span><span><span class="rc-t">${esc(e.etiqueta)}</span><span class="rc-d">${esc(e.descripcion)}</span></span></label>`).join('')}
          </div>
        </fieldset>
        <div class="campo span-2">
          <div class="check-cards">
            <label class="check-card"><input type="checkbox" id="fFijado" ${base.fijado ? 'checked' : ''}><span class="switch-v" aria-hidden="true"></span>
              <span><span class="ck-t">${icon('pin')}Fijar en Warroom</span><span class="ck-d">Aparece en Acceso Rápido para todo el equipo.</span></span></label>
            <label class="check-card"><input type="checkbox" id="fTiempoReal" ${base.tiempoReal ? 'checked' : ''}><span class="switch-v" aria-hidden="true"></span>
              <span><span class="ck-t">${icon('activity')}Monitor en tiempo real</span><span class="ck-d">Indicador verde pulsante cuando está en Producción.</span></span></label>
          </div>
        </div>
      </div>
    </form>`;
  const nota = edicion
    ? `Creado por <strong>${esc(item.creadoPorNombre)}</strong> · ${esc(fechaLarga(item.fechaCreacion))}${item.fechaModificacion ? ` · Última modificación: <strong>${esc(item.modificadoPorNombre || item.modificadoPor)}</strong> · ${esc(fechaLarga(item.fechaModificacion))}` : ' · Sin modificaciones previas'}`
    : `Se registrará como <strong>${esc(S.usuario.nombre)}</strong> (${esc(S.usuario.email)}) · ${esc(fechaLarga(new Date().toISOString()))}`;
  const pie = `<span class="nota">${icon('user')} ${nota}</span>
    <button type="button" class="btn btn-secondary" data-cancelar>Cancelar</button>
    <button type="submit" form="formEnlace" class="btn btn-primary" id="fGuardar">${icon('check')}${edicion ? 'Guardar cambios' : 'Guardar enlace'}</button>`;

  let inicial = '';
  let guardado = false;
  const m = Modales.abrir({
    titulo: edicion ? 'Editar enlace' : 'Agregar nuevo enlace',
    subtitulo: edicion ? item.nombre : 'Comparte un tablero, script, hoja, guía o recurso con el equipo',
    icono: edicion ? 'edit' : 'plus', tamano: 'lg', cuerpo, pie,
    antesDeCerrar: async () => {
      if (guardado || JSON.stringify(leer()) === inicial) return true;
      return confirmar({ titulo: 'Descartar cambios', mensaje: 'Tienes cambios sin guardar en este enlace. ¿Deseas descartarlos?', textoConfirmar: 'Descartar', peligro: true, icono: 'alert' });
    }
  });
  const f = (id) => m.el.querySelector('#' + id);
  const form = f('formEnlace');

  function leer() {
    const est = form.querySelector('input[name="estado"]:checked');
    return {
      id: edicion ? item.id : '',
      nombre: f('fNombre').value, categoriaId: f('fCategoria').value, url: f('fUrl').value, urlScript: f('fUrlScript').value,
      descripcion: f('fDescripcion').value, tags: Reglas.normalizarTags(f('fTags').value), tecnologias: tecSel.slice(),
      iniciativa: f('fIniciativa').value, frecuencia: f('fFrecuencia').value, estado: est ? est.value : 'produccion',
      fijado: f('fFijado').checked, tiempoReal: f('fTiempoReal').checked
    };
  }
  const MAPA_ERR = { nombre: ['fNombre', 'eNombre'], categoriaId: ['fCategoria', 'eCategoria'], url: ['fUrl', 'eUrl'], urlScript: ['fUrlScript', 'eUrlScript'],
    descripcion: ['fDescripcion', 'eDescripcion'], tags: ['fTags', 'eTags'], tecnologias: ['fTecLibre', 'eTecnologias'], iniciativa: ['fIniciativa', 'eIniciativa'], frecuencia: ['fFrecuencia', 'eFrecuencia'] };
  function mostrarErrores(errores, soloCampo) {
    Object.keys(MAPA_ERR).forEach(k => {
      if (soloCampo && k !== soloCampo) return;
      const [inp, err] = MAPA_ERR[k];
      const msg = errores[k] || '';
      f(err).innerHTML = msg ? `${icon('alert')}<span>${esc(msg)}</span>` : '';
      if (msg) f(inp).setAttribute('aria-invalid', 'true'); else f(inp).removeAttribute('aria-invalid');
    });
  }
  function validarCampo(k) { const v = Reglas.validar(leer(), { previo: item, categorias: S.categorias }); mostrarErrores(v.errores, k); return v; }

  /* Tecnologías: chips sugeridos + texto libre */
  function pintarTec() {
    const extras = tecSel.filter(t => !SUG_TECNOLOGIAS.some(s => s.toLowerCase() === t.toLowerCase()));
    f('fTecChips').innerHTML = SUG_TECNOLOGIAS.map(t => {
      const on = tecSel.some(x => x.toLowerCase() === t.toLowerCase());
      return `<button type="button" class="chip-sel" data-tec="${esc(t)}" aria-pressed="${on}">${on ? icon('check') : ''}${esc(t)}</button>`;
    }).join('') + extras.map(t => `<button type="button" class="chip-sel libre" data-tec="${esc(t)}" aria-pressed="true" aria-label="Quitar ${esc(t)}">${esc(t)}${icon('x')}</button>`).join('');
    const c = f('cTec');
    c.textContent = `${tecSel.length}/8`;
    c.classList.toggle('mal', tecSel.length > 8);
  }
  function alternarTec(t) {
    const i = tecSel.findIndex(x => x.toLowerCase() === t.toLowerCase());
    if (i >= 0) tecSel.splice(i, 1);
    else {
      if (tecSel.length >= LIMITES.TEC_MAX) { f('eTecnologias').innerHTML = `${icon('alert')}<span>Máximo ${LIMITES.TEC_MAX} tecnologías.</span>`; return; }
      tecSel.push(t);
    }
    f('eTecnologias').innerHTML = '';
    pintarTec();
  }
  function agregarTecLibre() {
    const inp = f('fTecLibre');
    Reglas.partirLista(inp.value).map(t => Reglas.linea(t).slice(0, LIMITES.TEC_LEN).trim()).filter(Boolean).forEach(t => {
      if (!tecSel.some(x => x.toLowerCase() === t.toLowerCase())) alternarTec(t);
    });
    inp.value = '';
  }
  f('fTecChips').addEventListener('click', (e) => { const b = e.target.closest('[data-tec]'); if (b) alternarTec(b.dataset.tec); });
  f('fTecAgregar').addEventListener('click', agregarTecLibre);
  f('fTecLibre').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); agregarTecLibre(); } });

  /* Etiquetas con vista previa en vivo */
  function pintarTags() {
    const valor = f('fTags').value;
    const tags = Reglas.normalizarTags(valor);
    const crudos = Reglas.partirLista(valor);
    const recortadas = crudos.length > LIMITES.TAGS_MAX || crudos.some(t => ('#' + t.replace(/\s+/g, '').replace(/^#+/, '')).length > LIMITES.TAG_LEN);
    f('fTagsPrev').innerHTML = (tags.length ? tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') : '<span class="vacio-txt">Vista previa de etiquetas</span>')
      + (recortadas ? `<span class="aviso-tags">Se guardarán máximo ${LIMITES.TAGS_MAX} etiquetas de hasta ${LIMITES.TAG_LEN} caracteres.</span>` : '');
    const c = f('cTags');
    c.textContent = `${tags.length}/${LIMITES.TAGS_MAX}`;
    c.classList.toggle('mal', recortadas);
    /* Sugeridas: etiquetas populares del directorio que aún no están en el campo */
    const usadas = new Set(tags.map(t => t.toLowerCase()));
    const sug = tagsPopulares().filter(t => !usadas.has(t.tag.toLowerCase())).slice(0, 7);
    f('fTagsSug').innerHTML = sug.length && tags.length < LIMITES.TAGS_MAX
      ? `<span class="lbl-s">Sugeridas:</span>` + sug.map(t => `<button type="button" class="chip-sug" data-tag-add="${esc(t.tag)}" aria-label="Agregar etiqueta ${esc(t.tag)}">${icon('plus')}${esc(t.tag)}</button>`).join('')
      : '';
  }
  f('fTags').addEventListener('input', pintarTags);
  f('fTagsSug').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tag-add]');
    if (!b) return;
    const inp = f('fTags');
    const actual = inp.value.trim().replace(/[,;]\s*$/, '');
    inp.value = (actual ? actual + ', ' : '') + b.dataset.tagAdd;
    pintarTags();
    const sig = f('fTagsSug').querySelector('[data-tag-add]');
    (sig || inp).focus();
  });
  f('fTags').addEventListener('blur', () => validarCampo('tags'));

  /* Contador de descripción */
  function pintarContador() {
    const n = f('fDescripcion').value.trim().length;
    const c = f('cDescripcion');
    c.textContent = `${n} / 1000`;
    c.classList.toggle('mal', n > 0 && (n < 10 || n > 1000));
  }
  f('fDescripcion').addEventListener('input', pintarContador);

  /* Aviso en vivo de URL duplicada contra los enlaces cargados */
  const revisarDuplicado = debounce(() => {
    const dup = urlSegura(f('fUrl').value) ? Reglas.buscarDuplicado(f('fUrl').value, S.items, edicion ? item.id : null) : null;
    const box = f('fDup');
    if (dup) {
      box.innerHTML = `${icon('alert')}<span>Este enlace ya existe en el directorio: <strong>«${esc(dup.nombre)}»</strong>. <button type="button" class="link-mini" data-ver-dup="${esc(dup.id)}">Ver ficha</button></span>`;
      box.hidden = false;
    } else { box.hidden = true; box.innerHTML = ''; }
  }, 150);
  f('fUrl').addEventListener('input', revisarDuplicado);
  f('fDup').addEventListener('click', (e) => { const b = e.target.closest('[data-ver-dup]'); if (b) abrirFicha(b.dataset.verDup); });

  ['fNombre', 'fCategoria', 'fUrl', 'fUrlScript', 'fDescripcion', 'fIniciativa', 'fFrecuencia'].forEach(id => {
    const k = Object.keys(MAPA_ERR).find(x => MAPA_ERR[x][0] === id);
    f(id).addEventListener('blur', () => { if (f(id).value.trim() || f(id).getAttribute('aria-invalid')) validarCampo(k); });
    f(id).addEventListener('input', () => { if (f(id).getAttribute('aria-invalid')) validarCampo(k); });
  });
  f('fCategoria').addEventListener('change', () => validarCampo('categoriaId'));
  m.el.querySelector('[data-cancelar]').addEventListener('click', () => m.cerrar());

  async function guardar(confirmarDuplicado = false) {
    const datos = leer();
    const v = Reglas.validar(datos, { previo: item, categorias: S.categorias });
    mostrarErrores(v.errores);
    const gen = f('fErrGeneral');
    gen.hidden = true;
    if (!v.valido) {
      const primero = Object.keys(MAPA_ERR).find(k => v.errores[k]);
      if (primero) f(MAPA_ERR[primero][0]).focus();
      return;
    }
    const btn = f('fGuardar') || m.el.querySelector('#fGuardar');
    conCarga(btn, true, 'Guardando…');
    try {
      const r = await Api.guardarHerramienta(confirmarDuplicado ? Object.assign({}, datos, { confirmarDuplicado: true }) : datos);
      guardado = true;
      upsertItem(r.item);
      m.cerrar(true);
      render();
      destacarTarjeta(r.item.id);
      toast(r.accion === 'creado' ? 'Enlace agregado al directorio' : 'Cambios guardados correctamente', 'success');
    } catch (e) {
      conCarga(btn, false);
      if (e && e.duplicado && !confirmarDuplicado) {
        const seguir = await confirmar({
          titulo: 'Enlace duplicado', icono: 'alert', textoConfirmar: 'Guardar de todos modos',
          mensajeHtml: `${esc(mensajeError(e))}.<br><br>¿Guardar de todos modos?`
        });
        if (seguir) return guardar(true);
        f('fUrl').focus();
        return;
      }
      gen.innerHTML = `${icon('alert')}<span>${esc(mensajeError(e))}</span>`;
      gen.hidden = false;
      toast(mensajeError(e), 'error');
    }
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); guardar(false); });

  pintarTec(); pintarTags(); pintarContador();
  inicial = JSON.stringify(leer());
  requestAnimationFrame(() => {
    const destino = enfocar === 'url' ? f('fUrl') : (!edicion && base.categoriaId ? f('fNombre') : f('fNombre'));
    destino.focus();
    if (enfocar === 'url') destino.scrollIntoView({ block: 'center' });
  });
}

/* ============ 19. Exportación (JSON / Markdown / CSV) ============ */
const ARCHIVOS_EXPORT = { json: 'Directorio_Space_1_0.json', md: 'Directorio_Space_1_0.md', csv: 'Directorio_Space_1_0.csv' };
function itemExportable(it) {
  const campos = ['id', 'nombre', 'categoriaId', 'url', 'urlScript', 'descripcion', 'tags', 'tecnologias', 'iniciativa', 'estado', 'fijado', 'tiempoReal', 'frecuencia',
    'creadoPor', 'creadoPorNombre', 'fechaCreacion', 'modificadoPor', 'modificadoPorNombre', 'fechaModificacion', 'visitas'];
  const o = {};
  campos.forEach(k => { o[k] = it[k]; });
  return o;
}
function generadoPor() { return S.usuario.email ? `${S.usuario.nombre} (${S.usuario.email})` : 'Invitado'; }
const Exportar = {
  json(items) {
    return JSON.stringify({
      generado: new Date().toISOString(),
      generadoPor: generadoPor(),
      version: S.config.version || APP_VERSION,
      categorias: S.categorias.map(c => clonar(c)),
      items: ordenCanonico(items).map(itemExportable)
    }, null, 2);
  },
  md(items) {
    const celda = (v) => String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/\|/g, '\\|').replace(/\r?\n|\r/g, ' ').trim();
    const urlMd = (u) => u.replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/ /g, '%20');
    const ancla = (t) => String(t).toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s/g, '-');
    const lista = ordenCanonico(items);
    const porEstado = {};
    lista.forEach(i => { porEstado[i.estado] = (porEstado[i.estado] || 0) + 1; });
    const lineas = [];
    lineas.push('# Directorio Space 1.0 — Hub de Herramientas, Scripts y Tableros', '');
    lineas.push(`> Generado el ${fechaLarga(new Date().toISOString())} por ${generadoPor()}`);
    lineas.push(`> ${TITULO_APP}`, '');
    lineas.push('## Resumen', '');
    lineas.push(`- **Total de enlaces:** ${lista.length}`);
    S.secciones.forEach(s => lineas.push(`- **${s.nombre}:** ${lista.filter(i => catDe(i).seccion === s.id).length}`));
    lineas.push(`- **Por estado:** ${ESTADOS.map(e => `${e.etiqueta}: ${porEstado[e.id] || 0}`).join(' · ')}`);
    lineas.push(`- **Contribuidores:** ${new Set(lista.map(i => i.creadoPor)).size}`, '');
    const grupos = [];
    S.secciones.forEach(sec => {
      const cats = S.categorias.filter(c => c.seccion === sec.id).map(c => ({ cat: c, items: lista.filter(i => i.categoriaId === c.id) })).filter(g => g.items.length);
      if (cats.length) grupos.push({ sec, cats });
    });
    const huerfanos = lista.filter(i => !S.catMap.has(i.categoriaId));
    lineas.push('## Índice', '');
    grupos.forEach(g => {
      lineas.push(`- [${g.sec.nombre}](#${ancla(g.sec.nombre)})`);
      g.cats.forEach(c => lineas.push(`  - [${c.cat.nombre} (${c.items.length})](#${ancla(`${c.cat.nombre} (${c.items.length})`)})`));
    });
    if (huerfanos.length) lineas.push(`- [Sin categoría (${huerfanos.length})](#${ancla(`Sin categoría (${huerfanos.length})`)})`);
    lineas.push('');
    const tabla = (its) => {
      lineas.push('| Herramienta | Descripción | Estado | Etiquetas | Subido por | Fecha | Enlaces |', '|---|---|---|---|---|---|---|');
      its.forEach(i => {
        const u = urlSegura(i.url), us = urlSegura(i.urlScript);
        const enlaces = [u ? `[Abrir](${urlMd(u)})` : 'URL pendiente', us ? `[Código](${urlMd(us)})` : ''].filter(Boolean).join(' · ');
        lineas.push(`| **${celda(i.nombre)}** | ${celda(i.descripcion)} | ${celda((ESTADO_MAP[i.estado] || {}).etiqueta)} | ${celda(i.tags.join(' '))} | ${celda(i.creadoPorNombre)} | ${celda(fechaCorta(i.fechaCreacion))} | ${enlaces} |`);
      });
      lineas.push('');
    };
    grupos.forEach(g => {
      lineas.push(`## ${g.sec.nombre}`, '', g.sec.descripcion ? `_${g.sec.descripcion}_` : '', '');
      g.cats.forEach(c => { lineas.push(`### ${c.cat.nombre} (${c.items.length})`, ''); if (c.cat.descripcion) lineas.push(c.cat.descripcion, ''); tabla(c.items); });
    });
    if (huerfanos.length) { lineas.push(`### Sin categoría (${huerfanos.length})`, ''); tabla(huerfanos); }
    lineas.push('---', `_Directorio Space 1.0 · PTM Banxico · v${S.config.version || APP_VERSION}_`);
    return lineas.join('\n').replace(/\n{3,}/g, '\n\n');
  },
  csv(items) {
    const celda = (v) => {
      let s = String(v == null ? '' : v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;             // protección contra inyección de fórmulas
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const cab = ['ID', 'Nombre', 'Sección', 'Categoría', 'Estado', 'Descripción', 'URL', 'URL Script', 'Etiquetas', 'Tecnologías', 'Iniciativa', 'Frecuencia',
      'Fijado en Warroom', 'Tiempo real', 'Subido por', 'Correo del autor', 'Fecha de creación', 'Modificado por', 'Fecha de modificación', 'Visitas'];
    const filas = ordenCanonico(items).map(i => {
      const cat = catDe(i), sec = seccionDe(cat);
      return [i.id, i.nombre, sec ? sec.nombre : '', cat.nombre, (ESTADO_MAP[i.estado] || {}).etiqueta, i.descripcion, i.url, i.urlScript, i.tags.join(', '), i.tecnologias.join(', '),
        i.iniciativa, i.frecuencia, i.fijado ? 'Sí' : 'No', i.tiempoReal ? 'Sí' : 'No', i.creadoPorNombre, i.creadoPor, i.fechaCreacion, i.modificadoPorNombre || i.modificadoPor,
        i.fechaModificacion, i.visitas].map(celda).join(',');
    });
    return [cab.map(celda).join(',')].concat(filas).join('\r\n');
  }
};
const MIME_EXPORT = { json: 'application/json;charset=utf-8', md: 'text/markdown;charset=utf-8', csv: 'text/csv;charset=utf-8' };

function abrirExportar() {
  const filtrados = resultadosFiltrados();
  let formato = 'json';
  let alcance = hayFiltros() ? 'filtrados' : 'completo';
  const cuerpo = `
    <div class="exp-cab">
      <div class="seg" role="tablist" aria-label="Formato de exportación">
        <button type="button" role="tab" data-fmt="json" aria-selected="true" aria-pressed="true">${icon('json')}JSON</button>
        <button type="button" role="tab" data-fmt="md" aria-selected="false" aria-pressed="false">${icon('file-text')}Markdown</button>
        <button type="button" role="tab" data-fmt="csv" aria-selected="false" aria-pressed="false">${icon('table')}CSV</button>
      </div>
      <fieldset class="alcance"><legend>Alcance</legend>
        <label><input type="radio" name="alcance" value="filtrados" ${alcance === 'filtrados' ? 'checked' : ''}>Resultados filtrados (${filtrados.length})</label>
        <label><input type="radio" name="alcance" value="completo" ${alcance === 'completo' ? 'checked' : ''}>Catálogo completo (${S.items.length})</label>
      </fieldset>
    </div>
    <label for="expPreview" class="sr-only">Vista previa</label>
    <textarea id="expPreview" class="preview" readonly spellcheck="false"></textarea>
    <div class="exp-meta"><span id="expArchivo"></span><span id="expTam"></span></div>`;
  const m = Modales.abrir({
    titulo: 'Exportar Catálogo', subtitulo: 'Descarga o copia el directorio en el formato que necesites', icono: 'download', tamano: 'lg', cuerpo,
    pie: `<button type="button" class="btn btn-secondary" data-m="copiar">${icon('copy')}Copiar</button><button type="button" class="btn btn-primary" data-m="descargar">${icon('download')}Descargar</button>`
  });
  let contenido = '';
  const actualizar = () => {
    const lista = alcance === 'filtrados' ? filtrados : S.items;
    contenido = Exportar[formato](lista);
    m.el.querySelector('#expPreview').value = contenido;
    m.el.querySelector('#expArchivo').innerHTML = `${icon('file-text')} ${esc(ARCHIVOS_EXPORT[formato])} · ${plural(lista.length, 'enlace', 'enlaces')}${formato === 'csv' ? ' · UTF-8 con BOM' : ''}`;
    m.el.querySelector('#expTam').textContent = `${(new Blob([contenido]).size / 1024).toFixed(1)} KB`;
    $$('[data-fmt]', m.el).forEach(b => { const on = b.dataset.fmt === formato; b.setAttribute('aria-selected', String(on)); b.setAttribute('aria-pressed', String(on)); });
  };
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-fmt],[data-m]');
    if (!b) return;
    if (b.dataset.fmt) { formato = b.dataset.fmt; actualizar(); return; }
    if (b.dataset.m === 'copiar') copiarTexto(contenido).then(() => toast('Contenido copiado al portapapeles', 'success')).catch(() => toast('No se pudo copiar el contenido.', 'error'));
    if (b.dataset.m === 'descargar') {
      descargarArchivo(ARCHIVOS_EXPORT[formato], (formato === 'csv' ? '﻿' : '') + contenido, MIME_EXPORT[formato]);
      toast(`Descargando ${ARCHIVOS_EXPORT[formato]}`, 'success');
    }
  });
  m.el.addEventListener('change', (e) => { if (e.target.name === 'alcance') { alcance = e.target.value; actualizar(); } });
  actualizar();
}

/* ============ 20. Reporte para imprimir / PDF ============ */
function describirFiltros() {
  const f = S.filtros, d = [];
  if (f.q.trim()) d.push(`Búsqueda: «${f.q.trim()}»`);
  if (f.seccion !== 'todo') d.push(`Sección: ${(S.secMap.get(f.seccion) || {}).nombre || f.seccion}`);
  if (f.cat !== 'todos') d.push(`Categoría: ${(S.catMap.get(f.cat) || {}).nombre || f.cat}`);
  if (f.estado !== 'todos') d.push(`Estado: ${(ESTADO_MAP[f.estado] || {}).etiqueta}`);
  if (f.tag) d.push(`Etiqueta: ${f.tag}`);
  if (f.soloMios) d.push('Solo mis enlaces');
  if (f.soloFavs) d.push('Solo favoritos');
  return d.length ? d.join(' · ') : 'Sin filtros (catálogo completo)';
}
function construirReporte() {
  const items = ordenCanonico(resultadosFiltrados());
  const porEstado = {};
  items.forEach(i => { porEstado[i.estado] = (porEstado[i.estado] || 0) + 1; });
  let html = `<div class="pr-cab"><h1>${esc(TITULO_APP)}</h1><div class="pr-sub">${esc(NOMBRE_APP)}</div>
    <div class="pr-meta"><span><strong>Fecha:</strong> ${esc(fechaLarga(new Date().toISOString()))}</span><span><strong>Generado por:</strong> ${esc(generadoPor())}</span><span><strong>Filtros:</strong> ${esc(describirFiltros())}</span></div></div>
    <div class="pr-resumen"><div><strong>${items.length}</strong>Enlaces</div>${ESTADOS.map(e => `<div><strong>${porEstado[e.id] || 0}</strong>${esc(e.etiqueta)}</div>`).join('')}<div><strong>${new Set(items.map(i => i.creadoPor)).size}</strong>Contribuidores</div></div>`;
  const tabla = (its) => `<table class="pr-tabla"><thead><tr><th style="width:34%">Herramienta</th><th>Estado</th><th>Tecnologías</th><th>Etiquetas</th><th>Subido por</th><th>Fecha</th><th style="width:18%">URL</th></tr></thead><tbody>
    ${its.map(i => `<tr><td><div class="pr-nom">${esc(i.nombre)}</div><div class="pr-desc">${esc(i.descripcion)}</div></td><td>${esc((ESTADO_MAP[i.estado] || {}).etiqueta)}</td><td>${esc(i.tecnologias.join(', '))}</td><td>${esc(i.tags.join(' '))}</td><td>${esc(i.creadoPorNombre)}</td><td>${esc(fechaCorta(i.fechaCreacion))}</td><td class="pr-url">${esc(urlSegura(i.url) || 'URL pendiente')}</td></tr>`).join('')}</tbody></table>`;
  S.secciones.forEach(sec => {
    const cats = S.categorias.filter(c => c.seccion === sec.id).map(c => ({ c, its: items.filter(i => i.categoriaId === c.id) })).filter(g => g.its.length);
    if (!cats.length) return;
    html += `<div class="pr-seccion">${esc(sec.nombre)}</div>`;
    cats.forEach(g => { html += `<div class="pr-cat"><span class="dot" style="background:${g.c.color}"></span>${esc(g.c.nombre)} (${g.its.length})</div>${tabla(g.its)}`; });
  });
  const huerfanos = items.filter(i => !S.catMap.has(i.categoriaId));
  if (huerfanos.length) html += `<div class="pr-cat">Sin categoría (${huerfanos.length})</div>${tabla(huerfanos)}`;
  if (!items.length) html += '<p>No hay enlaces con los filtros actuales.</p>';
  html += `<div class="pr-pie">Directorio Space 1.0 · PTM Banxico · v${esc(S.config.version || APP_VERSION)} · Documento de uso interno</div>`;
  $('#printReport').innerHTML = html;
  return items.length;
}
function imprimir() {
  if (!S.cargado) { toast('Espera a que cargue el directorio.', 'info'); return; }
  construirReporte();
  try { window.print(); } catch (e) { toast('No se pudo abrir el diálogo de impresión.', 'error'); }
}

/* ============ 21. Panel de administración ============ */
const TABS_ADMIN = [
  { id: 'resumen', etiqueta: 'Resumen', icono: 'chart' },
  { id: 'usuarios', etiqueta: 'Usuarios y roles', icono: 'users' },
  { id: 'categorias', etiqueta: 'Categorías', icono: 'layers' },
  { id: 'papelera', etiqueta: 'Papelera', icono: 'trash' },
  { id: 'bitacora', etiqueta: 'Bitácora', icono: 'history' },
  { id: 'datos', etiqueta: 'Datos', icono: 'database' }
];
function abrirPanelAdmin(tabInicial = 'resumen') {
  if (S.usuario.rol !== 'admin') { toast('El panel de administración es exclusivo para administradores.', 'error'); return; }
  let tab = tabInicial;
  let panel = null;
  let filtroBitacora = '';
  const m = Modales.abrir({
    titulo: 'Panel de administración', subtitulo: 'Roles, categorías, papelera, bitácora de actividad y datos del directorio', icono: 'settings', tamano: 'xl', clase: 'admin',
    cuerpo: `<div class="adm-tabs" role="tablist" aria-label="Secciones del panel"></div><div class="adm-body" role="tabpanel" id="admBody"><div class="cargando-bloque"><span class="spin"></span>Cargando panel…</div></div>`
  });
  const tabsEl = m.el.querySelector('.adm-tabs');
  const body = m.el.querySelector('#admBody');

  function pintarTabs() {
    tabsEl.innerHTML = TABS_ADMIN.map(t => {
      const cnt = !panel ? '' : t.id === 'papelera' ? panel.papelera.length : t.id === 'usuarios' ? panel.usuarios.length : t.id === 'categorias' ? S.categorias.length : '';
      return `<button type="button" class="adm-tab" role="tab" id="adm-${t.id}" aria-selected="${tab === t.id}" tabindex="${tab === t.id ? 0 : -1}" data-tab="${t.id}">${icon(t.icono)}${esc(t.etiqueta)}${cnt !== '' ? `<span class="cnt">${cnt}</span>` : ''}</button>`;
    }).join('');
    body.setAttribute('aria-labelledby', 'adm-' + tab);
  }
  async function cargar(silencioso = false) {
    if (!silencioso) body.innerHTML = '<div class="cargando-bloque"><span class="spin"></span>Cargando panel…</div>';
    try {
      panel = await Api.obtenerPanelAdmin();
      pintarTabs(); pintar();
    } catch (e) {
      body.innerHTML = `<div class="alerta alerta-error">${icon('alert')}<span>${esc(mensajeError(e))}</span></div><div style="margin-top:12px"><button type="button" class="btn btn-secondary" data-a="recargar">${icon('refresh')}Reintentar</button></div>`;
    }
  }
  /* Tras una escritura: recarga panel y catálogo en paralelo y vuelve a pintar con ambos actualizados */
  async function trasCambio() {
    await Promise.all([cargar(true), sincronizar({ silencioso: true })]);
    if (panel && !m.cerrado) { pintarTabs(); pintar(); }
  }

  function pintar() {
    if (!panel) return;
    const vistas = { resumen: vResumen, usuarios: vUsuarios, categorias: vCategorias, papelera: vPapelera, bitacora: vBitacora, datos: vDatos };
    body.innerHTML = (vistas[tab] || vResumen)();
    if (tab === 'bitacora') pintarBitacora();
  }

  function barras(pares, max) {
    return `<div class="barras">${pares.map(p => `<div class="barra" style="${varsColor(p.color)}"><span class="b-l" title="${esc(p.etiqueta)}"><span class="dot"></span><span class="t">${esc(p.etiqueta)}</span></span><span class="b-t"><span style="width:${max && p.valor ? Math.max(2, Math.round(p.valor / max * 100)) : 0}%"></span></span><span class="b-v">${fmtNum(p.valor)}</span></div>`).join('')}</div>`;
  }
  function vResumen() {
    const e = panel.estadisticas || {};
    const pc = e.porCategoria || {}, pe = e.porEstado || {};
    const cats = S.categorias.map(c => ({ etiqueta: c.nombre, valor: pc[c.id] || 0, color: c.color })).sort((a, b) => b.valor - a.valor);
    const maxC = Math.max(1, ...cats.map(c => c.valor));
    const ests = ESTADOS.map(s => ({ etiqueta: s.etiqueta, valor: pe[s.id] || 0, color: s.color }));
    const maxE = Math.max(1, ...ests.map(s => s.valor));
    const top = e.topContribuidores || [];
    const maxT = Math.max(1, ...top.map(t => t.total));
    const stat = (l, v, ic) => `<div class="stat"><div class="s-l">${icon(ic)}${esc(l)}</div><div class="s-v">${fmtNum(v)}</div></div>`;
    return `<div class="stats">${stat('Enlaces activos', e.totalItems, 'layout')}${stat('En papelera', e.totalEliminados, 'trash')}${stat('Usuarios', e.totalUsuarios, 'users')}${stat('Administradores', e.totalAdmins, 'shield')}${stat('Visitas totales', e.totalVisitas, 'eye')}</div>
      <div class="adm-cols">
        <div class="panel"><h3>${icon('layers')}Enlaces por categoría</h3>${barras(cats, maxC)}</div>
        <div>

            ${top.length ? `<div class="top-lista">${top.map(t => `<div class="top-item">${avatarHtml(t.nombre, t.email)}<div class="ti"><div>${esc(t.nombre)}</div><div class="e">${esc(t.email)}</div>

        </div>

      </form>
      <div class="t-scroll"><table class="t-simple"><thead><tr><th>Usuario</th><th>Rol</th><th>Último acceso</th><th class="t-num">Accesos</th><th class="t-num">Enlaces</th><th class="t-num">Acciones</th></tr></thead><tbody>
      ${filas.map(u => `<tr><td><div class="t-autor">${avatarHtml(u.nombre, u.email)}<div><div style="font-weight:600">${esc(u.nombre)}${u.email === S.usuario.email ? ' <span class="muted">(tú)</span>' : ''}</div><div class="muted" style="font-size:12px">${esc(u.email)}</div></div></div></td>
        <td>${rolBadge(u.rol)}${u.esPropietario ? ` <span class="muted" style="font-size:12px">${icon('lock')} Propietario</span>` : ''}</td>
        <td class="t-fecha">${u.ultimoAcceso ? `${esc(fechaCorta(u.ultimoAcceso))}<span class="rel">${esc(fechaRelativa(u.ultimoAcceso))}</span>` : '<span class="muted">—</span>'}</td>
        <td class="t-num">${fmtNum(u.accesos)}</td><td class="t-num">${fmtNum(u.totalEnlaces)}</td>
        <td class="t-num">${u.esPropietario ? `<span class="muted" style="font-size:12px" title="El propietario siempre es administrador">${icon('lock')}</span>`
          : u.rol === 'admin' ? `<button type="button" class="btn btn-secondary btn-sm" data-a="rol" data-email="${esc(u.email)}" data-rol="usuario">Quitar admin</button>`
          : `<button type="button" class="btn btn-secondary btn-sm" data-a="rol" data-email="${esc(u.email)}" data-rol="admin">${icon('shield')}Hacer admin</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  function vCategorias() {
    const conteo = {};
    S.items.forEach(i => { conteo[i.categoriaId] = (conteo[i.categoriaId] || 0) + 1; });
    return `<div class="adm-barra"><p class="muted" style="font-size:13px">Las categorías organizan el directorio por sección. Desactiva una categoría para ocultarla de los filtros sin perder sus enlaces.</p>
        <button type="button" class="btn btn-primary derecha" data-a="cat-nueva">${icon('plus')}Nueva categoría</button></div>
      <div class="t-scroll"><table class="t-simple"><thead><tr><th class="t-num">Orden</th><th>Categoría</th><th>Sección</th><th class="t-num">Enlaces</th><th>Estado</th><th class="t-num">Acciones</th></tr></thead><tbody>
      ${S.categorias.map(c => `<tr style="${varsColor(c.color)}"><td class="t-num">${fmtNum(c.orden)}</td>

  /* Importación: archivo elegido o arrastrado a la zona de carga */
  function leerArchivoImport(file) {
    if (!file) return;
    if (!/\.json$/i.test(file.name || '') && !/json/i.test(file.type || '')) { toast('Selecciona un archivo .json', 'error'); return; }
    const lector = new FileReader();
    lector.onload = () => {
      if (!body.querySelector('#admJson')) return;   // el usuario cambió de pestaña mientras se leía
      body.querySelector('#admJson').value = String(lector.result || '');
      body.querySelector('#admArchivo').textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
      try { const n = leerJsonImport().length; body.querySelector('#admJsonInfo').textContent = `${plural(n, 'enlace detectado', 'enlaces detectados')}. Revisa y pulsa Importar.`; }
      catch (ex) { body.querySelector('#admJsonInfo').textContent = ex.message; }
    };
    lector.onerror = () => toast('No se pudo leer el archivo.', 'error');
    lector.readAsText(file, 'utf-8');
  }
  m.el.addEventListener('change', (e) => {
    if (e.target.dataset.a !== 'archivo' || !e.target.files || !e.target.files[0]) return;
    leerArchivoImport(e.target.files[0]);
    e.target.value = '';
  });
  m.el.addEventListener('dragover', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');

    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';

  m.el.addEventListener('dragleave', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');
    if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('is-over');
  });
  m.el.addEventListener('drop', (e) => {
    const dz = e.target.closest && e.target.closest('[data-dropzone]');
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove('is-over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) leerArchivoImport(file); else toast('Arrastra un archivo .json', 'info');
  });
  pintarTabs();
  cargar();
}

      <div class="perfil-stats"><div class="stat"><div class="s-l">${icon('link')}Mis enlaces</div><div class="s-v">${fmtNum(mios.length)}</div></div>
        <div class="stat"><div class="s-l">${icon('eye')}Visitas</div><div class="s-v">${fmtNum(visitas)}</div></div>
        <div class="stat"><div class="s-l">${icon('star')}Favoritos</div><div class="s-v">${fmtNum(S.favoritos.size)}</div></div></div>
      ${puedeEscribir() ? `<form id="formPerfil" novalidate><div class="campo"><label for="pNombre">Nombre para mostrar</label>
        <div style="display:flex;gap:8px"><input type="text" id="pNombre" maxlength="60" value="${esc(u.nombre)}" style="flex:1"><button type="submit" class="btn btn-primary" id="pGuardar">${icon('check')}Guardar</button></div>
        <span class="ayuda">Se mostrará en los enlaces que subas a partir de ahora (2 a 60 caracteres).</span><span class="err" id="pErr"></span></div></form>`
        : `<div class="alerta alerta-warn">${icon('lock')}<span>Estás en modo consulta. Abre el directorio con tu cuenta corporativa para agregar enlaces y personalizar tu perfil.</span></div>`}`,
    pie: `${mios.length ? `<button type="button" class="btn btn-secondary" data-m="mios">${icon('filter')}Ver mis enlaces</button>` : ''}<button type="button" class="btn btn-secondary" data-cerrar>Cerrar</button>`
  });
  m.el.addEventListener('click', (e) => { if (e.target.closest('[data-m="mios"]')) { m.cerrar(true); aplicarFiltro({ soloMios: true }); } });
  const form = m.el.querySelector('#formPerfil');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre = m.el.querySelector('#pNombre').value.trim();
    const err = m.el.querySelector('#pErr');
    if (nombre.length < 2 || nombre.length > 60) { err.innerHTML = `${icon('alert')}<span>El nombre debe tener entre 2 y 60 caracteres.</span>`; return; }
    const btn = m.el.querySelector('#pGuardar');
    conCarga(btn, true);
    try {
      const r = await Api.actualizarMiPerfil(nombre);
      S.usuario.nombre = (r.usuario && r.usuario.nombre) || nombre;
      guardarCache();
      m.cerrar(true);
      render();
      toast('Perfil actualizado', 'success');
    } catch (ex) { conCarga(btn, false); err.innerHTML = `${icon('alert')}<span>${esc(mensajeError(ex))}</span>`; }
  });
}

function accionMenu(accion) {

/* ============ 24. Tema, vista y filtros ============ */
function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
}
function alternarTema() {
  const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  aplicarTema(nuevo);
  Almacen.set(CLAVES.TEMA, nuevo);
  render();
  toast(nuevo === 'dark' ? 'Tema oscuro activado' : 'Tema claro activado', 'info');
}
function cambiarVista(v) {
  S.vista = v === 'tabla' ? 'tabla' : 'tarjetas';
  Almacen.set(CLAVES.VISTA, S.vista);
  renderTopbar();
  renderDirectorio();
}
/** Aplica cambios de filtro; con limpiar=true parte de filtros vacíos. */
function aplicarFiltro(cambios, { limpiar = false, desplazar = true } = {}) {
  const qAntes = S.filtros.q;
  if (limpiar) S.filtros = { q: '', seccion: 'todo', cat: 'todos', estado: 'todos', soloMios: false, soloFavs: false, tag: '' };
  Object.assign(S.filtros, cambios);
  if ('q' in cambios || limpiar) { $('#q').value = S.filtros.q; ajustarOrdenPorBusqueda(qAntes); }
  renderDirectorio();
  if (desplazar) desplazarAResultados();
}
function ajustarOrdenPorBusqueda(qAntes) {
  const antes = terminos(qAntes).length > 0, ahora = terminos(S.filtros.q).length > 0;
  if (!antes && ahora && !S.ordenManual) S.orden = 'relevancia';
  if (!ahora && S.orden === 'relevancia') { S.orden = 'recientes'; S.ordenManual = false; }
}
function limpiarFiltros() {
  S.orden = 'recientes'; S.ordenManual = false; S.tablaOrden = null;
  aplicarFiltro({}, { limpiar: true, desplazar: false });
}
function desplazarAResultados() {
  const dock = $('#searchDock');
  const res = $('#resultados');
  if (!res || !dock) return;
  const top = res.getBoundingClientRect().top;
  const alto = dock.getBoundingClientRect().height + 16;
  if (top < alto || top > window.innerHeight * 0.75) {
    window.scrollTo({ top: Math.max(0, window.scrollY + top - alto - 140), behavior: reducirMovimiento() ? 'auto' : 'smooth' });
  }
}
function nuevoEnlace(categoriaId = '') {
  if (!puedeEscribir()) { toast('Estás en modo consulta. Abre el directorio con tu cuenta corporativa para agregar enlaces.', 'info'); return; }
  abrirFormulario(null, { categoriaId });
}
function enfocarBusqueda() { const q = $('#q'); q.focus(); q.select(); }

/* ============ 25. Eventos globales y atajos de teclado ============ */
const ACCIONES = {
  ficha: (el) => abrirFicha(el.dataset.id),
  fav: (el) => alternarFavorito(el.dataset.id),
  copiar: (el) => copiarEnlaceItem(el.dataset.id),
  editar: (el) => { const it = itemPorId(el.dataset.id); if (it) abrirFormulario(it, { enfocar: el.dataset.enfocar || '' }); },
  eliminar: (el) => eliminarItem(el.dataset.id),
  visita: (el) => registrarVisita(el.dataset.id),
  tag: (el) => { const t = el.dataset.valor; aplicarFiltro({ tag: S.filtros.tag.toLowerCase() === t.toLowerCase() ? '' : t }); },
  'nuevo-en-cat': (el) => nuevoEnlace(el.dataset.valor),
  seccion: (el) => {
    const s = el.dataset.valor;
    const cat = S.catMap.get(S.filtros.cat);
    aplicarFiltro({ seccion: s, cat: (s === 'todo' || (cat && cat.seccion === s)) ? S.filtros.cat : 'todos' }, { desplazar: false });
  },
  cat: (el) => {
    const v = el.dataset.valor;
    aplicarFiltro({ cat: S.filtros.cat === v && v !== 'todos' ? 'todos' : v }, { desplazar: false });
  },
  estado: (el) => aplicarFiltro({ estado: el.dataset.valor }, { desplazar: false }),
  'solo-mios': () => aplicarFiltro({ soloMios: !S.filtros.soloMios }, { desplazar: false }),
  'solo-favs': () => aplicarFiltro({ soloFavs: !S.filtros.soloFavs }, { desplazar: false }),
  'quitar-filtro': (el) => {
    const k = el.dataset.valor;
    const reinicio = { q: '', seccion: 'todo', cat: 'todos', estado: 'todos', soloMios: false, soloFavs: false, tag: '' };
    aplicarFiltro({ [k]: reinicio[k] }, { desplazar: false });
  },
  'limpiar-filtros': () => limpiarFiltros(),
  kpi: (el) => {
    const k = KPIS.find(x => x.id === el.dataset.valor);
    if (!k || !S.cargado) return;
    if (k.id === 'contrib') { abrirContribuidores(); return; }
    if (k.id === 'total') { limpiarFiltros(); desplazarAResultados(); return; }
    if (k.cat) { const c = S.catMap.get(k.cat); aplicarFiltro({ seccion: c ? c.seccion : 'todo', cat: k.cat }, { limpiar: true }); return; }
    if (k.seccion) aplicarFiltro({ seccion: k.seccion, cat: 'todos' }, { limpiar: true });
  },
  'wr-prev': () => moverWarroom(-1),
  'wr-next': () => moverWarroom(1),
  'tabla-orden': (el) => {
    const col = el.dataset.valor;
    const actual = ordenTablaActual();
    const porDefecto = (col === 'fecha' || col === 'visitas' || col === 'fav') ? 'desc' : 'asc';
    const dir = actual && actual.col === col ? (actual.dir === 'asc' ? 'desc' : 'asc') : porDefecto;
    S.tablaOrden = { col, dir };
    renderDirectorio();
  },
  agrupar: () => { S.agrupar = !S.agrupar; renderDirectorio(); },
  reintentar: () => sincronizar({ manual: true }),
  atajos: () => abrirAtajos()
};

function esCampoEditable(el) {
  if (!el) return false;
  const tag = el.tagName;
  return el.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function enlazarEventos() {
  /* Iconos estáticos de la barra superior */
  $('#btnRefrescar').innerHTML = icon('refresh');
  $('#qIcono').outerHTML = icon('search');
  $('#qClear').innerHTML = icon('x');
  $('[data-vista="tarjetas"]').innerHTML = `${icon('grid')}<span class="lbl-opt">Vista Tarjetas</span>`;
  $('[data-vista="tabla"]').innerHTML = `${icon('rows')}<span class="lbl-opt">Vista Tabla</span>`;
  $('#btnExportar').innerHTML = `${icon('download')}<span class="lbl-opt">Exportar Catálogo</span>`;
  $('#btnImprimir').innerHTML = `${icon('printer')}<span class="lbl-opt">Imprimir / PDF</span>`;
  if (/Mac|iPhone|iPad/.test(navigator.platform || '')) $('#kbdMod').textContent = '⌘';

  document.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('[data-menu]');
    if (menuBtn) { accionMenu(menuBtn.dataset.menu); return; }
    if (!e.target.closest('.user-wrap')) cerrarMenuUsuario();
    const el = e.target.closest('[data-accion]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    if (el.closest('.modal') && !['visita', 'tag', 'ficha', 'fav', 'nuevo-en-cat'].includes(el.dataset.accion)) return;
    const h = ACCIONES[el.dataset.accion];
    if (h) h(el, e);
  });
  /* Clic central en "Abrir" también cuenta como visita */
  document.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    const el = e.target.closest('[data-accion="visita"]');
    if (el) registrarVisita(el.dataset.id);
  });

  $('#btnNuevo').addEventListener('click', () => nuevoEnlace());
  $('#btnExportar').addEventListener('click', () => { if (S.cargado) abrirExportar(); else toast('Espera a que cargue el directorio.', 'info'); });
  $('#btnImprimir').addEventListener('click', imprimir);
  $('#btnRefrescar').addEventListener('click', () => sincronizar({ manual: true }));
  $$('.seg-glass [data-vista]').forEach(b => b.addEventListener('click', () => cambiarVista(b.dataset.vista)));
  $('#userChip').addEventListener('click', (e) => {
    e.stopPropagation();
    if ($('#userMenu').hidden) abrirMenuUsuario(); else cerrarMenuUsuario(true);
  });
  $('#userMenu').addEventListener('keydown', (e) => {
    const items = $$('.um-item', $('#userMenu'));
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Tab') cerrarMenuUsuario();
  });

  /* Buscador con debounce ≤ 80 ms */
  const q = $('#q');
  /* Marcador de posición corto en pantallas estrechas (evita que se corte a media palabra) */
  try {
    const largo = q.getAttribute('placeholder');
    const mq = window.matchMedia('(max-width: 560px)');
    const ajustar = () => q.setAttribute('placeholder', mq.matches ? 'Buscar nombre, #etiqueta, autor…' : largo);
    ajustar();
    if (mq.addEventListener) mq.addEventListener('change', ajustar); else if (mq.addListener) mq.addListener(ajustar);
  } catch (e) { /* sin matchMedia */ }
  const buscar = debounce(() => {
    const antes = S.filtros.q;
    S.filtros.q = q.value;
    ajustarOrdenPorBusqueda(antes);
    renderDirectorio();
  }, 70);
  q.addEventListener('input', () => { $('#qClear').hidden = !q.value; buscar(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); desplazarAResultados(); }
  });
  $('#qClear').addEventListener('click', () => { aplicarFiltro({ q: '' }, { desplazar: false }); q.focus(); });

  /* Controles que se re-renderizan: delegación de 'change' */
  document.addEventListener('change', (e) => {
    if (e.target.id === 'selOrden') {
      S.orden = e.target.value; S.ordenManual = true; S.tablaOrden = null;
      renderDirectorio();
      const sel = $('#selOrden'); if (sel) sel.focus();
    } else if (e.target.id === 'selIdentidad') {
      cambiarIdentidad(e.target.value);
    }
  });

  /* Navegación con flechas en pestañas (patrón tablist) */
  $('#tabs').addEventListener('keydown', (e) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    const tabs = $$('.tab', $('#tabs'));
    let i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    i = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    tabs[i].click();
    const nuevo = $$('.tab', $('#tabs'))[i];
    if (nuevo) nuevo.focus();
  });

  /* Atajos de teclado */
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (k === 'k' || k === 'K')) {
      e.preventDefault();
      if (!Modales.hay()) { cerrarMenuUsuario(); enfocarBusqueda(); }
      return;
    }
    if (k === 'Escape') {
      if (!$('#userMenu').hidden) { e.preventDefault(); cerrarMenuUsuario(true); return; }
      if (Modales.hay()) { e.preventDefault(); Modales.cerrarTope(); return; }
      if (document.activeElement === $('#q') || S.filtros.q) {
        e.preventDefault();
        if (S.filtros.q || $('#q').value) aplicarFiltro({ q: '' }, { desplazar: false }); else $('#q').blur();
      }
      return;
    }
    if (k === 'Tab' && Modales.hay()) {
      const modal = Modales.tope().el;
      const f = enfocables(modal);
      if (!f.length) { e.preventDefault(); modal.focus(); return; }
      const primero = f[0], ultimo = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === primero || !modal.contains(document.activeElement))) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && (document.activeElement === ultimo || !modal.contains(document.activeElement))) { e.preventDefault(); primero.focus(); }
      return;
    }
    if (Modales.hay() || esCampoEditable(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === '/') { e.preventDefault(); enfocarBusqueda(); }
    else if (k === 'n' || k === 'N') { e.preventDefault(); nuevoEnlace(); }
    else if (k === 'v' || k === 'V') { e.preventDefault(); cambiarVista(S.vista === 'tarjetas' ? 'tabla' : 'tarjetas'); }
    else if (k === '?') { e.preventDefault(); abrirAtajos(); }
  });

  /* El tablero agrupado calcula sus columnas: se re-pinta si cambia el ancho disponible */
  if ('ResizeObserver' in window) {
    new ResizeObserver(debounce(() => {
      if (S.cargado && esAgrupado() && columnasTablero() !== S.colsTablero) renderResultados();
    }, 80)).observe($('#resCuerpo'));
  }
  /* Buscador fijo: se detecta cuando queda "pegado" arriba */
  const sentinel = $('#stickySentinel');
  if ('IntersectionObserver' in window && sentinel) {
    new IntersectionObserver(([ent]) => $('#searchDock').classList.toggle('fijo', !ent.isIntersecting && ent.boundingClientRect.top < 0), { threshold: 0 }).observe(sentinel);
  }
  /* Volver a calcular fechas relativas y colores tras cambios de tema del sistema */
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (ev) => {
      if (Almacen.get(CLAVES.TEMA)) return;
      aplicarTema(ev.matches ? 'dark' : 'light'); render();
    });
  } catch (e) { /* navegadores antiguos */ }
}

/* ============ 26. Sincronización, caché y deep links ============ */
async function sincronizar({ manual = false, silencioso = false } = {}) {
  if (S.sincronizando) return S.promesaSync;
  S.sincronizando = true;
  S.syncEstado = 'sincronizando';
  renderSync();
  S.promesaSync = (async () => {
    try {
      const r = await Api.obtenerCatalogoHerramientas();
      aplicarCatalogo(r, { desdeCache: false });
      S.errorSync = '';
      S.syncEstado = 'ok';
      S.ultimaSync = new Date();
      guardarCache();
      if (manual) toast('Directorio sincronizado', 'success');
    } catch (e) {
      S.errorSync = mensajeError(e);
      S.syncEstado = 'error';
      if (manual || !silencioso) toast('No se pudo sincronizar: ' + S.errorSync, 'error');
    } finally {
      S.sincronizando = false;
      render();
      aplicarParametros();
    }
  })();
  return S.promesaSync;
}

/** Lee parámetros q, cat, seccion, id (GAS: google.script.url; local: location.search). */
function leerParametros() {
  return new Promise((resolve) => {
    if (ES_GAS && google.script.url && typeof google.script.url.getLocation === 'function') {
      let listo = false;
      const fin = (p) => { if (!listo) { listo = true; resolve(p || {}); } };
      try { google.script.url.getLocation(loc => fin((loc && loc.parameter) || {})); } catch (e) { fin({}); }
      setTimeout(() => fin({}), 4000);
      return;
    }
    const p = {};
    try { new URLSearchParams(location.search).forEach((v, k) => { p[k] = v; }); } catch (e) { /* sin parámetros */ }
    resolve(p);
  });
}
function aplicarParametros() {
  if (S.paramsAplicados || !S.params || !S.cargado) return;
  S.paramsAplicados = true;
  const p = S.params;
  const cambios = {};
  if (p.q) cambios.q = String(p.q).slice(0, 200);
  if (p.seccion && S.secMap.has(p.seccion)) cambios.seccion = p.seccion;
  if (p.cat && S.catMap.has(p.cat)) {
    cambios.cat = p.cat;
    if (!cambios.seccion) cambios.seccion = S.catMap.get(p.cat).seccion;
  }
  if (Object.keys(cambios).length) aplicarFiltro(cambios, { desplazar: false });
  if (p.id) {
    if (itemPorId(String(p.id))) abrirFicha(String(p.id));
    else toast('El enlace solicitado no existe o fue eliminado.', 'error');
  }
}

/* ============ 27. Arranque ============ */
async function iniciar() {
  S.vista = Almacen.get(CLAVES.VISTA) === 'tabla' ? 'tabla' : 'tarjetas';
  enlazarEventos();
  leerParametros().then(p => { S.params = p; aplicarParametros(); });
  if (S.modo === 'gas') {
    const c = Almacen.getJSON(CLAVES.CACHE, null);
    if (c && c.datos && Array.isArray(c.datos.items)) {
      try { aplicarCatalogo(c.datos, { desdeCache: true }); S.ultimaSync = aFecha(c.guardado); } catch (e) { S.cargado = false; }
    }
  }
  render();
  await sincronizar({ silencioso: S.cargado });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();
</script>
